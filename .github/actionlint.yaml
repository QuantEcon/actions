# actionlint's configuration. The gate runs actionlint over .github/workflows/
# (see test-actions.yml); with no -config-file it reads this file.
paths:
  # The step-summary tag list in each image's job, which validate-containers.yml
  # now writes with awk. Left unfixed here because a push to main that edits
  # this file rebuilds both images and moves :latest. Fix it, and drop this
  # entry, in the next change to the file: #142 phase 2.
  .github/workflows/build-containers.yml:
    ignore:
      - 'SC2001:style:7:24:'
      - 'SC2016:info:7:28:'
