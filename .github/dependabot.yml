# Dependabot configuration.
#
# Dependabot PRs run as `dependabot[bot]`, which the preview-* actions already
# skip (no secret access), so these PRs won't trigger preview deploys.
#
# Each ecosystem uses two groups so updates land as at most two PRs (no
# per-directory duplicates):
#   - "<eco>"        — minor/patch updates (low risk; safe to merge together)
#   - "<eco>-major"  — major updates (review carefully before merging)
# Specific updates we're not ready for are blocked outright via `ignore`.
version: 2
updates:
  # ── Conda environments (container images) ──────────────────────────────────
  # The conda ecosystem (GA Dec 2025) tracks the `pip:` block (jupyter-book,
  # quantecon-book-theme, the sphinx-* extensions, kaleido) via PyPI, and also
  # proposes version-range bumps for conda-only deps. Node is not a conda dep: it
  # is pinned by version and SHA256 in each Dockerfile, which no ecosystem here
  # tracks, so bump it by hand. The core scientific stack (numpy, scipy,
  # pandas, … and the `anaconda` metapackage) is held at the 2026.06 baseline via
  # `ignore` below — a date-pin like `=2026.06` does NOT stop Dependabot proposing
  # the next release, so each is listed explicitly.
  - package-ecosystem: "conda"
    directories:
      - "/containers/quantecon"
      - "/containers/quantecon-build"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
    commit-message:
      prefix: "deps"
    groups:
      conda:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      conda-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Python is pinned deliberately (matched to the image base); bump manually.
      - dependency-name: "python"
      # Core scientific stack — held at the Anaconda 2026.06 baseline the lecture
      # repos build against (see containers/quantecon-build/environment.yml, issue
      # #28 / PR #84). Pinned individually in the lean image and via the `anaconda`
      # metapackage in the full image; bump them together, manually, in step with
      # the lecture repos on the next Anaconda release. Ignore every update type so
      # Dependabot neither drifts them individually (minor/patch, e.g. numpy past
      # 2.4.6) nor jumps the next major ahead of that coordinated bump.
      - dependency-name: "numpy"
      - dependency-name: "scipy"
      - dependency-name: "pandas"
      - dependency-name: "matplotlib"
      - dependency-name: "seaborn"
      - dependency-name: "sympy"
      - dependency-name: "numba"
      - dependency-name: "networkx"
      - dependency-name: "statsmodels"
      - dependency-name: "scikit-learn"
      - dependency-name: "anaconda"
      # jupyter-book 2.x is a major rewrite — stay on 1.x until we opt in.
      - dependency-name: "jupyter-book"
        update-types: ["version-update:semver-major"]
      # icu is held in the lean image at the version the old conda nodejs pinned,
      # so dropping nodejs did not re-solve the native stack; bump it with the
      # next Anaconda baseline, not on its own.
      - dependency-name: "icu"

  # ── Third-party GitHub Actions ─────────────────────────────────────────────
  # "/" covers .github/workflows/; for github-actions, composite actions in
  # subdirectories must each be listed explicitly (Dependabot only scans the
  # given directory's action.yml, not nested ones). The two groups collapse the
  # same action repeated across these directories into a single PR.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/setup-environment"
      - "/build-lectures"
      - "/build-jupyter-cache"
      - "/restore-jupyter-cache"
      - "/preview-netlify"
      - "/preview-cloudflare"
      - "/deploy-cloudflare"
      - "/publish-gh-pages"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Don't propose bumps to our own internal sibling references (floating @v0).
      - dependency-name: "quantecon/actions*"

  # ── npm (deploy-cloudflare's wrangler) ─────────────────────────────────────
  # deploy-cloudflare installs wrangler with `npm ci` from the lockfile in its
  # own directory, so the exact version is committed and bumps arrive here.
  # The action harness dry-runs the generated config through the bumped
  # wrangler (dc-wrangler-config), so a bump that breaks it goes red in CI.
  - package-ecosystem: "npm"
    directories:
      - "/deploy-cloudflare"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  # ── Container base image ───────────────────────────────────────────────────
  # Tracks the `FROM ubuntu:24.04` base in each Dockerfile (not the Miniconda
  # installer, which is pinned + checksummed in the RUN step).
  - package-ecosystem: "docker"
    directories:
      - "/containers/quantecon"
      - "/containers/quantecon-build"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
    commit-message:
      prefix: "deps"
    groups:
      docker:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      docker-major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Stay on the 24.04 LTS base; bump deliberately when moving to the next LTS.
      - dependency-name: "ubuntu"

  # ── Preview-action CLIs (npm) ──────────────────────────────────────────────
  # preview-cloudflare and preview-netlify install wrangler and netlify-cli with
  # `npm ci` from the package.json + package-lock.json beside each action.yml,
  # pinned to an exact version because the CLI is handed the deploy token
  # (#105). The groups bump both CLIs in one PR (a second one for majors). As the
  # header says, such a PR cannot run a preview deploy, so the harness's
  # preview-cli-install job — an `npm ci` from each lockfile plus `--version` —
  # is its only CI signal.
  - package-ecosystem: "npm"
    directories:
      - "/preview-cloudflare"
      - "/preview-netlify"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "maintenance"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
