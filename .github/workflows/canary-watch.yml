name: Canary Watch

# Watches the canary, QuantEcon/test-actions-lecture-intro, whose scheduled
# workflows run the released actions through @v0 between releases (#302).
# Nobody watches a scheduled run, and a disabled schedule runs nothing at
# all, so a check inside the canary cannot report that. This one runs here,
# in a repository that is never idle, and reads the canary through the API.
# scripts/canary-watch.sh says what it checks, and the harness's
# canary-watch job self-tests it.
#
#   schedule           daily. A red verdict opens the `canary` issue, or
#                      comments on the open one when the findings change,
#                      and assigns it to the logins in the CANARY_ASSIGNEES
#                      repository variable. A green one notes once, on the
#                      open issue, that the canary is green again, so the
#                      same red later is reported afresh.
#   workflow_dispatch  the same verdict, in the run only: someone is
#                      watching it.
on:
  schedule:
    - cron: '30 6 * * *'   # daily; on Sunday, after the canary's runs and before Monday's consumer builds
  workflow_dispatch:

concurrency:
  group: canary-watch
  cancel-in-progress: false

permissions: {}

env:
  CANARY_REPO: QuantEcon/test-actions-lecture-intro
  # The canary's scheduled workflows, each weekly. ci.yml and publish.yml
  # join once the canary schedules them (#302).
  CANARY_WORKFLOWS: cache.yml
  # A week and a day. While a weekly schedule runs, its newest run is never
  # more than 168 hours old, and the day allows for GitHub's delays and for
  # this watcher's time of day. A run due on Sunday that never comes turns
  # the watcher red on Monday.
  MAX_AGE_HOURS: '192'

jobs:
  watch:
    name: Watch the canary's scheduled runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # checkout; the canary is public, so reading it needs no grant
    outputs:
      findings: ${{ steps.check.outputs.findings }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the canary's workflows and their newest scheduled runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          findings="$RUNNER_TEMP/findings.md"
          status=0
          scripts/canary-watch.sh > "$findings" || status=$?
          [ -s "$findings" ] \
            || echo "- 🔴 The watcher stopped before it reached a verdict (exit $status): see the run's log." > "$findings"
          cat "$findings"
          {
            echo "### The canary's scheduled workflows"
            echo
            cat "$findings"
          } >> "$GITHUB_STEP_SUMMARY"
          delim="FINDINGS_$(openssl rand -hex 16)"
          {
            echo "findings<<$delim"
            cat "$findings"
            echo "$delim"
            if [ "$status" -eq 0 ]; then echo "red=false"; else echo "red=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Fail when the canary needs attention
        if: steps.check.outputs.red != 'false'
        run: |
          echo "::error::the canary needs attention: see this run's summary"
          exit 1

  # The schedule runs unattended, and a dispatch has someone watching it.
  # Every scheduled run reports, green or red: the issue records each change
  # of state.
  report:
    name: Report on the canary issue
    needs: watch
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write   # the issue, its comments and its label
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record the verdict on the canary issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEES: ${{ vars.CANARY_ASSIGNEES }}
          FINDINGS: ${{ needs.watch.outputs.findings }}
          WATCH_RESULT: ${{ needs.watch.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s\n' "$FINDINGS" > "$RUNNER_TEMP/findings.md"
          scripts/canary-watch.sh --report "$RUNNER_TEMP/findings.md"
