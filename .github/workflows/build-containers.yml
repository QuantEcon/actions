name: Build QuantEcon Containers

# Builds the images, tests them, and only then moves :latest, which every
# consumer pulls (#142, phase 2):
#   plan     which images to build, and the run's candidate tag,
#            <branch>-<YYYYMMDD>-<HHMMSS>-<sha7>, the same in each image.
#   build-*  each image, pushed as <branch>-<sha7> and the candidate tag.
#            Never :latest.
#   smoke    test-container.yml's smoke test, on the candidates.
#   size     its size report, beside the smoke test.
#   promote  once every smoke test has passed, points :latest at each digest
#            the builds pushed, all together (scripts/promote-image.sh).
#            From any ref but main it is a dry run, so a dispatch from a
#            branch tests the whole run without moving :latest.
# test-containers-lectures.yml then builds the lecture repositories against
# the promoted :latest.

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      # READMEs only: the Dockerfiles COPY nothing but environment.yml, so a
      # README edit cannot change an image, and without this it rebuilds and
      # promotes both images and re-runs the lecture matrix.
      # Not every .md: the smoke-test fixture's pages under tests/ are
      # Markdown, and an edit there must still reach the smoke test.
      - '!containers/**/README.md'
      - '.github/workflows/build-containers.yml'
  # No schedule (#235). Both Dockerfiles pin their base by digest, so a
  # scheduled run would replay every layer from cache and republish the same
  # image. OS updates arrive when Dependabot proposes a new base digest, as a
  # pull request whose images are built and tested before it merges.
  workflow_dispatch:
    inputs:
      container:
        description: 'Container to build (all, quantecon, quantecon-build)'
        required: false
        default: 'all'

# Only the promote job moves :latest, in the same run as the builds it
# promotes. Cancelling an older run when a newer one starts keeps an older
# candidate from being promoted after a newer one.
concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR image paths must be lowercase, so `github.repository_owner` (which
  # preserves the `QuantEcon` casing) cannot be substituted into an image ref.
  # buildx treats a rejected cache ref as non-fatal, so getting this wrong makes
  # every build silently cold rather than failing.
  IMAGE_NAMESPACE: quantecon

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      images: ${{ steps.plan.outputs.images }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # One tag for the run, so one smoke test covers every image it built.
      # The time makes it unique to the build: a dispatch of an unmoved main
      # reuses main-<sha7>.
      - name: Decide which images to build, and the candidate tag
        id: plan
        env:
          CONTAINER: ${{ inputs.container || 'all' }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case $CONTAINER in
            all) images='["quantecon","quantecon-build"]' ;;
            quantecon | quantecon-build) images="[\"$CONTAINER\"]" ;;
            *) echo "::error::the container input must be all, quantecon or quantecon-build"; exit 1 ;;
          esac
          # A tag cannot hold a slash, so a branch's other characters become dashes.
          tag="${REF_NAME//[^A-Za-z0-9._-]/-}-$(date -u +%Y%m%d-%H%M%S)-${SHA:0:7}"
          [[ $tag =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::[$tag] is not an image tag"; exit 1; }
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $images and testing them as \`$tag\`." | tee -a "$GITHUB_STEP_SUMMARY"

  build-quantecon:
    name: Build quantecon (Full)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.images), 'quantecon')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon
          # metadata-action adds `latest` by itself for some tag types.
          flavor: latest=false
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=${{ needs.plan.outputs.tag }}

      # Only the promote job moves :latest, after the smoke test. This holds
      # the tags above there through later edits.
      - name: Refuse :latest, and any tag but the two above
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon
          TAGS: ${{ steps.meta.outputs.tags }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            [[ $ref == "$IMAGE:$TAG" || $ref =~ ^"$IMAGE":[A-Za-z0-9._-]+-"${SHA:0:7}"$ ]] \
              || { echo "::error::refusing to push [$ref]: a build pushes only $IMAGE:$TAG and $IMAGE:<branch>-${SHA:0:7}, never :latest"; exit 1; }
            n=$((n + 1))
          done <<< "$TAGS"
          if [ "$n" -ne 2 ] || ! grep -qxF "$IMAGE:$TAG" <<< "$TAGS"; then
            echo "::error::expected $IMAGE:$TAG and $IMAGE:<branch>-${SHA:0:7}, got [$TAGS]"
            exit 1
          fi

      - name: Build and push quantecon container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/quantecon
          file: containers/quantecon/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon:latest
          cache-to: type=inline

      # The promote job's summary has the rollback handle.
      - name: Write the pushed digest to the step summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### \`$IMAGE\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Pushed** | \`$IMAGE@$DIGEST\` |"
            echo "| **Tags** | $(awk -F: '{ printf "%s`%s`", (NR > 1 ? " " : ""), $NF }' <<< "$TAGS") |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-quantecon-build:
    name: Build quantecon-build (Lean)
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.images), 'quantecon-build')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build
          # metadata-action adds `latest` by itself for some tag types.
          flavor: latest=false
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=${{ needs.plan.outputs.tag }}

      # As build-quantecon above.
      - name: Refuse :latest, and any tag but the two above
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build
          TAGS: ${{ steps.meta.outputs.tags }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          n=0
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            [[ $ref == "$IMAGE:$TAG" || $ref =~ ^"$IMAGE":[A-Za-z0-9._-]+-"${SHA:0:7}"$ ]] \
              || { echo "::error::refusing to push [$ref]: a build pushes only $IMAGE:$TAG and $IMAGE:<branch>-${SHA:0:7}, never :latest"; exit 1; }
            n=$((n + 1))
          done <<< "$TAGS"
          if [ "$n" -ne 2 ] || ! grep -qxF "$IMAGE:$TAG" <<< "$TAGS"; then
            echo "::error::expected $IMAGE:$TAG and $IMAGE:<branch>-${SHA:0:7}, got [$TAGS]"
            exit 1
          fi

      - name: Build and push quantecon-build container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/quantecon-build
          file: containers/quantecon-build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build:latest
          cache-to: type=inline

      - name: Write the pushed digest to the step summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### \`$IMAGE\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Pushed** | \`$IMAGE@$DIGEST\` |"
            echo "| **Tags** | $(awk -F: '{ printf "%s`%s`", (NR > 1 ? " " : ""), $NF }' <<< "$TAGS") |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Two calls of test-container.yml, because a called workflow is one job to
  # its caller, and promote must wait on the smoke test alone. The size report
  # fails when it cannot compute a figure, as it did when the runner image
  # moved to the containerd image store: a fault in the measurement, not in
  # the image. So it runs beside the smoke test, alerts through
  # notify-failure, and does not hold the promotion back.
  #
  # Both run unless plan or a build failed, or the run was cancelled: a build
  # that plan left out is skipped, and that must not skip these.
  smoke:
    name: Smoke test
    needs: [plan, build-quantecon, build-quantecon-build]
    if: ${{ always() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    # A ceiling for test-container.yml, not a grant: each of its jobs sets
    # its own permissions.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-container.yml
    with:
      images: ${{ needs.plan.outputs.images }}
      tag: ${{ needs.plan.outputs.tag }}
      checks: smoke

  size:
    name: Image size
    needs: [plan, build-quantecon, build-quantecon-build]
    if: ${{ always() && needs.plan.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test-container.yml
    with:
      images: ${{ needs.plan.outputs.images }}
      tag: ${{ needs.plan.outputs.tag }}
      checks: size

  # Every image the run built, together, and only if every smoke test passed,
  # so the two :latest tags never sit on different stacks. A failure here
  # leaves :latest where it was, and notify-failure reports it.
  promote:
    name: ${{ github.ref == 'refs/heads/main' && 'Promote to :latest' || 'Promote to :latest (dry run)' }}
    needs: [plan, build-quantecon, build-quantecon-build, smoke]
    if: ${{ always() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # As the builds, so the buildx that promotes is the one each pull
      # request's dry run of this script used.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at the digests the smoke test passed
        env:
          OWNER: ${{ env.IMAGE_NAMESPACE }}
          TAG: ${{ needs.plan.outputs.tag }}
          IMAGES: ${{ needs.plan.outputs.images }}
          QUANTECON: ${{ needs.build-quantecon.outputs.digest }}
          QUANTECON_BUILD: ${{ needs.build-quantecon-build.outputs.digest }}
          DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail
          docker buildx version
          # Every image plan chose, so a build that reported no digest fails
          # the promotion rather than drop out of it.
          args=()
          for image in $(jq -r '.[]' <<< "$IMAGES"); do
            case $image in
              quantecon) args+=("$image@$QUANTECON") ;;
              quantecon-build) args+=("$image@$QUANTECON_BUILD") ;;
              *) echo "::error::no build job for [$image]"; exit 1 ;;
            esac
          done
          scripts/promote-image.sh "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

  # Push runs have nobody watching them; dispatches do. A failed smoke test or
  # promotion leaves :latest where it was, so without this an image change
  # could stop reaching consumers without a word.
  #
  # `cancelled` alerts as well as `failure`, since a job killed by
  # timeout-minutes concludes cancelled. But cancel-in-progress also cancels
  # a run that a newer one superseded, and the newer run reports for itself,
  # so a cancelled run alerts only when no newer run of this workflow exists
  # on its branch: the false alarm of #249, otherwise.
  notify-failure:
    name: Report failure
    runs-on: ubuntu-latest
    needs: [plan, build-quantecon, build-quantecon-build, smoke, size, promote]
    if: ${{ always() && github.event_name != 'workflow_dispatch' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check whether a newer run superseded this one
        id: superseded
        if: ${{ !contains(needs.*.result, 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # If the runs cannot be listed, report the cancellation.
          if ! newer=$(gh run list --repo "$REPO" --workflow build-containers.yml --branch "$BRANCH" --limit 20 --json number \
              | jq --argjson n "$RUN_NUMBER" '[.[] | select(.number > $n)] | length'); then
            echo "::warning::cannot list this workflow's runs, so the cancellation is reported"
            exit 0
          fi
          if [ "$newer" -gt 0 ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Cancelled, and $newer newer run(s) of this workflow exist on $BRANCH, which report for themselves: no issue filed."
          fi

      - name: Open or update the failure tracking issue
        if: steps.superseded.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_LABELS: bug,infrastructure
        run: ./scripts/create-ci-failure-issue.sh
