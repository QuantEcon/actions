name: Build QuantEcon Containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      # READMEs only: the Dockerfiles COPY nothing but environment.yml, so a
      # README edit cannot change an image, and without this it rebuilds and
      # pushes both :latest tags and re-runs the container test workflows.
      # Not every .md: the smoke-test fixture's pages under tests/ are
      # Markdown, and an edit there must still reach test-container.yml.
      - '!containers/**/README.md'
      - '.github/workflows/build-containers.yml'
  # No schedule (#235). Both Dockerfiles pin their base by digest, so a
  # scheduled run would replay every layer from cache and republish the same
  # image. OS updates arrive when Dependabot proposes a new base digest, as a
  # pull request whose images are built and tested before it merges.
  workflow_dispatch:
    inputs:
      container:
        description: 'Container to build (all, quantecon, quantecon-build)'
        required: false
        default: 'all'

# Both jobs push `:latest`, and every consumer pins `:latest`. Without this the
# older of two overlapping runs can finish last and win the tag.
concurrency:
  group: build-containers-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR image paths must be lowercase, so `github.repository_owner` (which
  # preserves the `QuantEcon` casing) cannot be substituted into an image ref.
  # buildx treats a rejected cache ref as non-fatal, so getting this wrong makes
  # every build silently cold rather than failing.
  IMAGE_NAMESPACE: quantecon

jobs:
  build-quantecon:
    name: Build quantecon (Full)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.container == 'all' || github.event.inputs.container == 'quantecon' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=raw,value={{branch}}-{{date 'YYYYMMDD-HHmmss'}}-{{sha}}

      # The rollback handle (#142). Each run records the digest it pushed and
      # the one :latest held before it, so the run that broke an image names
      # the image to roll back to. The dated tag above names each build
      # immutably, so the same image can also be found by date in GHCR:
      # main-<sha> cannot, since a dispatched rebuild of an unmoved main reuses it.
      - name: Record what :latest points at before the push
        id: before
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest) || digest=''
          if [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not read $IMAGE:latest, so the step summary will have no rollback target"
          fi

      - name: Build and push quantecon container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/quantecon
          file: containers/quantecon/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon:latest
          cache-to: type=inline

      - name: Write the rollback handle to the step summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon
          DIGEST: ${{ steps.build.outputs.digest }}
          BEFORE: ${{ steps.before.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### \`$IMAGE\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Pushed** | \`$IMAGE@$DIGEST\` |"
            echo "| **Tags** | $(sed 's/^.*:\(.*\)$/`\1`/' <<< "$TAGS" | paste -sd' ' -) |"
            if [ -n "$BEFORE" ]; then
              echo "| **\`:latest\` before this run** | \`$IMAGE@$BEFORE\` |"
              echo
              echo "To put \`:latest\` back: \`docker buildx imagetools create --tag $IMAGE:latest $IMAGE@$BEFORE\`"
            else
              echo "| **\`:latest\` before this run** | unknown |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-quantecon-build:
    name: Build quantecon-build (Lean)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.container == 'all' || github.event.inputs.container == 'quantecon-build' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-
            type=raw,value={{branch}}-{{date 'YYYYMMDD-HHmmss'}}-{{sha}}

      # The rollback handle: see build-quantecon above.
      - name: Record what :latest points at before the push
        id: before
        shell: bash
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Manifest}}' | jq -r .digest) || digest=''
          if [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not read $IMAGE:latest, so the step summary will have no rollback target"
          fi

      - name: Build and push quantecon-build container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: containers/quantecon-build
          file: containers/quantecon-build/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build:latest
          cache-to: type=inline

      - name: Write the rollback handle to the step summary
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/quantecon-build
          DIGEST: ${{ steps.build.outputs.digest }}
          BEFORE: ${{ steps.before.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### \`$IMAGE\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **Pushed** | \`$IMAGE@$DIGEST\` |"
            echo "| **Tags** | $(sed 's/^.*:\(.*\)$/`\1`/' <<< "$TAGS" | paste -sd' ' -) |"
            if [ -n "$BEFORE" ]; then
              echo "| **\`:latest\` before this run** | \`$IMAGE@$BEFORE\` |"
              echo
              echo "To put \`:latest\` back: \`docker buildx imagetools create --tag $IMAGE:latest $IMAGE@$BEFORE\`"
            else
              echo "| **\`:latest\` before this run** | unknown |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Report failure
    runs-on: ubuntu-latest
    needs: [build-quantecon, build-quantecon-build]
    # Push runs have nobody watching them. Manual dispatches do.
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Open or update the failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_LABELS: bug,infrastructure
        run: ./scripts/create-ci-failure-issue.sh
