# Action-level PR harness (issue #100, stage 1).
#
# Exercises the composite actions in this repo via `uses: ./<action>` — the
# code on the PR, not a released ref — and asserts on their outputs and on the
# filesystem. This is the permanent form of the throwaway harness that verified
# the #104 fix (restore-jupyter-cache save-mode outputs dead on arrival).
#
# Determinism: every job seeds its fixture with a salt derived from
# run_id + run_attempt, so cache keys are unique per run and a "miss"
# assertion can never be polluted by caches from earlier runs, re-runs, or
# other branches. Jobs that must see each other's caches recreate the fixture
# byte-for-byte and are ordered with `needs:` (actions/cache saves are visible
# across jobs of the same run).
#
# Consequence: "Re-run failed jobs" can never go green. It increments
# run_attempt — and therefore the salt, and therefore every cache key — but
# does NOT re-run the already-green seed jobs, so unit-build-restore,
# unit-build-restore-save, unit-exec-restore*, env-hit-build and the bjc-*
# round-trips all end up looking for caches nobody saved under the new salt.
# Always use "Re-run all jobs". Do not "fix" this by dropping run_attempt from
# the salt: run_id alone would let attempt 2 reuse attempt 1's caches and
# silently invalidate the miss assertions.
#
# Two constraints shape what this harness can and cannot assert:
#
#   1. actions/cache matches a key only when the cache "version" (a hash of
#      the `path` input) also matches — so every restore here uses the same
#      path the corresponding save used.
#   2. The execution cache keeps a bare `jupyter-cache-` restore-key fallback
#      (deliberately — .jupyter_cache is content-addressed and revalidates
#      itself), so a *genuine miss* for the execution type is not constructible
#      once any execution cache exists in scope. Miss assertions therefore use
#      the build type, whose fallbacks all include the salted env hash.
#
# Structural limitation (see #100 for the full argument): build-jupyter-cache
# calls setup-environment and build-lectures at the pinned @v0 ref, and
# GitHub does not allow expressions in `uses:`. The bjc-smoke job below runs
# the PR's build-jupyter-cache logic, but its internal sibling calls execute
# @v0 regardless. Covering that chain pre-release would take rewriting those
# four `uses:` lines to ./setup-environment and ./build-lectures before the
# step runs (a nested `./` resolves against the workspace, which the #143
# spike confirmed), and the job would then test a patched action.yml. This
# harness does not do that, so the post-release canary (stage 2 of #100) owns
# the chain.

name: Test Actions

# Deliberately NO `paths:` filter on either trigger. A path filter suppresses
# creation of the workflow RUN, not just its jobs, so no check run is ever
# published for that SHA and a required `Action harness: all checks` sits in
# "Expected — waiting for status to be reported" forever. GitHub documents this
# exactly ("Troubleshooting required status checks", Handling skipped but
# required checks): a workflow skipped by path filtering leaves checks pending
# and blocks merging, whereas a job skipped by a conditional reports Success.
# So the workflow always runs, and the `gate` job below decides per-job
# relevance instead. Do not re-add `paths:` here — see CONTRIBUTING.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: test-actions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SALT: ${{ github.run_id }}-${{ github.run_attempt }}
  # templates/ci.yml's pdf-check switch, set where the template sets it, so the
  # pdf-check-* jobs below run the template's plumbing (see their header).
  PDF_CHECK: 'true'

jobs:
  # ==========================================================================
  # Relevance gate — replaces the `paths:` filters this workflow used to carry.
  # ==========================================================================

  gate:
    name: 'Action harness: relevance gate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-scoped, not workflow-scoped. On a fork `pull_request` the other jobs
    # execute PR-authored composite-action code via `uses: ./`, and none of them
    # needs a pull-request scope. Job-level grants are additive over the
    # workflow level (workflow-syntax: permissions are "adjusted based on any
    # configuration within the workflow file, first at the workflow level and
    # then at the job level").
    permissions:
      contents: read        # checkout, and the compare API on push
      pull-requests: read   # pulls/{n}/files on pull_request
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The docs checks below run the PR's own scripts, and nothing in this
          # job needs git credentials: the API calls use GH_TOKEN.
          persist-credentials: false

      - name: Decide whether this event touches anything the harness covers
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # An IGNORE list, not a cover list, and the direction is the whole
          # point. `Action harness: all checks` is a required check, so the
          # expensive mistake is a green earned by running nothing. Anything
          # unrecognised — a new action directory, a new fixture, a new helper —
          # therefore makes the harness RUN. Forgetting to extend this list
          # costs CI minutes (free on a public repo); forgetting to extend a
          # cover list would silently rubber-stamp untested action changes.
          #
          # The docs generator, the shell lint and their requirements file are
          # listed because no harness job uses them: the gate's own checks below
          # are their test.
          IGNORED='^(AGENTS|CHANGELOG|README|CONTRIBUTING|SECURITY)\.md$|^LICENSE$|^\.gitignore$|^docs/|^tests/|^templates/|^\.github/(ISSUE_TEMPLATE|PULL_REQUEST_TEMPLATE|dependabot\.yml)|^[A-Za-z0-9_.-]+/README\.md$|^scripts/(generate-docs\.py|lint-shell\.py|requirements\.txt)$'

          run_everything() { echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "$1"; exit 0; }

          # Self-test. A typo that widens IGNORED would turn a real action
          # change into an all-skipped fan-out, which harness-summary accepts as
          # a legitimate shape — nothing downstream could catch it, so catch it
          # here and fail closed. The must-run list is read out of the harness
          # itself, so coverage added later is protected with no second edit.
          #
          # Anchored to the start of a line on purpose: an unanchored match also
          # picks the action name out of PROSE, so a comment mentioning another
          # action would quietly enlarge the must-run set. That direction is
          # harmless but it makes the self-test assert something other than what
          # it appears to, which is the failure mode this whole job exists to
          # avoid. Only real step invocations count; a name cannot start with a
          # dot, so the container-images job's `uses: ./.github/workflows/...`
          # is not taken for an action.
          DIRS=$(grep -oE '^[[:space:]]*uses: \./[A-Za-z0-9_-][A-Za-z0-9_.-]*' .github/workflows/test-actions.yml | sed 's|.*\./||' | sort -u)
          [ -n "$DIRS" ] || { echo "::error::gate self-test: no 'uses: ./<action>' found in the harness — refusing to decide"; exit 1; }
          # Listed by hand, since the loop below adds only each action's
          # action.yml: the lockfiles, which preview-cli-install tests, the
          # scripts the preview actions share, which preview-change-detection,
          # preview-decide and preview-comment run on their own, and
          # publish-gh-pages' packing script, which publish-release-packaging runs.
          MUST_RUN=".github/workflows/test-actions.yml .github/fixtures/mini-lectures/environment.yml preview-cloudflare/package-lock.json preview-netlify/package-lock.json scripts/detect-changed-lectures.sh scripts/preview-decide.sh scripts/preview-comment.cjs scripts/package-release-assets.sh"
          for d in $DIRS; do MUST_RUN="$MUST_RUN $d/action.yml"; done
          # The container-images job decides for itself which images to build,
          # but runs only when this gate says relevant: an IGNORED that matched
          # an image's files would pass a containers-only pull request unbuilt.
          for f in containers/*/Dockerfile containers/*/environment.yml containers/quantecon/tests/smoke-test.sh .github/workflows/validate-containers.yml .github/workflows/test-container.yml scripts/detect-changed-images.sh scripts/delete-pr-images.sh scripts/check-base-pins.sh; do MUST_RUN="$MUST_RUN $f"; done
          for p in $MUST_RUN; do
            if grep -Eq "$IGNORED" <<< "$p"; then
              echo "::error::gate self-test: IGNORED matches [$p], which must always run the harness"; exit 1
            fi
          done
          for p in CHANGELOG.md AGENTS.md SECURITY.md .gitignore docs/dev/PLAN.md tests/README.md scripts/generate-docs.py scripts/lint-shell.py; do
            if ! grep -Eq "$IGNORED" <<< "$p"; then
              echo "::error::gate self-test: IGNORED no longer matches [$p]"; exit 1
            fi
          done
          echo "gate self-test passed; harness invokes: $(paste -sd' ' - <<< "$DIRS")"

          FILES=$(mktemp)
          case "$EVENT_NAME" in
            pull_request)
              # Answers exactly the question `paths:` used to answer, against
              # the base repo — so it works for fork PRs, and no merge-ref
              # checkout is involved to go stale.
              gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
                --jq '.[].filename' > "$FILES"
              # "Responses include a maximum of 3000 files." At the cap we
              # cannot prove irrelevance, so run.
              [ "$(wc -l < "$FILES")" -lt 3000 ] \
                || run_everything "pull request hit the 3000-file API cap — running the whole harness"
              ;;
            push)
              case "$PUSH_BEFORE" in
                ''|0000000000000000000000000000000000000000)
                  run_everything "push has no usable 'before' SHA — running the whole harness" ;;
              esac
              # A force-push can leave `before` unreachable and the compare
              # 404s. That is a "cannot tell", so fail open rather than red.
              if ! COMPARE=$(gh api "repos/$REPO/compare/$PUSH_BEFORE...$PUSH_AFTER" 2>/dev/null); then
                run_everything "compare $PUSH_BEFORE...$PUSH_AFTER unavailable (force-push?) — running the whole harness"
              fi
              # No --paginate: the file list appears only on the first page and
              # covers up to 300 files for the whole comparison. Paginating
              # returns more commits, never more files.
              [ "$(jq '.files | length' <<< "$COMPARE")" -lt 300 ] \
                || run_everything "compare hit the 300-file cap — running the whole harness"
              jq -r '.files[]?.filename' <<< "$COMPARE" > "$FILES"
              ;;
            *)
              run_everything "event [$EVENT_NAME] is a deliberate manual trigger — running the whole harness"
              ;;
          esac

          echo "Changed files ($(wc -l < "$FILES")):"
          sed 's/^/  /' "$FILES"

          if grep -Evq "$IGNORED" "$FILES"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "these changed paths are not provably irrelevant:"
            grep -Ev "$IGNORED" "$FILES" | sed 's/^/  /'
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "every changed path is on the ignore list — the harness does not apply"
          fi

      # #109: templates/ is copied into consumer repos, so its third-party pins
      # must not fall behind this repo's own workflows, and nothing else keeps
      # them current. Dependabot's github-actions ecosystem scans
      # .github/workflows/ and named action.yml files only; a `/templates` entry
      # in dependabot.yml is a no-op. This lives in the gate, not in a gated
      # job, because a templates-only PR matches IGNORED: a gated job would be
      # skipped on exactly the PRs that can introduce drift, and
      # harness-summary requires every gated job to skip then. Consequence: a
      # Dependabot bump of such an action (actions/checkout) goes red here until
      # the templates move in the same PR.
      - name: Check templates/ pin the same third-party actions as .github/workflows/
        run: |
          set -euo pipefail

          # owner/repo (lowercased: GitHub treats it case-insensitively) and ref
          # of a remote `uses:`, with any sub-path dropped, so actions/cache/save@v6
          # counts as actions/cache@v6. Commented-out lines never match.
          re='^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)[^@[:space:]]*@([^[:space:]#]+)'
          # A local action or a docker image: no pin to compare.
          local_re='uses:[[:space:]]*(\./|docker://)'

          # One "file:line<TAB>owner/repo<TAB>ref" per uses: in the given files.
          # A remote uses: that the regex cannot read is emitted with repo '?',
          # so the template check below fails closed on it instead of skipping.
          pins() {
            local hit file rest line text
            while IFS= read -r hit; do
              file=${hit%%:*}; rest=${hit#*:}; line=${rest%%:*}; text=${rest#*:}
              text=${text//[\"\']/}
              if [[ $text =~ $re ]]; then
                printf '%s:%s\t%s\t%s\n' "$file" "$line" "${BASH_REMATCH[2],,}" "${BASH_REMATCH[3]}"
              elif [[ ! $text =~ $local_re ]]; then
                printf '%s:%s\t?\t%s\n' "$file" "$line" "${text#"${text%%[![:space:]]*}"}"
              fi
            done < <(grep -HnE '^[[:space:]]*(-[[:space:]]+)?uses:' "$@" || true)
          }

          WORKFLOW_PINS=$(pins .github/workflows/*.yml)
          drift=0
          checked=0
          while IFS=$'\t' read -r loc repo ref; do
            [ "$repo" != "quantecon/actions" ] || continue
            checked=$((checked + 1))
            if [ "$repo" = "?" ]; then
              echo "::error file=${loc%%:*},line=${loc##*:}::cannot read the action reference in [$ref] at $loc, so its pin cannot be checked against .github/workflows/"
              drift=1
            elif awk -F'\t' -v r="$repo" -v v="$ref" '$2 == r && $3 == v { found = 1 } END { exit !found }' <<< "$WORKFLOW_PINS"; then
              echo "  ok: $repo@$ref ($loc)"
            else
              have=$(awk -F'\t' -v r="$repo" '$2 == r { print $3 }' <<< "$WORKFLOW_PINS" | sort -u | paste -sd' ' -)
              if [ -n "$have" ]; then
                echo "::error file=${loc%%:*},line=${loc##*:}::$loc pins $repo@$ref, but .github/workflows/ pins it at [$have]. Dependabot bumps the workflows and cannot see templates/, so move the template to the same ref, in the same PR as the bump."
              else
                echo "::error file=${loc%%:*},line=${loc##*:}::$loc pins $repo@$ref, which .github/workflows/ never uses, so nothing keeps it current (Dependabot cannot see templates/). Pin it in a workflow too, or drop it from the template."
              fi
              drift=1
            fi
          done < <(pins templates/*.yml)

          [ "$drift" -eq 0 ] || exit 1
          echo "✅ templates/ third-party pins match .github/workflows/ ($checked checked)"

      # #178, decision 5: every action has a chapter in the user manual; its
      # Inputs and Outputs tables, the action table and the signpost READMEs
      # are generated from each action.yml, and the manual's examples are
      # checked against them. In the gate for
      # the reason the pin check above is: a docs-only PR matches IGNORED and
      # skips every other job. PyYAML is the pin in scripts/requirements.txt,
      # installed into a venv because the runner's Python is externally managed.
      # actionlint is a pinned release checked against its SHA-256, because
      # actionlint-py ships only an sdist. No Dependabot ecosystem tracks a
      # release download, so bump the version and checksum together, by hand,
      # from the release's actionlint_<version>_checksums.txt. shellcheck is the
      # runner image's: actionlint runs it on each run: script, and skips that
      # without a word when it finds none, so its absence fails here, and the
      # log records which version linted.
      - name: Install the lint tooling (PyYAML, actionlint), and find shellcheck
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --disable-pip-version-check --quiet -r scripts/requirements.txt

          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -version
          shellcheck --version

      - name: Check every action has a chapter, and the manual's generated tables match each action.yml
        run: |
          "$RUNNER_TEMP/docs-venv/bin/python" scripts/generate-docs.py --check

      # Every quantecon/actions step in docs/user and templates/ passes only
      # inputs its action.yml declares, and every required one; every complete
      # workflow sets permissions: and passes actionlint (shellcheck, which the
      # runner image carries, lints its run: scripts).
      - name: Check the examples in docs/user and templates/
        run: |
          "$RUNNER_TEMP/docs-venv/bin/python" scripts/generate-docs.py --check-examples \
            --actionlint "$RUNNER_TEMP/actionlint/actionlint"

      # #100 (review M5): this repository's own workflows, this one included,
      # which the step above never sees. With no arguments actionlint lints
      # every workflow in .github/workflows/, with .github/actionlint.yaml's
      # ignores. In the gate because it already has actionlint, and every event
      # runs it and harness-summary requires it, so a problem fails the required
      # check with no new job to wire into the summary.
      - name: Lint .github/workflows/ with actionlint
        run: |
          "$RUNNER_TEMP/actionlint/actionlint"

      # #100 (review M5): actionlint never reads an action.yml. This lints each
      # action's run: scripts with shellcheck at --severity=warning, reporting
      # at their lines in action.yml, and fails on any ${{ }} in one, since a
      # value belongs in env: (AGENTS.md). Then scripts/*.sh, at the same
      # severity. containers/ is left out: a change there rebuilds both images.
      - name: Lint the actions' run scripts and scripts/*.sh with shellcheck
        run: |
          "$RUNNER_TEMP/docs-venv/bin/python" scripts/lint-shell.py

  # ==========================================================================
  # restore-jupyter-cache — unit jobs (synthetic fixtures, no conda, seconds)
  # ==========================================================================

  unit-build-seed:
    name: 'restore-jupyter-cache: seed build cache (save mode, genuine miss)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create salted fixture
        run: |
          mkdir -p harness
          printf 'harness-env-salt: %s-unit-build\n' "$SALT" > harness/environment.yml

      - name: Restore (save mode, expecting a miss)
        id: restore
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'build'
          environment: 'harness/environment.yml'
          save-cache: 'true'

      - name: Assert outputs report a miss
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
        run: |
          [ "$CACHE_HIT" = "false" ] || { echo "::error::cache-hit: expected [false], got [$CACHE_HIT]"; exit 1; }
          [ -z "$CACHE_KEY" ] || { echo "::error::cache-key: expected empty, got [$CACHE_KEY]"; exit 1; }
          echo "✅ miss reported correctly (cache-hit=false, cache-key empty)"

      # Written after the action ran: the save happens in a post: hook at job
      # end, so this payload is what gets cached under build-{hash}--{run_id}.
      - name: Write payload for downstream restore jobs
        run: |
          mkdir -p _build/html
          echo "<html>harness</html>" > _build/html/index.html
          printf '%s-unit-build\n' "$SALT" > _build/STAMP

  unit-build-restore:
    name: 'restore-jupyter-cache: build cache read-only restore + quiet guard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-build-seed
    steps:
      - uses: actions/checkout@v7

      - name: Recreate salted fixture
        run: |
          mkdir -p harness
          printf 'harness-env-salt: %s-unit-build\n' "$SALT" > harness/environment.yml

      # fail-on-miss on a hit doubles as the "guard stays quiet" scenario.
      - name: Restore (read-only)
        id: restore
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'build'
          environment: 'harness/environment.yml'
          fail-on-miss: 'true'

      - name: Assert hit, matched key, and payload
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
          EXPECTED_KEY: build-${{ hashFiles('harness/environment.yml') }}--${{ github.run_id }}
        run: |
          [ "$CACHE_HIT" = "true" ] || { echo "::error::cache-hit: expected [true], got [$CACHE_HIT]"; exit 1; }
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          [ "$(cat _build/STAMP)" = "$SALT-unit-build" ] || { echo "::error::payload STAMP mismatch: got [$(cat _build/STAMP)]"; exit 1; }
          [ -f _build/html/index.html ] || { echo "::error::restored payload is missing _build/html/index.html"; exit 1; }
          echo "✅ read-only restore reported the hit and delivered the payload"

  unit-build-restore-save:
    # The #104 regression scenario: save mode must still report the hit.
    name: 'restore-jupyter-cache: build cache restore in save mode (#104)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-build-seed
    steps:
      - uses: actions/checkout@v7

      - name: Recreate salted fixture
        run: |
          mkdir -p harness
          printf 'harness-env-salt: %s-unit-build\n' "$SALT" > harness/environment.yml

      - name: Restore (save mode)
        id: restore
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'build'
          environment: 'harness/environment.yml'
          save-cache: 'true'

      - name: Assert hit, matched key, and payload
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
          EXPECTED_KEY: build-${{ hashFiles('harness/environment.yml') }}--${{ github.run_id }}
        run: |
          [ "$CACHE_HIT" = "true" ] || { echo "::error::cache-hit: expected [true], got [$CACHE_HIT] — this is the exact #104 failure mode"; exit 1; }
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          [ "$(cat _build/STAMP)" = "$SALT-unit-build" ] || { echo "::error::payload STAMP mismatch: got [$(cat _build/STAMP)]"; exit 1; }
          echo "✅ save-mode restore reported the hit (outputs alive, #104 stays fixed)"

  unit-build-miss-guard:
    name: 'restore-jupyter-cache: fail-on-miss fires on a genuine miss'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create salted fixture (distinct salt — nothing ever saved for it)
        run: |
          mkdir -p harness
          printf 'harness-env-salt: %s-unit-miss\n' "$SALT" > harness/environment.yml

      - name: Restore with fail-on-miss (expected to fail)
        id: restore
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'build'
          environment: 'harness/environment.yml'
          fail-on-miss: 'true'

      - name: Assert the guard fired
        env:
          OUTCOME: ${{ steps.restore.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::fail-on-miss did not fail the action on a genuine miss (outcome=[$OUTCOME])"; exit 1; }
          [ ! -d _build ] || { echo "::error::_build exists after a supposed miss — something was restored"; exit 1; }
          echo "✅ fail-on-miss guard fired on a genuine miss"

  unit-exec-seed:
    name: 'restore-jupyter-cache: seed execution cache (save mode)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create salted fixture
        run: |
          mkdir -p harness/lectures
          printf '%% harness salt: %s-unit-exec\n' "$SALT" > harness/lectures/note.md

      # No miss assertion here: the bare `jupyter-cache-` fallback (see header)
      # can legitimately restore an older cache. The payload STAMP written
      # below is what downstream jobs assert on, so a wrong restore cannot
      # produce a false pass.
      - name: Restore (save mode)
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'execution'
          source-dir: 'harness/lectures'
          save-cache: 'true'

      - name: Write payload for downstream restore jobs
        run: |
          mkdir -p _build/.jupyter_cache
          printf '%s-unit-exec\n' "$SALT" > _build/.jupyter_cache/STAMP

  unit-exec-restore:
    name: 'restore-jupyter-cache: execution cache read-only restore + quiet guard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-exec-seed
    steps:
      - uses: actions/checkout@v7

      - name: Recreate salted fixture
        run: |
          mkdir -p harness/lectures
          printf '%% harness salt: %s-unit-exec\n' "$SALT" > harness/lectures/note.md

      - name: Restore (read-only)
        id: restore
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'execution'
          source-dir: 'harness/lectures'
          fail-on-miss: 'true'

      - name: Assert hit, matched key, and payload
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
          EXPECTED_KEY: jupyter-cache-${{ hashFiles('harness/lectures/**/*.md') }}-${{ github.run_id }}
        run: |
          [ "$CACHE_HIT" = "true" ] || { echo "::error::cache-hit: expected [true], got [$CACHE_HIT]"; exit 1; }
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          [ "$(cat _build/.jupyter_cache/STAMP)" = "$SALT-unit-exec" ] || { echo "::error::payload STAMP mismatch: got [$(cat _build/.jupyter_cache/STAMP)]"; exit 1; }
          echo "✅ execution cache read-only restore verified"

  unit-exec-restore-save:
    name: 'restore-jupyter-cache: execution cache restore in save mode'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-exec-seed
    steps:
      - uses: actions/checkout@v7

      - name: Recreate salted fixture
        run: |
          mkdir -p harness/lectures
          printf '%% harness salt: %s-unit-exec\n' "$SALT" > harness/lectures/note.md

      - name: Restore (save mode)
        id: restore
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'execution'
          source-dir: 'harness/lectures'
          save-cache: 'true'

      - name: Assert hit, matched key, and payload
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
          EXPECTED_KEY: jupyter-cache-${{ hashFiles('harness/lectures/**/*.md') }}-${{ github.run_id }}
        run: |
          [ "$CACHE_HIT" = "true" ] || { echo "::error::cache-hit: expected [true], got [$CACHE_HIT]"; exit 1; }
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          [ "$(cat _build/.jupyter_cache/STAMP)" = "$SALT-unit-exec" ] || { echo "::error::payload STAMP mismatch: got [$(cat _build/.jupyter_cache/STAMP)]"; exit 1; }
          echo "✅ execution cache save-mode restore verified"

  # #228: the custom key and path, as a caller writes them. Both used to be
  # expanded into the run: text, where the shell read a '$' in the path as a
  # variable: 'harness/$HARNESS_UNSET cache' became 'harness/ cache', which
  # does not exist, so nothing was saved and the restore below missed.
  unit-custom-seed:
    name: 'restore-jupyter-cache: seed a custom key, into a path holding a space and a $ (#228)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    env:
      CACHE_DIR: 'harness/$HARNESS_UNSET cache'
    steps:
      - uses: actions/checkout@v7

      - name: Restore under a custom key (save mode, expecting a miss)
        id: restore
        uses: ./restore-jupyter-cache
        with:
          key: harness-custom-${{ env.SALT }}
          path: ${{ env.CACHE_DIR }}
          save-cache: 'true'

      - name: Assert outputs report a miss
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
        run: |
          [ "$CACHE_HIT" = "false" ] || { echo "::error::cache-hit: expected [false], got [$CACHE_HIT]"; exit 1; }
          [ -z "$CACHE_KEY" ] || { echo "::error::cache-key: expected empty, got [$CACHE_KEY]"; exit 1; }
          echo "✅ miss reported correctly (cache-hit=false, cache-key empty)"

      # Written after the action ran, at the path as written: the post: hook
      # saves it under the custom key at job end.
      - name: Write payload for the downstream restore job
        run: |
          mkdir -p "$CACHE_DIR"
          printf '%s-unit-custom\n' "$SALT" > "$CACHE_DIR/STAMP"

  unit-custom-restore:
    name: 'restore-jupyter-cache: restore a custom key, into a path holding a space and a $ (#228)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-custom-seed
    env:
      CACHE_DIR: 'harness/$HARNESS_UNSET cache'
    steps:
      - uses: actions/checkout@v7

      - name: Restore under the custom key (read-only)
        id: restore
        uses: ./restore-jupyter-cache
        with:
          key: harness-custom-${{ env.SALT }}
          path: ${{ env.CACHE_DIR }}

      # A custom key is restored as given, with no run ID appended, so the
      # seed's key matches exactly.
      - name: Assert the hit, the key, and the payload at the path as written
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
          EXPECTED_KEY: harness-custom-${{ env.SALT }}
        run: |
          [ "$CACHE_HIT" = "true" ] || { echo "::error::cache-hit: expected [true], got [$CACHE_HIT]. If the seed job warned that its path does not exist, the path was read as shell (#228)"; exit 1; }
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          STAMP="$CACHE_DIR/STAMP"
          [ -f "$STAMP" ] || { echo "::error::nothing was restored at [$STAMP]"; find harness -maxdepth 2 | sort; exit 1; }
          [ "$(cat "$STAMP")" = "$SALT-unit-custom" ] || { echo "::error::payload STAMP mismatch: got [$(cat "$STAMP")]"; exit 1; }
          echo "✅ the custom key restored exactly, into the path as written"

  # #228: a line break in key or path would end the value it is written to
  # $GITHUB_OUTPUT in and start another output. Each second line here is an
  # output the action reads, so before the check both steps passed, having
  # set restore-keys and path from it. The control, the same key on one line,
  # passes (a miss), so each failure is the line break's.
  unit-line-break:
    name: 'restore-jupyter-cache: a key or path holding a line break fails before any output is written (#228)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: 'control: the key on one line'
        id: one-line
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          key: harness-line-${{ env.SALT }}

      - name: 'refused: a key with a second output on its next line'
        id: key
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          key: |-
            harness-line-${{ env.SALT }}
            restore-keys=harness-injected-${{ env.SALT }}

      - name: 'refused: a path with a second output on its next line'
        id: path
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          key: harness-line-${{ env.SALT }}
          path: |-
            _build
            path=harness-injected

      - name: Assert the control passed, and each line break failed the action
        env:
          ONE_LINE: ${{ steps.one-line.outcome }}
          KEY: ${{ steps.key.outcome }}
          KEY_HIT: ${{ steps.key.outputs.cache-hit }}
          PATH_OUTCOME: ${{ steps.path.outcome }}
          PATH_HIT: ${{ steps.path.outputs.cache-hit }}
        run: |
          [ "$ONE_LINE" = "success" ] || { echo "::error::the single-line key reported [$ONE_LINE]: it must pass (a miss), or the failures below prove nothing"; exit 1; }
          [ "$KEY" = "failure" ] || { echo "::error::a key holding a line break reported [$KEY]: it must fail before the key is written to GITHUB_OUTPUT (#228)"; exit 1; }
          [ "$PATH_OUTCOME" = "failure" ] || { echo "::error::a path holding a line break reported [$PATH_OUTCOME]: it must fail before the path is written to GITHUB_OUTPUT (#228)"; exit 1; }
          [ "$KEY_HIT" = "false" ] && [ "$PATH_HIT" = "false" ] || { echo "::error::cache-hit after a refused input: expected [false] and [false], got [$KEY_HIT] and [$PATH_HIT]"; exit 1; }
          [ ! -e harness-injected ] || { echo "::error::harness-injected exists: the path's second line was used"; exit 1; }
          echo "✅ the single-line key passed, and a line break in key or path failed the action before the restore"

  # #236: an input outside its accepted values used to pass unchecked. The
  # steps compare them exactly, and an `if:` case-insensitively, so
  # save-cache 'True' registered the job-end save under a key without the run
  # ID, cache-type 'exec' restored the build cache, and fail-on-miss 'yes'
  # was false; an empty path put the execution cache in /.jupyter_cache. Each
  # case below differs from the control in one input, and each passed before
  # the check. 'True' is quoted: unquoted, YAML reads it as the boolean, and
  # the action receives 'true'.
  unit-input-values:
    name: 'restore-jupyter-cache: a value outside an input''s accepted values, or an empty path, fails before anything is restored (#236)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create salted fixture (distinct salt — nothing ever saved for it)
        run: |
          mkdir -p harness
          printf 'harness-env-salt: %s-unit-values\n' "$SALT" > harness/environment.yml

      - name: 'control: build, read-only, a miss'
        id: control
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'build'
          environment: 'harness/environment.yml'
          save-cache: 'false'
          fail-on-miss: 'false'

      - name: "refused: cache-type 'exec'"
        id: exec
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'exec'
          environment: 'harness/environment.yml'

      - name: "refused: save-cache 'True'"
        id: save-true
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          environment: 'harness/environment.yml'
          save-cache: 'True'

      - name: "refused: save-cache 'True', with a custom key"
        id: key-save-true
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          key: harness-values-${{ env.SALT }}
          save-cache: 'True'

      - name: "refused: fail-on-miss 'yes'"
        id: miss-yes
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          environment: 'harness/environment.yml'
          fail-on-miss: 'yes'

      - name: 'refused: an empty path, with the execution cache'
        id: empty-path
        continue-on-error: true
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'execution'
          path: ''

      - name: Assert the control passed, each refused value failed, and nothing was restored
        env:
          RESULTS: |
            passed|control|${{ steps.control.outcome }}|${{ steps.control.outputs.cache-hit }}
            refused|exec|${{ steps.exec.outcome }}|${{ steps.exec.outputs.cache-hit }}
            refused|save-true|${{ steps.save-true.outcome }}|${{ steps.save-true.outputs.cache-hit }}
            refused|key-save-true|${{ steps.key-save-true.outcome }}|${{ steps.key-save-true.outputs.cache-hit }}
            refused|miss-yes|${{ steps.miss-yes.outcome }}|${{ steps.miss-yes.outputs.cache-hit }}
            refused|empty-path|${{ steps.empty-path.outcome }}|${{ steps.empty-path.outputs.cache-hit }}
        run: |
          set -euo pipefail
          bad=0 n=0
          while IFS='|' read -r want id outcome hit; do
            [ -n "$want" ] || continue
            n=$((n + 1))
            if [ "$want" = passed ]; then expect=success; else expect=failure; fi
            if [ "$outcome" != "$expect" ] || [ "$hit" != false ]; then
              echo "::error::$id: expected outcome [$expect] and cache-hit [false], got [$outcome] and [$hit]"
              bad=1
            else
              echo "✓ $id: outcome=$outcome"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 6 ] || { echo "::error::expected 6 cases, read $n"; exit 1; }
          [ ! -e _build ] || { echo "::error::_build exists: something was restored"; exit 1; }
          [ ! -e /.jupyter_cache ] || { echo "::error::/.jupyter_cache exists: the empty path was used"; exit 1; }
          [ "$bad" -eq 0 ]
          echo "✅ the control passed, and every value outside its accepted set failed the action before the restore"

  # ==========================================================================
  # setup-environment — standard-mode conda cache, two-run miss→hit chain
  # (PLAN item 9: the #33/#78 cache fix had never been confirmed by CI)
  # ==========================================================================

  env-seed:
    name: 'setup-environment: standard mode, cold conda cache'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create salted fixture
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md

      - name: Setup environment
        id: setup
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'

      - name: Assert standard mode and no exact cache hit
        env:
          CONTAINER_MODE: ${{ steps.setup.outputs.container-mode }}
          CONDA_CACHE_HIT: ${{ steps.setup.outputs.conda-cache-hit }}
        run: |
          [ "$CONTAINER_MODE" = "false" ] || { echo "::error::container-mode: expected [false], got [$CONTAINER_MODE]"; exit 1; }
          [ "$CONDA_CACHE_HIT" != "true" ] || { echo "::error::conda-cache-hit=true on a salted (never-cached) environment"; exit 1; }
          echo "✅ no exact hit on a salted environment file: built fresh, or from another run's cache through the fallback (saved at job end)"

  env-hit-build:
    name: 'setup-environment: warm conda cache + build-lectures on the restored env'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-seed
    steps:
      # Full history, so build-lectures' git check reads "Git history
      # available" rather than warning about a shallow clone on every run. The
      # fixture is an untracked copy, so its dates are not what this tests.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Recreate salted fixture
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md

      - name: Setup environment
        id: setup
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'

      - name: Assert exact conda cache hit
        env:
          CONDA_CACHE_HIT: ${{ steps.setup.outputs.conda-cache-hit }}
        run: |
          [ "$CONDA_CACHE_HIT" = "true" ] || { echo "::error::conda-cache-hit: expected [true] on second run, got [$CONDA_CACHE_HIT] — conda env caching is broken (#33/#78 regression)"; exit 1; }
          echo "✅ warm run: conda environment restored from cache"

      # Building on the restored (not freshly created) env is the point: it
      # proves the cached environment is functional, not just present.
      - name: Build lectures (html)
        id: build
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'
          output-dir: 'harness'

      - name: Assert build output and executed cell
        env:
          BUILD_PATH: ${{ steps.build.outputs.build-path }}
        run: |
          [ "$BUILD_PATH" = "harness/_build/html" ] || { echo "::error::build-path: expected [harness/_build/html], got [$BUILD_PATH]"; exit 1; }
          [ -f harness/_build/html/index.html ] || { echo "::error::no index.html produced"; exit 1; }
          grep -q "sum of squares: 285" harness/_build/html/lecture1.html || { echo "::error::executed cell output missing from HTML — execution did not run"; exit 1; }
          [ -f harness/_build/.jupyter_cache/global.db ] || { echo "::error::_build/.jupyter_cache/global.db missing — execution cache was not populated"; exit 1; }
          echo "✅ build-lectures produced an executed site from the cache-restored env"

  env-version-bump:
    # #205: bumping cache-version must build a fresh environment. A salted
    # version matches no cache, so a restore-key chain that stays within one
    # version restores nothing and conda-cache-hit is empty. A chain that
    # leaves cache-version out restores env-seed's cache, which holds this
    # same environment file, and reports 'false'.
    name: 'setup-environment: a cache-version bump builds a fresh environment'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-seed
    steps:
      - uses: actions/checkout@v7

      # Same salt as env-seed: only cache-version differs from its cache.
      - name: Recreate salted fixture
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md

      - name: Setup environment under a new cache-version
        id: setup
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'
          cache-version: bump-${{ env.SALT }}

      - name: Assert nothing was restored, and the fresh environment works
        env:
          CONDA_CACHE_HIT: ${{ steps.setup.outputs.conda-cache-hit }}
        run: |
          [ -z "$CONDA_CACHE_HIT" ] || { echo "::error::conda-cache-hit: expected empty (nothing restored) after a cache-version bump, got [$CONDA_CACHE_HIT]. 'false' means a restore-keys fallback restored another version's environment, so the bump did not build a fresh one (#205)"; exit 1; }
          "$CONDA/envs/quantecon/bin/python" -c 'import myst_nb' \
            || { echo "::error::the freshly built environment cannot import myst_nb"; exit 1; }
          echo "✅ a cache-version bump restored nothing and built the environment fresh"

  env-file-edit:
    # #205, the other half: under the same cache-version, an edited
    # environment file must still restore the latest environment of that
    # version through the fallback, and update it, so that an edit does not
    # cost a full build. env-seed has saved a cache under this version, so
    # the fallback always has one to find, and conda-cache-hit is 'false'.
    name: 'setup-environment: an edited environment file restores through the fallback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-seed
    steps:
      - uses: actions/checkout@v7

      # env-seed's fixture plus one line, so the file's hash differs from its
      # cache and only the fallback can match.
      - name: Recreate salted fixture, then edit its environment file
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md
          printf '# harness-edit: %s\n' "$SALT" >> harness/environment.yml

      - name: Setup environment
        id: setup
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'

      - name: Assert the fallback restored an environment, and it works
        env:
          CONDA_CACHE_HIT: ${{ steps.setup.outputs.conda-cache-hit }}
        run: |
          [ "$CONDA_CACHE_HIT" = "false" ] || { echo "::error::conda-cache-hit: expected [false] (restored through the restore-keys fallback) for an edited environment file, got [$CONDA_CACHE_HIT]. Empty means the fallback found nothing under this cache-version although env-seed saved a cache there, so every edit would cost a full build (#205)"; exit 1; }
          "$CONDA/envs/quantecon/bin/python" -c 'import myst_nb' \
            || { echo "::error::the restored and updated environment cannot import myst_nb"; exit 1; }
          echo "✅ an edited environment file restored an earlier environment of its version, then updated it"

  # ==========================================================================
  # setup-environment — a restore must be an exact copy of the cache (#209)
  # ==========================================================================
  #
  # setup-miniconda creates the environment fresh before the cache restore,
  # and tar extracts over whatever is there without deleting what only the
  # fresh environment has. The fixture above pins nothing, so its fresh and
  # cached environments hold the same versions and a mix never shows. These
  # jobs pin pip below what a fresh `conda create` installs, under their own
  # salted cache-version, so a mixed restore leaves two pip records in
  # conda-meta and, on a fallback restore, a pip that `conda env update`
  # crashes on.

  env-pinned-seed:
    name: 'setup-environment: seed a pinned stack under its own cache-version'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create the fixture, pinning pip
        run: |
          cp -r .github/fixtures/mini-lectures harness
          sed -i 's/^  - pip$/  - pip=25.3/' harness/environment.yml
          grep -qx '  - pip=25.3' harness/environment.yml \
            || { echo "::error::fixture setup failed: pip is not pinned"; exit 1; }

      - name: Setup environment
        id: setup
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'
          cache-version: pinned-${{ env.SALT }}

      - name: Assert a true miss, and the pinned pip
        env:
          CONDA_CACHE_HIT: ${{ steps.setup.outputs.conda-cache-hit }}
        run: |
          [ -z "$CONDA_CACHE_HIT" ] || { echo "::error::conda-cache-hit: expected empty under a salted cache-version, got [$CONDA_CACHE_HIT]"; exit 1; }
          version=$("$CONDA/envs/quantecon/bin/python" -m pip --version) || { echo "::error::pip does not run in the new environment"; exit 1; }
          case "$version" in "pip 25.3 "*) ;; *) echo "::error::expected pip 25.3, got [$version]"; exit 1 ;; esac
          echo "✅ built the pinned environment fresh: $version"

  env-pinned-hit:
    name: 'setup-environment: an exact hit restores the cached environment exactly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-pinned-seed
    steps:
      - uses: actions/checkout@v7

      - name: Recreate the pinned fixture
        run: |
          cp -r .github/fixtures/mini-lectures harness
          sed -i 's/^  - pip$/  - pip=25.3/' harness/environment.yml

      - name: Setup environment
        id: setup
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'
          cache-version: pinned-${{ env.SALT }}

      - name: Assert an exact hit, with nothing of the fresh environment left
        env:
          CONDA_CACHE_HIT: ${{ steps.setup.outputs.conda-cache-hit }}
        run: |
          [ "$CONDA_CACHE_HIT" = "true" ] || { echo "::error::conda-cache-hit: expected [true], got [$CONDA_CACHE_HIT]"; exit 1; }
          shopt -s nullglob
          records=("$CONDA"/envs/quantecon/conda-meta/pip-[0-9]*.json)
          if [ "${#records[@]}" -ne 1 ]; then
            echo "::error::conda-meta holds ${#records[@]} pip records: the restore mixed the cached environment with the one setup-miniconda created (#209)"
            printf '  %s\n' "${records[@]##*/}"
            exit 1
          fi
          version=$("$CONDA/envs/quantecon/bin/python" -m pip --version) || { echo "::error::pip does not run in the restored environment (#209)"; exit 1; }
          case "$version" in "pip 25.3 "*) ;; *) echo "::error::expected the cached pip 25.3, got [$version]"; exit 1 ;; esac
          echo "✅ the exact hit restored the cached environment and nothing else: $version"

  env-pinned-edit:
    name: 'setup-environment: a fallback restore of a pinned stack updates cleanly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-pinned-seed
    steps:
      - uses: actions/checkout@v7

      # One more line than env-pinned-seed's file, so only the fallback
      # matches; `conda env update` then runs pip for the pip: section.
      - name: Recreate the pinned fixture, then edit it
        run: |
          cp -r .github/fixtures/mini-lectures harness
          sed -i 's/^  - pip$/  - pip=25.3/' harness/environment.yml
          printf '# harness-edit: %s\n' "$SALT" >> harness/environment.yml

      - name: Setup environment
        id: setup
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'
          cache-version: pinned-${{ env.SALT }}

      - name: Assert the fallback restored and updated a single environment
        env:
          CONDA_CACHE_HIT: ${{ steps.setup.outputs.conda-cache-hit }}
        run: |
          [ "$CONDA_CACHE_HIT" = "false" ] || { echo "::error::conda-cache-hit: expected [false] (the fallback), got [$CONDA_CACHE_HIT]"; exit 1; }
          shopt -s nullglob
          records=("$CONDA"/envs/quantecon/conda-meta/pip-[0-9]*.json)
          if [ "${#records[@]}" -ne 1 ]; then
            echo "::error::conda-meta holds ${#records[@]} pip records: the restore mixed the cached environment with the one setup-miniconda created (#209)"
            printf '  %s\n' "${records[@]##*/}"
            exit 1
          fi
          version=$("$CONDA/envs/quantecon/bin/python" -m pip --version) || { echo "::error::pip does not run in the updated environment (#209)"; exit 1; }
          case "$version" in "pip 25.3 "*) ;; *) echo "::error::expected pip 25.3, got [$version]"; exit 1 ;; esac
          echo "✅ the fallback restore was updated cleanly: $version"

  build-fail-guard:
    # The negative half of the build-lectures contract. env-hit-build proves a
    # successful build reports success; this proves a *failed* build still
    # fails the step. Both directions matter, and this one guards the fix in
    # this PR: build-lectures returns its status by ending the script rather
    # than via the exit builtin (see build-lectures/action.yml), and any future
    # edit that drops that trailing `(exit "$BUILD_EXIT_CODE")` — or appends a
    # command after it — would silently discard the status and turn every
    # broken consumer build into a pass. Nothing else in the harness notices.
    name: 'build-lectures: a failing build fails the step'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-seed
    steps:
      # Full history, so build-lectures' git check reads "Git history
      # available" rather than warning about a shallow clone on every run. The
      # fixture is an untracked copy, so its dates are not what this tests.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same salt as env-seed, so the conda env restores from its cache.
      - name: Recreate salted fixture with a deliberately broken page
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md
          # Derive the broken page from the good one so its frontmatter and
          # kernelspec stay valid — the build must fail on the raised
          # AssertionError, not on a malformed document.
          sed -e 's/^# An Executed Lecture$/# A Deliberately Broken Lecture/' \
              -e 's/^assert total == 285$/assert total == 0, "harness: deliberate build failure"/' \
              harness/lectures/lecture1.md > harness/lectures/broken.md
          printf '  - file: broken\n' >> harness/lectures/_toc.yml
          grep -q 'assert total == 0' harness/lectures/broken.md \
            || { echo "::error::fixture setup failed — broken.md has no failing cell"; exit 1; }

      - name: Setup environment
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'

      # Expect ::error:: annotations from build-lectures' own failure reporter
      # in this job's log — they are the action working correctly.
      # The artifact is named for this job: bjc-fail-guard's build-lectures@v0
      # uploads execution-reports-html in the same run, and a name can be used
      # only once in a run.
      - name: Build lectures (expected to fail)
        id: build
        continue-on-error: true
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'
          output-dir: 'harness'
          upload-failure-reports: 'true'
          failure-artifact-name: 'build-fail-guard-reports'

      - name: Assert the build failure propagated
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::build-lectures reported [$OUTCOME] for a build whose execution raised — a failing build must fail the step"; exit 1; }

          # Attribute the red. A `failure` outcome on its own is also satisfied
          # by a build that died on some unrelated -W warning, which would let
          # this job stay green while the property it guards was broken.
          # myst-nb writes the execution traceback to
          # <sphinx outdir>/reports/<docname>.err.log (myst_nb/sphinx_.py), and
          # `jb build harness/lectures --path-output harness` with builder html
          # puts outdir at harness/_build/html. Hard-coded rather than globbed:
          # this is the same path build-lectures ships in upload-failure-reports,
          # so if jupyter-book ever relocates reports/ this goes red here rather
          # than that upload silently producing an empty artifact.
          # Keep the $OUTCOME check above this one — a stale err.log survives an
          # incremental rebuild that exits 0, so the file existing is not by
          # itself evidence that the build failed.
          REPORT=harness/_build/html/reports/broken.err.log
          if [ ! -f "$REPORT" ]; then
            echo "::error::the build failed but never wrote $REPORT — the red is not attributable to the staged execution error. If jupyter-book moved the execution-report directory, fix this path and build-lectures' upload-failure-reports paths together."
            find harness -maxdepth 3 -type d -print || true
            exit 1
          fi
          grep -q 'harness: deliberate build failure' "$REPORT" \
            || { echo "::error::$REPORT is not the failure this job stages (missing the fixture's assertion message)"; sed -n '1,60p' "$REPORT"; exit 1; }

          echo "✅ a failing build fails the step, and the red is the staged CellExecutionError ($REPORT)"

      # #243: upload-artifact skips hidden paths unless include-hidden-files is
      # set, even a path it is given by name, so the artifact used to hold the
      # reports alone. The upload finished in an earlier step, so a download in
      # the same job finds it.
      - name: Download the failure artifact
        uses: actions/download-artifact@v8
        with:
          name: build-fail-guard-reports
          path: ${{ runner.temp }}/failure-reports

      - name: Assert the failure artifact holds the reports and the execution cache
        run: |
          # The artifact's root is harness/_build, the paths' common ancestor.
          DIR="$RUNNER_TEMP/failure-reports"
          [ -f "$DIR/html/reports/broken.err.log" ] \
            || { echo "::error::the failure artifact has no html/reports/broken.err.log"; find "$DIR" -maxdepth 3 | sort; exit 1; }
          [ -f "$DIR/.jupyter_cache/global.db" ] \
            || { echo "::error::the failure artifact has no .jupyter_cache/global.db: upload-failure-reports promises the execution cache, and upload-artifact leaves out hidden paths unless include-hidden-files is set (#243)"; find "$DIR" -maxdepth 3 | sort; exit 1; }
          echo "✅ the failure artifact holds the staged err.log and the execution cache"

  build-display-error-guard:
    # #247: the failure -W misses. build-fail-guard stages a cell that raises,
    # which -W catches. This stages one whose exception is raised while IPython
    # displays the result. The kernel reports that cell as successful, so
    # nbclient does not raise, myst-nb renders the traceback without a warning,
    # jb build exits 0, and the page is published with the traceback on it.
    # build-lectures' error-outputs check is what fails it.
    #
    # The cell raises inside display(), which is how a figure reaches the page
    # (plt.show(), or the inline backend after the cell). Not as the cell's last
    # value: since ipykernel 7.3.0 (ipython/ipykernel#1521) an error while the
    # displayhook formats that value fails the cell, and -W catches it. An error
    # inside display() still leaves the cell successful (ipykernel 7.4.0).
    #
    # One fixture, four builds: fail, warn, ignore, and an invalid value. Only
    # the first executes anything. The later ones find every page up to date and
    # read nothing, but the check reads _build/jupyter_execute, which the first
    # build wrote, so each sees the same notebooks. raises.md is the control: a
    # cell tagged raises-exception, whose error output must not be counted, so
    # error-output-count is 1, not 2.
    name: 'build-lectures: an error raised while displaying a result fails the step'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-seed
    steps:
      # Full history, as in build-fail-guard.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same salt as env-seed, so the conda env restores from its cache. Both
      # pages are derived from lecture1.md, as build-fail-guard's is, so their
      # frontmatter and kernelspec stay valid.
      - name: Recreate salted fixture with a display-time error and an allowed one
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md
          sed -e 's/^# An Executed Lecture$/# A Lecture Whose Display Fails/' \
              harness/lectures/lecture1.md > harness/lectures/display_error.md
          cat >> harness/lectures/display_error.md <<'EOF'

          The cell below runs without error. IPython then raises while it
          displays the object, which it prints as a traceback.

          ```{code-cell} python3
          from IPython.display import display

          class DisplayFails:
              def _repr_html_(self):
                  raise ValueError("harness: deliberate display-time error")

          display(DisplayFails())
          ```

          ```{code-cell} python3
          print("harness: the next cell ran")
          ```
          EOF
          sed -e 's/^# An Executed Lecture$/# A Lecture That Raises on Purpose/' \
              harness/lectures/lecture1.md > harness/lectures/raises.md
          cat >> harness/lectures/raises.md <<'EOF'

          ```{code-cell} python3
          :tags: [raises-exception]
          raise RuntimeError("harness: an error the lecture means to show")
          ```
          EOF
          printf '  - file: display_error\n  - file: raises\n' >> harness/lectures/_toc.yml
          grep -q 'def _repr_html_' harness/lectures/display_error.md \
            || { echo "::error::fixture setup failed — display_error.md has no failing display"; exit 1; }
          grep -q 'raises-exception' harness/lectures/raises.md \
            || { echo "::error::fixture setup failed — raises.md has no tagged cell"; exit 1; }

      - name: Setup environment
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'

      # Expect an ::error:: annotation for display_error.md in this job's log:
      # it is the check working.
      - name: Build lectures with error-outputs fail (expected to fail)
        id: fail
        continue-on-error: true
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'
          output-dir: 'harness'
          error-outputs: 'fail'

      - name: Assert the display-time error failed the step, and only it
        env:
          OUTCOME: ${{ steps.fail.outcome }}
          COUNT: ${{ steps.fail.outputs.error-output-count }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::build-lectures reported [$OUTCOME] for a page whose display raised — error-outputs: fail must fail the step (#247)"; exit 1; }
          # Attribute the red, as build-fail-guard does. The count is set only by
          # the check, so a failure with a count of 1 is the check's, on one cell.
          [ "$COUNT" = "1" ] || { echo "::error::error-output-count: expected [1], the display_error cell alone (raises.md's tagged cell is allowed), got [$COUNT]"; exit 1; }
          # The premise: -W saw nothing, so no report was written, and the page
          # shows the traceback while the next cell still ran.
          [ ! -e harness/_build/html/reports/display_error.err.log ] \
            || { echo "::error::harness/_build/html/reports/display_error.err.log exists: myst-nb reported this failure itself, so the fixture no longer stages the case -W misses"; exit 1; }
          # "output traceback" is the class myst-nb gives a rendered error output.
          grep -q 'output traceback' harness/_build/html/display_error.html \
            || { echo "::error::display_error.html does not show a traceback, so the fixture no longer stages a display-time error"; exit 1; }
          grep -q 'harness: the next cell ran' harness/_build/html/display_error.html \
            || { echo "::error::display_error.html lacks the next cell's output: the kernel stopped at the display error"; exit 1; }
          # The control is real: its notebook holds an error output.
          grep -q '"output_type": "error"' harness/_build/jupyter_execute/raises.ipynb \
            || { echo "::error::raises.ipynb holds no error output, so the raises-exception control tests nothing"; exit 1; }
          echo "✅ error-outputs: fail failed the step on the display-time error, and allowed the tagged cell"

      - name: Build lectures with error-outputs warn
        id: warn
        continue-on-error: true
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'
          output-dir: 'harness'
          error-outputs: 'warn'

      - name: Build lectures with error-outputs ignore
        id: ignore
        continue-on-error: true
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'
          output-dir: 'harness'
          error-outputs: 'ignore'

      # Fails before the build, in seconds.
      - name: Build lectures with an invalid error-outputs (expected to fail)
        id: invalid
        continue-on-error: true
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'
          output-dir: 'harness'
          error-outputs: 'loud'

      - name: Assert warn passes and reports, ignore passes silently, and an invalid value builds nothing
        env:
          WARN_OUTCOME: ${{ steps.warn.outcome }}
          WARN_COUNT: ${{ steps.warn.outputs.error-output-count }}
          IGNORE_OUTCOME: ${{ steps.ignore.outcome }}
          IGNORE_COUNT: ${{ steps.ignore.outputs.error-output-count }}
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
          INVALID_BUILD_PATH: ${{ steps.invalid.outputs.build-path }}
        run: |
          [ "$WARN_OUTCOME" = "success" ] || { echo "::error::error-outputs: warn reported [$WARN_OUTCOME]: it must pass"; exit 1; }
          [ "$WARN_COUNT" = "1" ] || { echo "::error::error-outputs: warn gave error-output-count [$WARN_COUNT], expected [1]: it must still report the error"; exit 1; }
          [ "$IGNORE_OUTCOME" = "success" ] || { echo "::error::error-outputs: ignore reported [$IGNORE_OUTCOME]: it must pass"; exit 1; }
          [ -z "$IGNORE_COUNT" ] || { echo "::error::error-outputs: ignore gave error-output-count [$IGNORE_COUNT]: the check must not run"; exit 1; }
          [ "$INVALID_OUTCOME" = "failure" ] || { echo "::error::error-outputs: 'loud' reported [$INVALID_OUTCOME]: an invalid value must fail the step"; exit 1; }
          [ -z "$INVALID_BUILD_PATH" ] || { echo "::error::error-outputs: 'loud' set build-path [$INVALID_BUILD_PATH]: an invalid value must fail before the build"; exit 1; }
          echo "✅ warn passed with the error reported, ignore passed without checking, and an invalid value failed before building"

  build-html-copy:
    # #228: html-copy-pdf and html-copy-notebooks, which no other job here
    # turns on. build-jupyter-cache sets both, but runs build-lectures at @v0,
    # so its jobs test the release, not this pull request. The PDF and the
    # notebook are stand-ins, put where a pdflatex and a jupyter build under
    # output-dir would leave them: what is tested is the copy into the site.
    name: 'build-lectures: html-copy-pdf and html-copy-notebooks copy the PDF and notebooks into the site'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-seed
    steps:
      # Full history, as in build-fail-guard.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same salt as env-seed, so the conda env restores from its cache.
      - name: Recreate salted fixture, with a PDF and a notebook to copy
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md
          mkdir -p harness/_build/latex harness/_build/jupyter
          printf '%%PDF-1.4\n%% harness stand-in %s\n' "$SALT" > harness/_build/latex/harness-book.pdf
          printf '{"cells": [], "metadata": {"harness": "%s"}, "nbformat": 4, "nbformat_minor": 5}\n' "$SALT" > harness/_build/jupyter/lecture1.ipynb

      - name: Setup environment
        uses: ./setup-environment
        with:
          environment: 'harness/environment.yml'

      - name: Build lectures (html, copying the PDF and the notebooks)
        id: build
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'
          output-dir: 'harness'
          html-copy-pdf: 'true'
          html-copy-notebooks: 'true'

      - name: Assert the site was built with both copies in it
        env:
          BUILD_PATH: ${{ steps.build.outputs.build-path }}
        run: |
          [ "$BUILD_PATH" = "harness/_build/html" ] || { echo "::error::build-path: expected [harness/_build/html], got [$BUILD_PATH]"; exit 1; }
          [ -f harness/_build/html/index.html ] || { echo "::error::no index.html produced"; exit 1; }
          cmp harness/_build/latex/harness-book.pdf harness/_build/html/_pdf/harness-book.pdf \
            || { echo "::error::html-copy-pdf: harness/_build/html/_pdf/harness-book.pdf is missing or differs from the PDF under _build/latex"; ls -la harness/_build/html/_pdf || true; exit 1; }
          cmp harness/_build/jupyter/lecture1.ipynb harness/_build/html/_notebooks/lecture1.ipynb \
            || { echo "::error::html-copy-notebooks: harness/_build/html/_notebooks/lecture1.ipynb is missing or differs from the notebook under _build/jupyter"; ls -la harness/_build/html/_notebooks || true; exit 1; }
          echo "✅ the html build copied the PDF into _pdf/ and the notebook into _notebooks/"

  # ==========================================================================
  # setup-environment — container mode, in the real lean image
  # ==========================================================================

  env-container-update:
    # #107: container mode ran `conda env update -f <file>` with no target, so
    # conda took it from the file's own name: and a delta saying anything but
    # the image's env went to a new envs/<name> that is not on PATH, while the
    # step printed success and the build failed later on an import. The delta
    # here deliberately says `name: wrong-name`; it must land in the env whose
    # python is on PATH, create nothing else, and leave the image's own
    # packages in place (no --prune).
    #
    # The package is a pip one, pinned, tiny and pure-Python, so the only conda
    # work is a no-op solve for pip itself. It is checked absent from the image
    # before the action runs, so a pass cannot come from the image alone.
    name: 'setup-environment: container-mode delta lands in the env on PATH'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    permissions:
      contents: read
      packages: read          # pull the container image
    container:
      image: ghcr.io/quantecon/quantecon-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v7

      - name: Write a delta file whose name is not the active environment
        run: |
          if python -c 'import cowsay' 2>/dev/null; then
            echo "::error::cowsay is already importable in the image, so this job cannot tell whether the delta was applied. Pick a package the image does not ship."
            exit 1
          fi
          mkdir -p harness
          printf '%s\n' \
            'name: wrong-name' \
            'dependencies:' \
            '  - pip' \
            '  - pip:' \
            '    - cowsay==6.1' > harness/environment-update.yml
          cat harness/environment-update.yml

      # Expect a ::warning:: that the file's name: disagrees with the active
      # env — that is the action reporting the mismatch it now ignores.
      - name: Setup environment (container mode, with the delta)
        id: setup
        uses: ./setup-environment
        with:
          environment-update: 'harness/environment-update.yml'

      - name: Assert the delta landed in the environment on PATH
        env:
          CONTAINER_MODE: ${{ steps.setup.outputs.container-mode }}
        run: |
          [ "$CONTAINER_MODE" = "true" ] || { echo "::error::container-mode: expected [true] inside the quantecon-build image, got [$CONTAINER_MODE]"; exit 1; }
          PREFIX=$(python -c 'import sys; print(sys.prefix)')
          python -c 'import cowsay' \
            || { echo "::error::cowsay is not importable by the python on PATH ($PREFIX): the delta went to some other environment"; exit 1; }
          BASE=$(conda info --base)
          [ ! -e "$BASE/envs/wrong-name" ] \
            || { echo "::error::$BASE/envs/wrong-name exists: the update followed the delta file's name: key (the #107 defect)"; exit 1; }
          python -c 'import jupyter_book, numpy' \
            || { echo "::error::the image's own packages are gone from $PREFIX after the update: was it run with --prune?"; exit 1; }
          echo "✅ the delta landed in $PREFIX, the environment on PATH, and the image's packages survived"

  # ==========================================================================
  # templates/ci.yml pdf-check (#230) — the hand-off, in the real lean image
  # ==========================================================================
  #
  # The template's pdf-check job builds the PDF from the execution cache the
  # build job uploads, so it executes no notebook and needs no GPU. These two
  # jobs run that hand-off on the fixture and check what the template promises:
  # the HTML build passes LaTeX that the PDF build rejects; the cache arrives
  # (it is a hidden directory, which upload-artifact skips unless told to
  # include it); the PDF build then executes nothing; and it fails on that
  # LaTeX. Keep the upload and download steps in step with templates/ci.yml.
  # They also pin actions/download-artifact in a workflow, as the gate's pin
  # check requires of every action a template uses.
  #
  # They also run the template's switch plumbing, which only a run can
  # evaluate: PDF_CHECK in the workflow's env:, read into a job output (a
  # job-level if: cannot read env), the upload step gated on env, and the PDF
  # job gated on the output. If the output came through empty, pdf-check-build
  # would be skipped, and harness-summary fails a skipped job. The
  # pdf-check-switch-* jobs run the 'false' path.
  #
  # Both jobs write the same fixture, so lecture1 hashes the same in both and
  # its cached outputs match. Its extra cell leaves a marker in /tmp when it
  # executes, outside the workspace, so nothing carries the marker between
  # jobs. badmath.md is math that MathJax renders and pdflatex rejects: an
  # undefined control sequence. It is written into the source directory in
  # both jobs, and built only once a job adds it to the toc.

  pdf-check-handoff:
    name: 'templates/ci.yml pdf-check: the HTML build passes LaTeX-only breakage and hands over its cache'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    permissions:
      contents: read
      packages: read          # pull the container image
    container:
      image: ghcr.io/quantecon/quantecon-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    # As templates/ci.yml's build job.
    outputs:
      pdf-check: ${{ env.PDF_CHECK }}
    steps:
      - uses: actions/checkout@v7

      - name: Write the fixture with an execution marker and a LaTeX-only error
        run: |
          cp -r .github/fixtures/mini-lectures harness
          cat >> harness/lectures/lecture1.md <<'EOF'

          ```{code-cell} python3
          import pathlib
          pathlib.Path("/tmp/harness-lecture1-executed").touch()
          ```
          EOF
          cat > harness/lectures/badmath.md <<'EOF'
          # LaTeX the HTML Build Accepts

          ```{math}
          \harnessundefinedmacro{x}
          ```
          EOF
          printf '  - file: badmath\n' >> harness/lectures/_toc.yml

      - name: Setup environment
        uses: ./setup-environment

      - name: Build lectures (HTML)
        uses: ./build-lectures
        with:
          builder: 'html'
          source-dir: 'harness/lectures'

      - name: Assert the HTML build passed the bad math and executed lecture1
        run: |
          grep -q 'harnessundefinedmacro' _build/html/badmath.html \
            || { echo "::error::_build/html/badmath.html is missing or lacks the bad math, so the HTML build did not pass it through"; exit 1; }
          [ -e /tmp/harness-lecture1-executed ] \
            || { echo "::error::lecture1 executed but left no marker, so pdf-check-build's 'no marker' assertion would prove nothing"; exit 1; }
          [ -f _build/.jupyter_cache/global.db ] \
            || { echo "::error::the HTML build left no _build/.jupyter_cache/global.db to hand over"; exit 1; }
          echo "✅ the HTML build passed LaTeX that pdflatex rejects, and executed lecture1 into the cache"

      # As templates/ci.yml's "Upload executed notebooks for pdf-check".
      - name: Upload the execution cache
        if: env.PDF_CHECK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: harness-jupyter-cache
          path: _build/.jupyter_cache
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  pdf-check-build:
    name: 'templates/ci.yml pdf-check: the PDF builds from the handed-over cache, executes nothing, and fails on LaTeX-only breakage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pdf-check-handoff
    # As templates/ci.yml's pdf-check job.
    if: needs.pdf-check-handoff.outputs.pdf-check == 'true'
    permissions:
      contents: read
      packages: read          # pull the container image
    container:
      image: ghcr.io/quantecon/quantecon-build:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v7

      # The same fixture as pdf-check-handoff writes, but badmath stays out of
      # the toc until the last build.
      - name: Write the fixture with an execution marker and a LaTeX-only error
        run: |
          cp -r .github/fixtures/mini-lectures harness
          cat >> harness/lectures/lecture1.md <<'EOF'

          ```{code-cell} python3
          import pathlib
          pathlib.Path("/tmp/harness-lecture1-executed").touch()
          ```
          EOF
          cat > harness/lectures/badmath.md <<'EOF'
          # LaTeX the HTML Build Accepts

          ```{math}
          \harnessundefinedmacro{x}
          ```
          EOF

      - name: Setup environment
        uses: ./setup-environment

      # As templates/ci.yml's "Download executed notebooks".
      - name: Download the execution cache
        uses: actions/download-artifact@v8
        with:
          name: harness-jupyter-cache
          path: _build/.jupyter_cache

      - name: Assert the cache arrived
        run: |
          [ -f _build/.jupyter_cache/global.db ] \
            || { echo "::error::_build/.jupyter_cache/global.db did not arrive: the upload left out the hidden directory, or the download put it elsewhere"; ls -la _build _build/.jupyter_cache || true; exit 1; }
          echo "✅ the execution cache arrived in _build/.jupyter_cache"

      - name: Build lectures (PDF)
        uses: ./build-lectures
        with:
          builder: 'pdflatex'
          source-dir: 'harness/lectures'

      # A container job's default shell is sh, not bash: keep these POSIX.
      - name: Assert the PDF was built from the cache, executing nothing
        run: |
          ls _build/latex/*.pdf > /dev/null 2>&1 \
            || { echo "::error::the pdflatex build passed but left no PDF in _build/latex"; ls -la _build/latex || true; exit 1; }
          [ ! -e /tmp/harness-lecture1-executed ] \
            || { echo "::error::lecture1 executed in the PDF build: the handed-over cache did not match, so pdf-check would re-execute every notebook"; exit 1; }
          grep -q 'sum of squares: 285' _build/latex/*.tex \
            || { echo "::error::lecture1's cached output is not in the LaTeX source"; exit 1; }
          echo "✅ the PDF was built from the handed-over cache, with no notebook executed"

      - name: Add the bad math to the toc
        run: |
          printf '  - file: badmath\n' >> harness/lectures/_toc.yml

      # Expect ::error:: annotations from build-lectures' failure reporter and
      # LaTeX's own error in this job's log: they are the check working.
      - name: Build lectures (PDF, expected to fail)
        id: broken
        continue-on-error: true
        uses: ./build-lectures
        with:
          builder: 'pdflatex'
          source-dir: 'harness/lectures'

      - name: Assert the LaTeX error failed the build
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] \
            || { echo "::error::the PDF build reported [$OUTCOME] over math that pdflatex rejects: pdf-check would pass a PDF that breaks the publish"; exit 1; }
          # Attribute the red, as build-fail-guard does: a failure from some
          # other cause would leave this job green while the check was broken.
          if ! grep -q 'Undefined control sequence' _build/latex/*.log || ! grep -q 'harnessundefinedmacro' _build/latex/*.log; then
            echo "::error::the PDF build failed, but no LaTeX log in _build/latex reports the undefined harnessundefinedmacro, so the red is not the staged error"
            tail -n 40 _build/latex/*.log || true
            exit 1
          fi
          [ ! -e /tmp/harness-lecture1-executed ] \
            || { echo "::error::lecture1 executed in the second PDF build"; exit 1; }
          echo "✅ LaTeX that the HTML build passed fails the PDF build"

  # The 'false' path of the switch, in three small jobs. The first sets
  # PDF_CHECK 'false' at job level, overriding the workflow's 'true' as a site's
  # own env: block would, and stands in for the build job: its output and its
  # gated upload step. The second stands in for pdf-check and must be skipped,
  # so it is not in harness-summary's needs:, which fails a skipped job; the
  # third checks that it was skipped. Each stand-in fails if it runs.
  pdf-check-switch-off:
    name: "templates/ci.yml pdf-check: PDF_CHECK 'false' skips the upload step"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    env:
      PDF_CHECK: 'false'
    outputs:
      pdf-check: ${{ env.PDF_CHECK }}
    steps:
      - name: Stand-in for the upload step (must be skipped)
        if: env.PDF_CHECK == 'true'
        run: |
          echo "::error::the upload step ran with PDF_CHECK 'false'"
          exit 1

  pdf-check-switch-off-job:
    name: "templates/ci.yml pdf-check: stand-in for pdf-check (must be skipped)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: pdf-check-switch-off
    if: needs.pdf-check-switch-off.outputs.pdf-check == 'true'
    steps:
      - name: Fail, because this job ran
        run: |
          echo "::error::pdf-check ran with PDF_CHECK 'false'"
          exit 1

  pdf-check-switch-verify:
    name: "templates/ci.yml pdf-check: PDF_CHECK 'false' skips the job"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [pdf-check-switch-off, pdf-check-switch-off-job]
    # Skipped with pdf-check-switch-off, so it skips when the gate does.
    if: ${{ !cancelled() && needs.pdf-check-switch-off.result == 'success' }}
    steps:
      - name: Assert the output said 'false' and the job was skipped
        env:
          OUTPUT: ${{ needs.pdf-check-switch-off.outputs.pdf-check }}
          JOB_RESULT: ${{ needs.pdf-check-switch-off-job.result }}
        run: |
          [ "$OUTPUT" = "false" ] \
            || { echo "::error::the job output carried [$OUTPUT], not the job's PDF_CHECK 'false'"; exit 1; }
          [ "$JOB_RESULT" = "skipped" ] \
            || { echo "::error::the stand-in for pdf-check finished as [$JOB_RESULT]; with PDF_CHECK 'false' it must be skipped"; exit 1; }
          echo "✅ PDF_CHECK 'false' reached the job output, and the dependent job was skipped"

  # ==========================================================================
  # templates/ci.yml deploy (#232) — the site handed to a job that builds nothing
  # ==========================================================================
  #
  # The template builds the site in one job and deploys it from another. The
  # deploy job holds the provider token, so it runs no notebook or repository
  # code, and its checkout leaves no token in git's config. These two jobs run
  # that hand-off and check what the template relies on:
  #   - the site arrives whole, hidden files included: upload-artifact leaves
  #     out a file whose name starts with a dot unless told to include it,
  #     and Sphinx writes one, .buildinfo;
  #   - from a depth-1 checkout with persist-credentials: false, change
  #     detection still fetches the history it needs from github.com, with no
  #     credentials, as a public repository's deploy job does, and lists the
  #     files GitHub lists for the pull request. preview-change-detection
  #     tests the script's logic against a local server; this is GitHub, and
  #     the checkout the template makes. A private repository's fetch would
  #     fail, and the script would warn: the template tells such a repository
  #     to set fetch-depth: 0 instead.
  # Keep the upload, checkout and download steps in step with templates/ci.yml.

  preview-site-handoff:
    name: 'templates/ci.yml deploy: the build job uploads the site, hidden files included'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    outputs:
      manifest: ${{ steps.site.outputs.manifest }}
    steps:
      - name: Write a site with hidden files and a nested directory
        id: site
        run: |
          set -euo pipefail
          mkdir -p _build/html/_static/.hidden _build/html/sub
          echo '<h1>harness</h1>' > _build/html/index.html
          echo '<p>nested</p>' > _build/html/sub/page.html
          echo "config: $SALT" > _build/html/.buildinfo
          echo 'in a hidden directory' > _build/html/_static/.hidden/file.txt
          # Every file's path and content, which the deploy side recomputes.
          manifest=$(cd _build/html && find . -type f | LC_ALL=C sort | xargs sha256sum)
          echo "$manifest"
          echo "manifest=$(sha256sum <<< "$manifest" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # As templates/ci.yml's "Upload the built site for deploy".
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: harness-html
          path: _build/html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  preview-deploy-job:
    name: 'templates/ci.yml deploy: the site arrives whole, and change detection fetches with no stored credentials'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preview-site-handoff
    permissions:
      contents: read          # checkout
      pull-requests: read     # pulls/{n}/files, GitHub's own list to compare with
    steps:
      # As templates/ci.yml's deploy job's checkout.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # As templates/ci.yml's "Download the built site".
      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: harness-html
          path: _build/html

      - name: Assert the site arrived with every file the build job wrote
        env:
          WANT: ${{ needs.preview-site-handoff.outputs.manifest }}
        run: |
          set -euo pipefail
          [ -n "$WANT" ] || { echo "::error::preview-site-handoff set no manifest output"; exit 1; }
          if [ ! -f _build/html/.buildinfo ] || [ ! -f _build/html/_static/.hidden/file.txt ]; then
            echo "::error::the hidden files did not arrive: the upload left them out, so the deploy would publish less than the build wrote"
            ls -laR _build/html || true
            exit 1
          fi
          manifest=$(cd _build/html && find . -type f | LC_ALL=C sort | xargs sha256sum)
          echo "$manifest"
          got=$(sha256sum <<< "$manifest" | cut -d' ' -f1)
          [ "$got" = "$WANT" ] \
            || { echo "::error::the downloaded site is not what the build job uploaded: manifest $got, expected $WANT"; exit 1; }
          echo "✅ the site arrived in _build/html with every file the build job wrote, hidden ones included"

      # Only a pull request has a base and a head to compare.
      - name: Assert change detection lists the pull request's files, fetching with no stored credentials
        if: github.event_name == 'pull_request'
        env:
          # Only for the API call below. The script runs without it, so no
          # credential helper could hand it to git either.
          API_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # What a fetch could authenticate with: the extraheader that
          # actions/checkout leaves without persist-credentials: false, or a
          # credential helper, which a hosted runner does not configure.
          if creds=$(git config --show-origin --get-regexp '^(http\..*\.extraheader|credential\..*)$'); then
            echo "::error::git has credentials configured, so this would not test a fetch without them: $creds"; exit 1
          fi
          [ "$(git rev-parse --is-shallow-repository)" = true ] \
            || { echo "::error::the checkout is not shallow, so change detection would fetch nothing"; exit 1; }

          # This repository has no lectures. The manual's pages stand in for
          # them: they are .md files under one directory, as lectures are, and
          # pull requests here often change them.
          dir=docs
          env -u API_TOKEN GITHUB_OUTPUT="$RUNNER_TEMP/detect.out" LECTURES_DIR="$dir" bash scripts/detect-changed-lectures.sh \
            | tee "$RUNNER_TEMP/detect.log"
          if grep -q '^::warning::' "$RUNNER_TEMP/detect.log"; then
            echo "::error::change detection warned (above), so it could not fetch or compare the pull request's commits without credentials"; exit 1
          fi
          git rev-parse -q --verify refs/remotes/origin/pr-base > /dev/null \
            || { echo "::error::change detection fetched nothing, so this did not test a fetch"; exit 1; }
          got=$(awk '/^changed-files<<EOF$/ { on = 1; next } /^EOF$/ { on = 0 } on' "$RUNNER_TEMP/detect.out" | LC_ALL=C sort)

          # GitHub's list of the pull request's files, filtered as the
          # script filters: .md under the directory, not intro.md or _*, and
          # present in the checkout.
          want=$(GH_TOKEN="$API_TOKEN" gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | select(.status != "removed") | .filename' \
            | while IFS= read -r f; do
                if [[ "$f" == "$dir"/*.md && "$f" != "$dir"/_* && "$f" != "$dir/intro.md" && -f "$f" ]]; then
                  echo "$f"
                fi
              done | LC_ALL=C sort)
          echo "change detection: [${got//$'\n'/ }]"
          echo "GitHub:           [${want//$'\n'/ }]"
          [ "$got" = "$want" ] \
            || { echo "::error::change detection listed [${got//$'\n'/ }], but GitHub lists [${want//$'\n'/ }] under $dir/ for this pull request"; exit 1; }
          echo "✅ with no credentials stored, change detection fetched the history it needed and listed $(grep -c . <<< "$got" || true) file(s) under $dir/, as GitHub does"

  # ==========================================================================
  # Container images — a pull request's candidates, built and smoke-tested (#142)
  # ==========================================================================

  # Not an action test. It is here so that the one required check covers the
  # images: before it, a pull request that changed only containers/** ran
  # every job in this file, none of which builds or pulls the changed image,
  # and reported `Action harness: all checks` green. validate-containers.yml
  # works out which images the pull request changes, pushes each as a pr-<N>
  # candidate (never :latest) and runs test-container.yml's smoke test on it.
  # On a push or a dispatch, or a pull request that changes no image, its plan
  # job finds nothing to build and it passes having pushed nothing; a fork's
  # pull request that changes an image fails it, since it cannot push one.
  container-images:
    name: 'Container images'
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    # A ceiling for the called workflows, not a grant: each of their jobs sets
    # its own permissions. Of the jobs that run from here, only the candidate
    # builds get packages: write; issues and actions are for notify-failure
    # jobs, which run only on unattended events, never on these. A fork's pull
    # request gets a read-only token regardless.
    permissions:
      contents: read
      pull-requests: read
      packages: write
      issues: write
      actions: read
    uses: ./.github/workflows/validate-containers.yml

  # ==========================================================================
  # build-jupyter-cache — smoke + round-trip into restore-jupyter-cache.
  # Its internal setup-environment/build-lectures calls run @v0 (see header).
  # ==========================================================================

  bjc-smoke:
    name: 'build-jupyter-cache: html build of the fixture, caches saved'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Ordered after env-seed so the internal setup-environment@v0 can reuse the
    # conda cache while @v0 and ./setup-environment share a key format. When
    # they differ, as between a key change (#205) and the release that carries
    # it, @v0 misses env-seed's cache and solves fresh: slower, still correct.
    needs: env-seed
    steps:
      - uses: actions/checkout@v7

      - name: Recreate salted fixture
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md

      - name: Build and cache
        id: bjc
        uses: ./build-jupyter-cache
        with:
          builders: 'html'
          environment: 'harness/environment.yml'
          source-dir: 'harness/lectures'
          create-issue-on-failure: 'false'
          upload-artifact: 'false'

      - name: Assert outputs and build artifacts
        env:
          BUILD_SUCCESS: ${{ steps.bjc.outputs.build-success }}
          CACHE_SAVED: ${{ steps.bjc.outputs.cache-saved }}
          CACHE_KEY: ${{ steps.bjc.outputs.cache-key }}
          HTML_STATUS: ${{ steps.bjc.outputs.html-status }}
          JUPYTER_STATUS: ${{ steps.bjc.outputs.jupyter-status }}
          PDFLATEX_STATUS: ${{ steps.bjc.outputs.pdflatex-status }}
          EXPECTED_KEY: build-${{ hashFiles('harness/environment.yml') }}--${{ github.run_id }}
        run: |
          [ "$BUILD_SUCCESS" = "true" ] || { echo "::error::build-success: expected [true], got [$BUILD_SUCCESS]"; exit 1; }
          [ "$CACHE_SAVED" = "true" ] || { echo "::error::cache-saved: expected [true], got [$CACHE_SAVED]"; exit 1; }
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          [ "$HTML_STATUS" = "success" ] || { echo "::error::html-status: expected [success], got [$HTML_STATUS]"; exit 1; }
          [ "$JUPYTER_STATUS" = "skipped" ] || { echo "::error::jupyter-status: expected [skipped], got [$JUPYTER_STATUS]"; exit 1; }
          [ "$PDFLATEX_STATUS" = "skipped" ] || { echo "::error::pdflatex-status: expected [skipped], got [$PDFLATEX_STATUS]"; exit 1; }
          [ -f _build/html/index.html ] || { echo "::error::no _build/html/index.html produced"; exit 1; }
          [ -f _build/.jupyter_cache/global.db ] || { echo "::error::execution cache not populated by the build"; exit 1; }
          echo "✅ build-jupyter-cache built the fixture and saved both caches"

  bjc-fail-guard:
    # The negative half of build-jupyter-cache's contract, and the counterpart to
    # build-fail-guard one level up. #83's core defect was that this whole path —
    # everything after a build fails — was exercised only when something else was
    # already broken, so three independent bugs accumulated on it unnoticed.
    #
    # Scope, stated honestly: this asserts the failure-path CONTRACT (the step
    # fails, the per-builder statuses are right, and no cache is saved over a
    # broken build). It does NOT exercise the issue-filing path — that needs
    # `issues: write` and would file real issues in this repo on every PR run,
    # so it belongs to the canary (QuantEcon/test-actions-lecture-intro), which
    # runs in container mode against @v0 and has a tracker that can absorb them.
    name: 'build-jupyter-cache: a failing build fails the step, no cache saved'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: env-seed
    steps:
      - uses: actions/checkout@v7

      # Same staged failure as build-fail-guard: derive the broken page from the
      # good one so only the raised AssertionError differs.
      - name: Recreate salted fixture with a deliberately broken page
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md
          sed -e 's/^# An Executed Lecture$/# A Deliberately Broken Lecture/' \
              -e 's/^assert total == 285$/assert total == 0, "harness: deliberate build failure"/' \
              harness/lectures/lecture1.md > harness/lectures/broken.md
          printf '  - file: broken\n' >> harness/lectures/_toc.yml
          grep -q 'assert total == 0' harness/lectures/broken.md \
            || { echo "::error::fixture setup failed — broken.md has no failing cell"; exit 1; }

      # create-issue-on-failure is false on purpose — see the note above.
      # upload-artifact is on, so the last two steps can check what the
      # build-cache artifact holds.
      - name: Build and cache (expected to fail)
        id: bjc
        continue-on-error: true
        uses: ./build-jupyter-cache
        with:
          builders: 'html'
          environment: 'harness/environment.yml'
          source-dir: 'harness/lectures'
          create-issue-on-failure: 'false'
          upload-artifact: 'true'
          artifact-retention-days: '1'

      - name: Assert the failure propagated and nothing was cached
        env:
          OUTCOME: ${{ steps.bjc.outcome }}
          BUILD_SUCCESS: ${{ steps.bjc.outputs.build-success }}
          CACHE_SAVED: ${{ steps.bjc.outputs.cache-saved }}
          HTML_STATUS: ${{ steps.bjc.outputs.html-status }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::build-jupyter-cache reported [$OUTCOME] for a build whose execution raised — a failing cache build must fail the step"; exit 1; }
          [ "$BUILD_SUCCESS" = "false" ] || { echo "::error::build-success: expected [false], got [$BUILD_SUCCESS]"; exit 1; }
          [ "$HTML_STATUS" = "failure" ] || { echo "::error::html-status: expected [failure], got [$HTML_STATUS]"; exit 1; }
          # The point of preserving the old cache: a broken build must never
          # overwrite the last good one.
          [ "$CACHE_SAVED" = "false" ] || { echo "::error::cache-saved: expected [false] — a failed build must not overwrite the good cache, got [$CACHE_SAVED]"; exit 1; }
          echo "✅ a failing cache build fails the step and saves no cache"

      # #243, as in build-fail-guard. This checks the build-cache artifact, which
      # build-jupyter-cache uploads itself. The execution-reports-html artifact
      # here comes from build-lectures@v0, so build-fail-guard checks that one
      # against ./build-lectures instead.
      - name: Download the build-cache artifact
        uses: actions/download-artifact@v8
        with:
          name: build-cache-${{ github.run_id }}
          path: ${{ runner.temp }}/build-cache

      - name: Assert the build-cache artifact holds the whole _build tree
        run: |
          DIR="$RUNNER_TEMP/build-cache"
          [ -f "$DIR/html/reports/broken.err.log" ] \
            || { echo "::error::the build-cache artifact has no html/reports/broken.err.log"; find "$DIR" -maxdepth 2 | sort; exit 1; }
          # .jupyter_cache and .doctrees are hidden, which upload-artifact leaves
          # out unless include-hidden-files is set.
          for hidden in .jupyter_cache/global.db .doctrees/environment.pickle; do
            [ -f "$DIR/$hidden" ] \
              || { echo "::error::the build-cache artifact has no $hidden: upload-artifact describes it as the whole _build directory (#243)"; find "$DIR" -maxdepth 2 | sort; exit 1; }
          done
          echo "✅ the build-cache artifact holds the reports, the execution cache and the doctrees"

  bjc-abort-guard:
    # #123: the failure path is only reachable when something else is already
    # broken, so bugs accumulate on it unseen — the same structural problem as
    # #83. bjc-fail-guard above covers a failure *during* the builds. This one
    # covers a failure *before* them, which used to leave `all-passed` as ''
    # rather than 'false' and silently skipped every downstream guard: the
    # alert, the postcondition assert, and the fail step.
    #
    # Scope, stated honestly: like bjc-fail-guard this cannot assert that an
    # issue was actually FILED — that needs `issues: write` and would open real
    # issues in this repo on every PR run, so it stays with the canary. What it
    # does assert is the value all three guards read. `build-success` is 'false'
    # here only because the resolve step exists; before it, this job's central
    # assertion failed against an empty string, which is exactly the bug.
    name: 'build-jupyter-cache: an abort before the builds still reports failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      # Aborts in `Validate and parse builders input` — this repo's own code, no
      # conda, seconds. The composite never reaches setup-environment.
      - name: Abort before setup (invalid builders input)
        id: pre
        continue-on-error: true
        uses: ./build-jupyter-cache
        with:
          builders: 'nonsense'
          create-issue-on-failure: 'false'
          upload-artifact: 'false'

      - name: Assert a pre-setup abort reports failure, not an empty status
        env:
          OUTCOME: ${{ steps.pre.outcome }}
          BUILD_SUCCESS: ${{ steps.pre.outputs.build-success }}
          CACHE_SAVED: ${{ steps.pre.outputs.cache-saved }}
          HTML_STATUS: ${{ steps.pre.outputs.html-status }}
          ISSUE_URL: ${{ steps.pre.outputs.failure-issue-url }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::outcome: expected [failure] for an invalid builders input, got [$OUTCOME]"; exit 1; }
          # The #123 assertion. An empty value here is what made every guard skip.
          [ "$BUILD_SUCCESS" = "false" ] || { echo "::error::build-success: expected [false], got [$BUILD_SUCCESS] — an abort before the builds must resolve to false, never to '' (#123)"; exit 1; }
          [ "$CACHE_SAVED" = "false" ] || { echo "::error::cache-saved: expected [false], got [$CACHE_SAVED]"; exit 1; }
          # verify-builds never ran, so there is no per-builder verdict to give.
          # Empty is the honest answer; inventing 'skipped' would claim the
          # builder was considered and passed over.
          [ -z "$HTML_STATUS" ] || { echo "::error::html-status: expected empty (no builder was ever evaluated), got [$HTML_STATUS]"; exit 1; }
          [ -z "$ISSUE_URL" ] || { echo "::error::failure-issue-url: expected empty with create-issue-on-failure=false, got [$ISSUE_URL]"; exit 1; }
          echo "✅ a pre-setup abort resolves to build-success=false"

      # The variant #123 actually reported: setup-environment itself fails.
      #
      # A missing environment file rather than an unsolvable one, deliberately.
      # setup-environment validates the file's existence before it touches
      # conda, so this aborts in seconds and — the part that matters — no conda
      # cache is restored or saved. An unsolvable environment.yml would be a
      # closer analogue of the likeliest real trigger (#28), but it would spend
      # minutes in the solver and leave a junk conda cache entry per run. Do not
      # "improve" it into one: the assertions below are about where the abort
      # leaves `all-passed`, not about why conda failed.
      - name: Abort during setup (environment file does not exist)
        id: setup
        continue-on-error: true
        uses: ./build-jupyter-cache
        with:
          builders: 'html'
          environment: 'harness/no-such-environment.yml'
          source-dir: 'harness/lectures'
          create-issue-on-failure: 'false'
          upload-artifact: 'false'

      - name: Assert a setup failure reports failure, not an empty status
        env:
          OUTCOME: ${{ steps.setup.outcome }}
          BUILD_SUCCESS: ${{ steps.setup.outputs.build-success }}
          CACHE_SAVED: ${{ steps.setup.outputs.cache-saved }}
          HTML_STATUS: ${{ steps.setup.outputs.html-status }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::outcome: expected [failure] when setup-environment fails, got [$OUTCOME]"; exit 1; }
          [ "$BUILD_SUCCESS" = "false" ] || { echo "::error::build-success: expected [false], got [$BUILD_SUCCESS] — a setup failure must resolve to false, never to '' (#123)"; exit 1; }
          [ "$CACHE_SAVED" = "false" ] || { echo "::error::cache-saved: expected [false], got [$CACHE_SAVED]"; exit 1; }
          [ -z "$HTML_STATUS" ] || { echo "::error::html-status: expected empty (the build never started), got [$HTML_STATUS]"; exit 1; }
          echo "✅ a setup-environment failure resolves to build-success=false"

  bjc-builders-parse:
    # #107: `builders` used to be matched by substring, so 'html,pdf' passed
    # validation and built html alone without a word, and 'nojupyter' switched
    # the jupyter build ON. bjc-abort-guard's 'nonsense' cannot catch either:
    # it contains no valid name at all, so the old code rejected it too.
    #
    # Asserting "aborted before setup" needs a run in which setup would NOT
    # have failed, or the old code's setup-phase abort (no environment.yml
    # here) would pass the same assertions. So the runner is made a
    # container-mode host, the same marker file docs/dev/GPU-AMI-SETUP.md puts on a
    # GPU AMI: the internal setup-environment@v0 then skips conda entirely, and
    # every build the parser enables fails in seconds on the missing
    # source-dir. The per-builder statuses therefore record exactly which
    # builders were parsed: 'failure' = requested and attempted, 'skipped' =
    # left out, empty = the parse aborted before anything ran. The two control
    # cases come first; they prove the setup above is really a no-op, so the
    # empty statuses of the rejected inputs cannot be a setup failure instead.
    name: 'build-jupyter-cache: builders is parsed by exact token'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Mark the runner as a container-mode host
        run: |
          printf 'quantecon-container\nimage=harness-container-mode-host\n' | sudo tee /etc/quantecon-container

      - name: 'Control: three comma-separated builders'
        id: all
        continue-on-error: true
        uses: ./build-jupyter-cache
        with:
          builders: 'jupyter,pdflatex,html'
          source-dir: 'harness/no-such-lectures'
          create-issue-on-failure: 'false'
          upload-artifact: 'false'
          upload-failure-reports: 'false'

      - name: Assert all three builders were attempted
        env:
          JUPYTER_STATUS: ${{ steps.all.outputs.jupyter-status }}
          PDFLATEX_STATUS: ${{ steps.all.outputs.pdflatex-status }}
          HTML_STATUS: ${{ steps.all.outputs.html-status }}
        run: |
          [ "$JUPYTER_STATUS/$PDFLATEX_STATUS/$HTML_STATUS" = "failure/failure/failure" ] \
            || { echo "::error::expected every builder attempted (failure/failure/failure against a missing source-dir), got jupyter/pdflatex/html = [$JUPYTER_STATUS/$PDFLATEX_STATUS/$HTML_STATUS]. All empty means the builds never started: the container-mode host marker no longer makes setup a no-op, and the rejection cases below prove nothing until it does."; exit 1; }
          echo "✅ 'jupyter,pdflatex,html' enabled all three builders"

      # A YAML block value: newline, trailing comma and indentation all separate.
      - name: 'Control: a block value with a trailing comma'
        id: block
        continue-on-error: true
        uses: ./build-jupyter-cache
        with:
          builders: |
            html,
            pdflatex
          source-dir: 'harness/no-such-lectures'
          create-issue-on-failure: 'false'
          upload-artifact: 'false'
          upload-failure-reports: 'false'

      - name: Assert exactly html and pdflatex were attempted
        env:
          JUPYTER_STATUS: ${{ steps.block.outputs.jupyter-status }}
          PDFLATEX_STATUS: ${{ steps.block.outputs.pdflatex-status }}
          HTML_STATUS: ${{ steps.block.outputs.html-status }}
        run: |
          [ "$JUPYTER_STATUS/$PDFLATEX_STATUS/$HTML_STATUS" = "skipped/failure/failure" ] \
            || { echo "::error::expected jupyter/pdflatex/html = [skipped/failure/failure] for a two-line block value, got [$JUPYTER_STATUS/$PDFLATEX_STATUS/$HTML_STATUS]"; exit 1; }
          echo "✅ a multi-line builders value parsed to html + pdflatex"

      # Expect "Unknown builder" ::error:: annotations from these two in this
      # job's log — they are the parser working correctly.
      - name: Reject a partly unknown list ('html,pdf')
        id: partial
        continue-on-error: true
        uses: ./build-jupyter-cache
        with:
          builders: 'html,pdf'
          source-dir: 'harness/no-such-lectures'
          create-issue-on-failure: 'false'
          upload-artifact: 'false'
          upload-failure-reports: 'false'

      - name: Reject a name that merely contains a builder ('nojupyter')
        id: substring
        continue-on-error: true
        uses: ./build-jupyter-cache
        with:
          builders: 'nojupyter'
          source-dir: 'harness/no-such-lectures'
          create-issue-on-failure: 'false'
          upload-artifact: 'false'
          upload-failure-reports: 'false'

      # Same assertions as bjc-abort-guard's pre-setup abort, applied to both.
      - name: Assert both aborted before setup, with no builder run
        env:
          PARTIAL_OUTCOME: ${{ steps.partial.outcome }}
          PARTIAL_SUCCESS: ${{ steps.partial.outputs.build-success }}
          PARTIAL_STATUSES: ${{ steps.partial.outputs.jupyter-status }}/${{ steps.partial.outputs.pdflatex-status }}/${{ steps.partial.outputs.html-status }}
          SUBSTRING_OUTCOME: ${{ steps.substring.outcome }}
          SUBSTRING_SUCCESS: ${{ steps.substring.outputs.build-success }}
          SUBSTRING_STATUSES: ${{ steps.substring.outputs.jupyter-status }}/${{ steps.substring.outputs.pdflatex-status }}/${{ steps.substring.outputs.html-status }}
        run: |
          fail=0
          check() {  # label outcome build-success statuses
            if [ "$2" != "failure" ] || [ "$3" != "false" ] || [ "$4" != "//" ]; then
              echo "::error::builders '$1': expected outcome=failure, build-success=false and no builder run (jupyter/pdflatex/html empty), got outcome=[$2] build-success=[$3] statuses=[$4]. A non-empty status means the parser accepted the input and built something."
              fail=1
            else
              echo "✅ builders '$1' was rejected before setup"
            fi
          }
          check 'html,pdf' "$PARTIAL_OUTCOME" "$PARTIAL_SUCCESS" "$PARTIAL_STATUSES"
          check 'nojupyter' "$SUBSTRING_OUTCOME" "$SUBSTRING_SUCCESS" "$SUBSTRING_STATUSES"
          exit "$fail"

  bjc-restore-build:
    name: 'round-trip: restore-jupyter-cache reads build-jupyter-cache (build)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bjc-smoke
    steps:
      - uses: actions/checkout@v7

      - name: Recreate salted fixture
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md

      # The real consumer flow: cache.yml populates on main, ci.yml restores
      # in a PR. fail-on-miss guards the whole chain.
      - name: Restore build cache
        id: restore
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'build'
          environment: 'harness/environment.yml'
          fail-on-miss: 'true'

      - name: Assert the built site round-tripped
        env:
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
          EXPECTED_KEY: build-${{ hashFiles('harness/environment.yml') }}--${{ github.run_id }}
        run: |
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          [ -f _build/html/index.html ] || { echo "::error::restored cache is missing _build/html/index.html"; exit 1; }
          grep -q "sum of squares: 285" _build/html/lecture1.html || { echo "::error::executed cell output missing from restored HTML"; exit 1; }
          echo "✅ full build cache round-trip: build-jupyter-cache → restore-jupyter-cache"

  bjc-restore-exec:
    name: 'round-trip: restore-jupyter-cache reads build-jupyter-cache (execution)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bjc-smoke
    steps:
      - uses: actions/checkout@v7

      - name: Recreate salted fixture
        run: |
          cp -r .github/fixtures/mini-lectures harness
          printf '\n# harness-salt: %s-book\n' "$SALT" >> harness/environment.yml
          printf '%% harness salt: %s-book\n' "$SALT" > harness/lectures/salt.md

      - name: Restore execution cache
        id: restore
        uses: ./restore-jupyter-cache
        with:
          cache-type: 'execution'
          source-dir: 'harness/lectures'
          fail-on-miss: 'true'

      - name: Assert only the execution cache round-tripped
        env:
          CACHE_KEY: ${{ steps.restore.outputs.cache-key }}
          EXPECTED_KEY: jupyter-cache-${{ hashFiles('harness/lectures/**/*.md') }}-${{ github.run_id }}
        run: |
          [ "$CACHE_KEY" = "$EXPECTED_KEY" ] || { echo "::error::cache-key: expected [$EXPECTED_KEY], got [$CACHE_KEY]"; exit 1; }
          [ -f _build/.jupyter_cache/global.db ] || { echo "::error::restored execution cache is missing global.db"; exit 1; }
          [ ! -d _build/html ] || { echo "::error::_build/html present — the build cache leaked into an execution-type restore"; exit 1; }
          echo "✅ execution cache round-trip: build-jupyter-cache → restore-jupyter-cache"

  # ==========================================================================
  # deploy-cloudflare (#163) — no Cloudflare account, no secrets
  # ==========================================================================
  #
  # A real deploy needs a gated Worker and a token, which a PR harness cannot
  # hold, so the first real deploy is the only proof of that half. What these
  # jobs can prove without one: that the gate probe tells every response shape
  # apart, that the action refuses before installing anything when the gate is
  # absent, that bad inputs fail fast, and that the pinned wrangler (which
  # Dependabot bumps) still accepts the config the action generates.

  dc-gate-probe:
    name: 'deploy-cloudflare: the gate probe tells every response shape apart, gated and public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      # server.py answers each path the way one real configuration would; see
      # its docstring. The probe's expected-failure annotations are rewritten
      # so a green run does not show a wall of red ::error:: lines.
      - name: Probe a local stand-in for each gate configuration
        env:
          TEAM: quantecon-harness.cloudflareaccess.com
        run: |
          set -euo pipefail
          python3 .github/fixtures/access-gate/server.py 8765 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 50); do curl -s -o /dev/null http://127.0.0.1:8765/missing && break; sleep 0.2; done
          B=http://127.0.0.1:8765

          expect() {
            local want=$1 pattern=$2; shift 2
            local got=0 out
            out=$(bash scripts/check-access-gate.sh "$@" 2>&1) || got=$?
            printf '%s\n' "${out//::error::/  (expected) }"
            [ "$got" = "$want" ] || { echo "::error::probe exited [$got], expected [$want] for: $*"; exit 1; }
            grep -q -- "$pattern" <<< "$out" || { echo "::error::probe output lacks [$pattern] for: $*"; exit 1; }
          }

          # Gated: the redirect lands on exactly the team domain, on the root
          # and on an asset path, including a mixed-case host with :443.
          expect 0 'PASS  302' "$TEAM" "$B/gated/" "$B/gated/data/latest.json"
          expect 0 'PASS  302' "$TEAM" "$B/mixed-case"
          expect 0 'PASS  302' "QuantEcon-Harness.CloudflareAccess.com" "$B/gated/"

          # Not gated, each for its own reason.
          expect 1 'wrong Access organisation' "$TEAM" "$B/wrong-org/"
          expect 1 'THE SITE IS PUBLIC'        "$TEAM" "$B/public/"
          expect 1 'not behind Access'         "$TEAM" "$B/same-host/"
          expect 1 '<no Location>'             "$TEAM" "$B/no-location"
          expect 1 'answered 404'              "$TEAM" "$B/missing"
          expect 1 'answered 500'              "$TEAM" "$B/broken"
          expect 1 'ambiguous Location'        "$TEAM" "$B/userinfo"
          expect 1 'could not be reached'      "$TEAM" "http://127.0.0.1:9/"
          # One public path fails the whole check, even when the root is gated:
          # the case the asset probe exists for.
          expect 1 'THE SITE IS PUBLIC'        "$TEAM" "$B/gated/" "$B/public/data/latest.json"

          expect 2 'usage:' "$TEAM"
          # An empty team must not match the empty host of a Location-less 302.
          expect 2 'must be <team>' "" "$B/no-location"
          # A 404 never proves a gate.
          expect 2 'needs --public' --allow-404 "$TEAM" "$B/missing"
          expect 2 'unknown option' --gated "$TEAM" "$B/gated/"

          # --public, the inverse (#177): served, on the root and on an asset.
          expect 0 'PASS  200 served anonymously' --public "$B/public/" "$B/public/data/latest.json"

          # Behind Access fails, whichever organisation's and however the host
          # is spelled; and --allow-404 does not soften it.
          expect 1 'THE SITE IS BEHIND ACCESS' --public "$B/gated/"
          expect 1 'THE SITE IS BEHIND ACCESS' --public "$B/wrong-org/"
          expect 1 'THE SITE IS BEHIND ACCESS' --public "$B/mixed-case"
          expect 1 'THE SITE IS BEHIND ACCESS' --public --allow-404 "$B/gated/"
          # One gated path fails the whole check, even when the root is served.
          expect 1 'THE SITE IS BEHIND ACCESS' --public "$B/public/" "$B/gated/data/latest.json"

          # Not served, each for its own reason.
          expect 1 'instead of serving'   --public "$B/same-host/"
          expect 1 '<no Location>'        --public "$B/no-location"
          expect 1 'ambiguous Location'   --public "$B/userinfo"
          expect 1 'answered 404'         --public "$B/missing"
          expect 1 'answered 500'         --public "$B/broken"
          expect 1 'could not be reached' --public "http://127.0.0.1:9/"

          # --allow-404, for the check before a deploy: a path the live version
          # lacks passes, as not behind Access.
          expect 0 'PASS  404 not behind Access' --public --allow-404 "$B/public/" "$B/missing"

          expect 2 'usage:' --public
          echo "✅ check-access-gate.sh passes only a redirect to the exact team domain, and with --public only a site served anonymously"

  dc-refuses-ungated:
    name: 'deploy-cloudflare: refuses before installing anything when the Worker is not gated'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create a site to (not) deploy
        run: |
          mkdir -p harness-site/data
          echo '<h1>private</h1>' > harness-site/index.html
          echo '{}' > harness-site/data/latest.json

      # A real request to workers.dev for a Worker that does not exist: the
      # answer is a 404 or an error, never a redirect to the team domain. If
      # workers.dev is unreachable the probe fails too, so this cannot go
      # green by accident. The token is fake: if the action got as far as
      # wrangler, the directory assertion below would catch it.
      - name: Deploy to a Worker that does not exist (expected to refuse)
        id: deploy
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-no-such-worker'
          account-subdomain: 'quantecon-harness-nonexistent'
          visibility: 'private'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'

      # The deprecated forms, for the one release they are kept (#177): with
      # neither input, and with require-access: 'true', the site is still
      # checked as private, so the same Worker is refused the same way.
      - name: The same, with neither visibility nor require-access (expected to refuse)
        id: neither
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-no-such-worker'
          account-subdomain: 'quantecon-harness-nonexistent'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'

      - name: The same, with require-access true (expected to refuse)
        id: require-true
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-no-such-worker'
          account-subdomain: 'quantecon-harness-nonexistent'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          require-access: 'true'

      # The visibility output is written only once every input is valid, so
      # `private` there pins the refusal on the check, not on validation.
      - name: Assert each refusal came from the private check, before wrangler
        env:
          RESULTS: |
            deploy ${{ steps.deploy.outcome }} ${{ steps.deploy.outputs.visibility }} ${{ steps.deploy.outputs.deploy-url }}
            neither ${{ steps.neither.outcome }} ${{ steps.neither.outputs.visibility }} ${{ steps.neither.outputs.deploy-url }}
            require-true ${{ steps.require-true.outcome }} ${{ steps.require-true.outputs.visibility }} ${{ steps.require-true.outputs.deploy-url }}
        run: |
          set -euo pipefail
          bad=0 n=0
          while read -r case outcome visibility url; do
            [ -n "$case" ] || continue
            n=$((n + 1))
            if [ "$outcome" != "failure" ] || [ "${visibility:-}" != "private" ] || [ -n "${url:-}" ]; then
              echo "::error::[$case]: expected outcome=failure, visibility=private and no deploy-url, got outcome=[$outcome] visibility=[${visibility:-}] deploy-url=[${url:-}]"
              bad=1
            else
              echo "✓ $case checked as private and refused"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 3 ] || { echo "::error::expected 3 cases, read $n"; exit 1; }
          # The prevention claim: wrangler was never even installed, so nothing
          # can have been uploaded.
          [ ! -e "$RUNNER_TEMP/deploy-cloudflare" ] || { echo "::error::$RUNNER_TEMP/deploy-cloudflare exists — the action reached the wrangler install despite the failed gate check"; bad=1; }
          [ "$bad" -eq 0 ]
          echo "✅ an ungated Worker is refused before anything is installed or uploaded, with visibility: private and with both deprecated forms"

      # Positive control, so the refusal above is attributable to the gate
      # check: the same inputs with the gate off pass validation, set up Node
      # and install the pinned wrangler, and only then fail (the token is fake).
      # The gate is off through the deprecated require-access: 'false', the
      # only way there is; it goes when require-access does.
      - name: Same inputs with the gate off (expected to reach wrangler, then fail)
        id: control
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-no-such-worker'
          account-subdomain: 'quantecon-harness-nonexistent'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          require-access: 'false'

      - name: Assert only the gate check stood between these inputs and wrangler
        env:
          OUTCOME: ${{ steps.control.outcome }}
          DEPLOY_URL: ${{ steps.control.outputs.deploy-url }}
          VISIBILITY: ${{ steps.control.outputs.visibility }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "::error::outcome: expected [failure] with a fake token, got [$OUTCOME]"; exit 1; }
          [ -z "$DEPLOY_URL" ] || { echo "::error::deploy-url: expected empty with a fake token, got [$DEPLOY_URL]"; exit 1; }
          # Empty: require-access: 'false' checks nothing, so claims no audience.
          [ -z "$VISIBILITY" ] || { echo "::error::visibility: expected empty with require-access: 'false', got [$VISIBILITY]"; exit 1; }
          [ -x "$RUNNER_TEMP/deploy-cloudflare/node_modules/.bin/wrangler" ] || { echo "::error::wrangler was not installed — the same inputs did not get past validation and the Node/npm steps with the gate off"; exit 1; }
          [ -f "$RUNNER_TEMP/deploy-cloudflare/harness-no-such-worker.wrangler.jsonc" ] || { echo "::error::the generated config is missing — the action stopped before writing it"; exit 1; }
          echo "✅ with the gate off the same inputs reach wrangler, so the refusal above came from the gate check"

  dc-refuses-mismatch:
    # #177: visibility is checked in both directions, so a Worker whose Access
    # setting contradicts it is refused before anything is uploaded, whichever
    # way round. workers.dev has no gated or public Worker this repository may
    # name, so both are stood in for on the runner: the action only ever
    # requests https://<worker-name>.<account-subdomain>.workers.dev, and
    # /etc/hosts points two such names at the access-gate fixture, over TLS
    # with a certificate the runner is made to trust. harness-gated answers
    # like a Worker behind Access, harness-public like one that is not.
    # Nothing leaves the runner but wrangler's calls in the two controls,
    # which fail on the fake token.
    name: 'deploy-cloudflare: refuses before installing anything when the Worker contradicts visibility'
    # A GitHub-hosted runner only: the stand-in edits the runner's CA store,
    # /etc/hosts and a sysctl, which a self-hosted runner would keep.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    env:
      GATED: harness-gated.quantecon-harness-local.workers.dev
      PUBLIC: harness-public.quantecon-harness-local.workers.dev
    steps:
      - uses: actions/checkout@v7

      - name: Create a site to (not) deploy
        run: |
          mkdir -p harness-site/data
          echo '<h1>report</h1>' > harness-site/index.html
          echo '{}' > harness-site/data/latest.json

      - name: Stand in for a gated and a public Worker on this runner
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/stand-in"
          mkdir -p "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=deploy-cloudflare harness' \
            -addext "subjectAltName=DNS:$GATED,DNS:$PUBLIC" -keyout "$d/key.pem" -out "$d/cert.pem" 2>/dev/null
          sudo cp "$d/cert.pem" /usr/local/share/ca-certificates/deploy-cloudflare-harness.crt
          sudo update-ca-certificates
          echo "127.0.0.1 $GATED $PUBLIC" | sudo tee -a /etc/hosts
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=443
          python3 .github/fixtures/access-gate/server.py 443 "$d/cert.pem" "$d/key.pem" > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 50); do curl -s -o /dev/null "https://$PUBLIC/" && break; sleep 0.2; done
          # Through the same probe the action runs, so the cases below fail
          # for the reason they claim, not for a stand-in that is not there.
          bash scripts/check-access-gate.sh quantecon-harness.cloudflareaccess.com "https://$GATED/" "https://$GATED/data/latest.json"
          bash scripts/check-access-gate.sh --public "https://$PUBLIC/" "https://$PUBLIC/data/latest.json"

      - name: Declared public, but the Worker is behind Access (expected to refuse)
        id: public-gated
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-gated'
          account-subdomain: 'quantecon-harness-local'
          visibility: 'public'
          build-dir: 'harness-site'

      - name: Declared private, but the Worker is public (expected to refuse)
        id: private-public
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-public'
          account-subdomain: 'quantecon-harness-local'
          visibility: 'private'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'

      # visibility is set only once every input is valid, so a set one pins
      # each refusal on the check before the deploy.
      - name: Assert both mix-ups were refused by the check, before wrangler
        env:
          RESULTS: |
            public-gated ${{ steps.public-gated.outcome }} public ${{ steps.public-gated.outputs.visibility }} ${{ steps.public-gated.outputs.deploy-url }}
            private-public ${{ steps.private-public.outcome }} private ${{ steps.private-public.outputs.visibility }} ${{ steps.private-public.outputs.deploy-url }}
        run: |
          set -euo pipefail
          bad=0 n=0
          while read -r case outcome want visibility url; do
            [ -n "$case" ] || continue
            n=$((n + 1))
            if [ "$outcome" != "failure" ] || [ "${visibility:-}" != "$want" ] || [ -n "${url:-}" ]; then
              echo "::error::[$case]: expected outcome=failure, visibility=$want and no deploy-url, got outcome=[$outcome] visibility=[${visibility:-}] deploy-url=[${url:-}]"
              bad=1
            else
              echo "✓ $case refused"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 2 ] || { echo "::error::expected 2 cases, read $n"; exit 1; }
          [ ! -e "$RUNNER_TEMP/deploy-cloudflare" ] || { echo "::error::$RUNNER_TEMP/deploy-cloudflare exists — a mix-up got as far as the wrangler install"; bad=1; }
          [ "$bad" -eq 0 ]
          echo "✅ a Worker that contradicts visibility is refused before anything is installed or uploaded, in both directions"

      # Positive controls, so each refusal above is attributable to the
      # mismatch: the same mode against a Worker that matches it passes the
      # check and reaches wrangler, which then fails on the fake token.
      - name: Declared public, and the Worker is (expected to reach wrangler, then fail)
        id: public-public
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-public'
          account-subdomain: 'quantecon-harness-local'
          visibility: 'public'
          build-dir: 'harness-site'

      - name: Assert the public check passed a public Worker
        env:
          OUTCOME: ${{ steps.public-public.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::outcome: expected [failure] with a fake token, got [$OUTCOME]"; exit 1; }
          [ -f "$RUNNER_TEMP/deploy-cloudflare/harness-public.wrangler.jsonc" ] || { echo "::error::the generated config is missing — the public check refused a public Worker"; exit 1; }
          # The next control must show its own install.
          rm -rf "$RUNNER_TEMP/deploy-cloudflare"
          echo "✅ visibility: public passes a Worker served anonymously"

      - name: Declared private, and the Worker is gated (expected to reach wrangler, then fail)
        id: private-gated
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-gated'
          account-subdomain: 'quantecon-harness-local'
          visibility: 'private'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'

      - name: Assert the private check passed a gated Worker
        env:
          OUTCOME: ${{ steps.private-gated.outcome }}
        run: |
          set -euo pipefail
          [ "$OUTCOME" = "failure" ] || { echo "::error::outcome: expected [failure] with a fake token, got [$OUTCOME]"; exit 1; }
          [ -f "$RUNNER_TEMP/deploy-cloudflare/harness-gated.wrangler.jsonc" ] || { echo "::error::the generated config is missing — the private check refused a gated Worker"; exit 1; }
          echo "✅ visibility: private passes a Worker behind Access for its team"

      - name: Show the stand-in's requests
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

  dc-inputs:
    name: 'deploy-cloudflare: invalid inputs fail before anything runs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create a site
        run: |
          mkdir -p harness-site harness-html-only
          echo '<h1>private</h1>' > harness-site/index.html
          echo '<h1>page</h1>' > harness-html-only/page.html

      # Every case is valid but for the one input under test. The action sets
      # its visibility output only once every input has passed, so an empty
      # one proves the case was rejected in validation: a rule that went
      # missing would instead get to the check before the deploy, and fail
      # there with visibility set, which the assertion at the end catches.

      # Secrets arrive empty, not absent, on fork and Dependabot runs.
      - name: Empty token
        id: token
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: ''
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'private'

      # The URL is constructed from the name, so it must be a hostname label.
      - name: Worker name that is not a hostname label
        id: worker
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'Harness_Worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'private'

      # #163's own example. Cloudflare requires a leading letter and wrangler
      # does not check before uploading.
      - name: Alias starting with a digit
        id: alias-digit
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'private'
          alias: '2026-08'

      - name: Alias too long for one hostname label
        id: alias-long
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'private'
          alias: 'report-2026-08-with-a-description-long-enough-to-overflow'

      - name: Team domain that is not an Access login domain
        id: team
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon.example.com'
          build-dir: 'harness-site'
          visibility: 'private'

      # A typo must never read as "off", nor as the other audience (#177).
      - name: require-access that is neither true nor false
        id: require
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          require-access: 'yes'

      - name: visibility that is neither private nor public
        id: visibility
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'Public'

      # The deprecated alias may not ride along with what replaces it.
      - name: visibility and require-access both set
        id: both
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'private'
          require-access: 'true'

      # The cross-check: each kind of site refuses the other's team-domain,
      # so a workflow copied from one kind to the other fails.
      - name: Private without team-domain
        id: private-no-team
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'private'

      - name: Public with team-domain
        id: public-team
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-site'
          visibility: 'public'

      # No index.html, and no other file to request: nothing could show that
      # a public site is served.
      - name: Public site with only HTML pages and no index.html
        id: public-unprovable
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          build-dir: 'harness-html-only'
          visibility: 'public'

      - name: Missing build directory
        id: build-dir
        continue-on-error: true
        uses: ./deploy-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          worker-name: 'harness-worker'
          account-subdomain: 'quantecon-harness'
          team-domain: 'quantecon-harness'
          build-dir: 'harness-no-such-dir'
          visibility: 'private'

      - name: Assert every invalid input failed and nothing was installed
        env:
          RESULTS: |
            token ${{ steps.token.outcome }} ${{ steps.token.outputs.deploy-url }}
            worker ${{ steps.worker.outcome }} ${{ steps.worker.outputs.deploy-url }}
            alias-digit ${{ steps.alias-digit.outcome }} ${{ steps.alias-digit.outputs.deploy-url }}
            alias-long ${{ steps.alias-long.outcome }} ${{ steps.alias-long.outputs.deploy-url }}
            team ${{ steps.team.outcome }} ${{ steps.team.outputs.deploy-url }}
            require ${{ steps.require.outcome }} ${{ steps.require.outputs.deploy-url }}
            visibility ${{ steps.visibility.outcome }} ${{ steps.visibility.outputs.deploy-url }}
            both ${{ steps.both.outcome }} ${{ steps.both.outputs.deploy-url }}
            private-no-team ${{ steps.private-no-team.outcome }} ${{ steps.private-no-team.outputs.deploy-url }}
            public-team ${{ steps.public-team.outcome }} ${{ steps.public-team.outputs.deploy-url }}
            public-unprovable ${{ steps.public-unprovable.outcome }} ${{ steps.public-unprovable.outputs.deploy-url }}
            build-dir ${{ steps.build-dir.outcome }} ${{ steps.build-dir.outputs.deploy-url }}
          # The same order: each case's visibility output, which must be empty.
          VISIBILITY: |
            token [${{ steps.token.outputs.visibility }}]
            worker [${{ steps.worker.outputs.visibility }}]
            alias-digit [${{ steps.alias-digit.outputs.visibility }}]
            alias-long [${{ steps.alias-long.outputs.visibility }}]
            team [${{ steps.team.outputs.visibility }}]
            require [${{ steps.require.outputs.visibility }}]
            visibility [${{ steps.visibility.outputs.visibility }}]
            both [${{ steps.both.outputs.visibility }}]
            private-no-team [${{ steps.private-no-team.outputs.visibility }}]
            public-team [${{ steps.public-team.outputs.visibility }}]
            public-unprovable [${{ steps.public-unprovable.outputs.visibility }}]
            build-dir [${{ steps.build-dir.outputs.visibility }}]
        run: |
          set -euo pipefail
          bad=0 n=0
          while read -r case outcome url; do
            [ -n "$case" ] || continue
            n=$((n + 1))
            if [ "$outcome" != "failure" ] || [ -n "${url:-}" ]; then
              echo "::error::[$case]: expected outcome=failure and no deploy-url, got outcome=[$outcome] deploy-url=[${url:-}]"
              bad=1
            else
              echo "✓ $case rejected"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 12 ] || { echo "::error::expected 12 cases, read $n"; exit 1; }
          while read -r case visibility; do
            [ -n "$case" ] || continue
            [ "$visibility" = "[]" ] || { echo "::error::[$case]: visibility is $visibility, so the inputs passed validation and the case failed later, for another reason"; bad=1; }
          done <<< "$VISIBILITY"
          [ ! -e "$RUNNER_TEMP/deploy-cloudflare" ] || { echo "::error::$RUNNER_TEMP/deploy-cloudflare exists — an invalid input got as far as the wrangler install"; bad=1; }
          [ "$bad" -eq 0 ]
          echo "✅ every invalid input fails in validation, before any network call or install"

  dc-wrangler-config:
    name: 'deploy-cloudflare: the pinned wrangler accepts the generated config'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      # The action installs Node itself only below 22; the runner's default
      # may be older, so set it here the way the action would.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # Same lockfile, same config writer, same flags as the action, with
      # --dry-run so no account is needed. This is the check a Dependabot bump
      # of wrangler in deploy-cloudflare/package-lock.json runs against.
      - name: Dry-run a deploy and an alias upload
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/wrangler-check"
          mkdir -p "$dir" "$RUNNER_TEMP/site/data"
          cp deploy-cloudflare/package.json deploy-cloudflare/package-lock.json "$dir/"
          npm ci --prefix "$dir" --no-audit --no-fund
          echo '<h1>ok</h1>' > "$RUNNER_TEMP/site/index.html"
          echo '{}' > "$RUNNER_TEMP/site/data/latest.json"

          node deploy-cloudflare/write-config.js "$dir/harness.wrangler.jsonc" harness-worker "$RUNNER_TEMP/site"
          cat "$dir/harness.wrangler.jsonc"

          wrangler="$dir/node_modules/.bin/wrangler"
          "$wrangler" deploy --config "$dir/harness.wrangler.jsonc" --message "harness" --dry-run 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          grep -q 'files from the assets directory' "$RUNNER_TEMP/deploy.log" \
            || { echo "::error::wrangler deploy --dry-run did not read the assets directory from the generated config"; exit 1; }
          "$wrangler" versions upload --config "$dir/harness.wrangler.jsonc" --preview-alias report-2026-08 --message "harness" --dry-run 2>&1 | tee "$RUNNER_TEMP/upload.log"
          # wrangler only warns on a config key it no longer knows, and a
          # dropped key (preview_urls, say) would silently change behaviour.
          if grep -q 'Unexpected fields' "$RUNNER_TEMP/deploy.log" "$RUNNER_TEMP/upload.log"; then
            echo "::error::the pinned wrangler does not recognise a key in the generated config (see 'Unexpected fields' above)"; exit 1
          fi
          echo "✅ wrangler $("$wrangler" --version | tail -1) accepts the generated config for deploy and versions upload"

  # ==========================================================================
  # publish-gh-pages — the release assets' contract, and the modes (#233)
  # ==========================================================================
  #
  # A real Pages deploy needs the github-pages environment and Pages
  # permissions, and a release needs a tag: none of that belongs in a pull
  # request's run, so the deploy and the release upload are the staged
  # canary's to prove. What these two jobs can check here is what the action
  # packs, and how it reads its inputs.

  publish-release-packaging:
    # Decision 5 on #143: release-asset packaging is tested in this harness.
    # The three files are a contract other tools rely on ("Release assets" in
    # docs/user/actions/publish-gh-pages.md). The action packs only on a run
    # triggered by a tag, which no run of this workflow is, so this job runs
    # the packing script the action runs, scripts/package-release-assets.sh,
    # with a stand-in tag, and checks each thing the manual promises: the file
    # names, an archive of the whole site with paths relative to it, hidden
    # files included, a checksum in sha256sum's format that verifies, and a
    # manifest with exactly the documented fields, of the documented types,
    # that parses whatever asset-name it is given. It also checks that a
    # relative OUT_DIR works, and that an OUT_DIR inside the site, or a
    # control character in a name, is refused before anything is written.
    name: 'publish-gh-pages: release assets keep their documented names, layout, checksum and manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Pack a site, and check the three files against the manual
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          out="$RUNNER_TEMP/assets"
          mkdir -p "$site/sub" "$site/_static/.hidden" "$out"
          echo '<h1>harness</h1>' > "$site/index.html"
          echo '<p>nested</p>' > "$site/sub/page.html"
          echo 'config: harness' > "$site/.buildinfo"
          echo 'in a hidden directory' > "$site/_static/.hidden/file.txt"
          # Measured as the action's prepare step measures them.
          size_mb=$(du -sm "$site" | cut -f1)
          count=$(find "$site" -type f | wc -l)

          GITHUB_OUTPUT="$RUNNER_TEMP/pack.out" BUILD_DIR="$site" ASSET_NAME=harness-html \
            TAG_NAME=publish-harness OUT_DIR="$out" COMMIT_SHA="$GITHUB_SHA" \
            REPOSITORY="$GITHUB_REPOSITORY" SIZE_MB="$size_mb" FILE_COUNT="$count" \
            bash scripts/package-release-assets.sh

          bad=0
          fail() { echo "::error::$*"; bad=1; }
          archive=harness-html-publish-harness.tar.gz
          checksum=harness-html-checksum.txt
          manifest=harness-html-manifest.json

          # The names, and the outputs the upload step reads.
          got=$(cd "$out" && printf '%s\n' * | LC_ALL=C sort | paste -sd' ' -)
          [ "$got" = "$checksum $manifest $archive" ] \
            || fail "the script wrote [$got], not [$checksum $manifest $archive]"
          for pair in "archive-name=$archive" "checksum-name=$checksum" "manifest-name=$manifest"; do
            grep -qxF "${pair%%=*}=$out/${pair#*=}" "$RUNNER_TEMP/pack.out" \
              || fail "no ${pair%%=*} output naming $out/${pair#*=}"
          done

          # The archive: the whole site, hidden files included, as ./ paths.
          tar -tzf "$out/$archive" > "$RUNNER_TEMP/list"
          grep -qx './index.html' "$RUNNER_TEMP/list" \
            || fail "the archive has no ./index.html, so its paths are not relative to build-dir"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$out/$archive" -C "$RUNNER_TEMP/unpacked"
          diff -r "$site" "$RUNNER_TEMP/unpacked" \
            || fail "the archive does not hold exactly the site (diff above)"

          # The checksum: one line, sha256sum's format, naming the archive alone.
          line=$(cat "$out/$checksum")
          if ! [[ "$line" =~ ^[0-9a-f]{64}\ \ (.*)$ ]] || [ "${BASH_REMATCH[1]}" != "$archive" ]; then
            fail "the checksum file reads [$line], not '<sha256>  $archive'"
          fi
          ( cd "$out" && sha256sum --check --strict "$checksum" ) \
            || fail "sha256sum --check fails on the checksum file"

          # The manifest: exactly the documented fields, with their types and values.
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
              --argjson size "$size_mb" --argjson count "$count" '
                keys == ["commit", "file_count", "name", "repository", "size_mb", "tag", "timestamp"]
                and .name == "harness-html" and .tag == "publish-harness"
                and .commit == $sha and .repository == $repo
                and (.size_mb | type) == "number" and .size_mb == $size
                and (.file_count | type) == "number" and .file_count == $count
                and (.timestamp | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+-][0-9]{2}:[0-9]{2}$"))
              ' "$out/$manifest" > /dev/null \
            || { fail "the manifest does not match the manual's fields, types and values"; cat "$out/$manifest"; }

          # An asset-name that JSON must escape: the manifest still parses,
          # with the name intact. The action refuses such a name before this
          # script runs (publish-modes checks that), since for a name with a
          # backslash sha256sum writes an escaped checksum line that the
          # runner's own sha256sum --check rejects. So this is the script's
          # second line of defence, and its checksum is not checked here.
          odd='harness "quoted" \ name'
          mkdir "$RUNNER_TEMP/odd"
          GITHUB_OUTPUT="$RUNNER_TEMP/odd.out" BUILD_DIR="$site" ASSET_NAME="$odd" TAG_NAME=publish-harness \
            OUT_DIR="$RUNNER_TEMP/odd" COMMIT_SHA="$GITHUB_SHA" REPOSITORY="$GITHUB_REPOSITORY" \
            SIZE_MB="$size_mb" FILE_COUNT="$count" bash scripts/package-release-assets.sh > /dev/null \
            || fail "packing with asset-name [$odd] failed"
          jq -e --arg name "$odd" '.name == $name' "$RUNNER_TEMP/odd/$odd-manifest.json" > /dev/null \
            || fail "asset-name [$odd] gave a manifest that does not parse, or lost the name"

          # An OUT_DIR given as a relative path: the checksum, written from
          # inside it, lands beside the archive and verifies.
          mkdir "$RUNNER_TEMP/rel"
          ( cd "$RUNNER_TEMP" && GITHUB_OUTPUT="$RUNNER_TEMP/rel.out" BUILD_DIR="$site" ASSET_NAME=harness-rel \
              TAG_NAME=publish-harness OUT_DIR=rel COMMIT_SHA="$GITHUB_SHA" REPOSITORY="$GITHUB_REPOSITORY" \
              SIZE_MB="$size_mb" FILE_COUNT="$count" bash "$GITHUB_WORKSPACE/scripts/package-release-assets.sh" ) > /dev/null \
            || fail "packing with a relative OUT_DIR failed"
          ( cd "$RUNNER_TEMP/rel" && sha256sum --check --strict harness-rel-checksum.txt ) > /dev/null \
            || fail "with a relative OUT_DIR, the checksum is not beside the archive, or does not verify"

          # Refused, and nothing written: an OUT_DIR inside BUILD_DIR, where
          # the archive would take in itself, and a control character that a
          # manifest cannot hold.
          for case in inside control; do
            dir="$RUNNER_TEMP/out-$case" name=harness-html
            if [ "$case" = inside ]; then dir="$site/_static"; else mkdir "$dir"; name=$'harness\x01html'; fi
            before=$(find "$dir" | wc -l)
            if GITHUB_OUTPUT="$RUNNER_TEMP/$case.out" BUILD_DIR="$site" ASSET_NAME="$name" TAG_NAME=publish-harness \
                OUT_DIR="$dir" COMMIT_SHA="$GITHUB_SHA" REPOSITORY="$GITHUB_REPOSITORY" SIZE_MB="$size_mb" \
                FILE_COUNT="$count" bash scripts/package-release-assets.sh > "$RUNNER_TEMP/$case.log" 2>&1; then
              fail "$case: the script packed when it should have refused"
            fi
            [ "$(find "$dir" | wc -l)" -eq "$before" ] || fail "$case: the script refused, but wrote into $dir first"
          done

          [ "$bad" -eq 0 ] || exit 1
          echo "✅ the release assets have the documented names, layout, checksum and manifest"

  publish-modes:
    # #233: mode splits the publish across jobs. Here, with contents: read
    # alone, mode: upload must upload the site and nothing more. Every
    # combination the action refuses must fail at its first step, so its
    # mode output must be empty. Those cases run before the good upload: one
    # that got as far as uploading would take the github-pages name, and the
    # good upload would then fail on it. mode: release off a tag must skip,
    # with a warning, and need no token.
    name: 'publish-gh-pages: mode upload uploads with read access alone, and a mode it cannot carry out fails first'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create a site
        run: |
          mkdir -p harness-site
          echo '<h1>harness</h1>' > harness-site/index.html

      - name: 'refused: an unknown mode'
        id: bad-mode
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'Upload'
          build-dir: 'harness-site'

      - name: 'refused: mode deploy with build-dir'
        id: deploy-dir
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'deploy'
          build-dir: 'harness-site'

      - name: 'refused: mode deploy with cname'
        id: deploy-cname
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'deploy'
          cname: 'lectures.example.org'

      - name: 'refused: mode deploy with create-release-assets'
        id: deploy-release
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'deploy'
          create-release-assets: 'true'

      - name: 'refused: mode upload without build-dir'
        id: upload-nodir
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'upload'

      - name: 'refused: mode upload with create-release-assets'
        id: upload-release
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'upload'
          build-dir: 'harness-site'
          create-release-assets: 'true'

      - name: 'refused: mode release without build-dir'
        id: release-nodir
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'release'

      # Refused in mode upload too, before the upload, so a bad name shows
      # before the first tag.
      - name: 'refused: an asset-name with a backslash'
        id: bad-asset-name
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'upload'
          build-dir: 'harness-site'
          asset-name: 'harness\html'

      - name: 'mode upload'
        id: upload
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'upload'
          build-dir: 'harness-site'

      - name: 'mode release, with no token'
        id: release
        continue-on-error: true
        uses: ./publish-gh-pages
        with:
          mode: 'release'
          build-dir: 'harness-site'

      - name: Download what mode upload uploaded
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Assert each step did what its mode says, and refused ones did nothing
        env:
          REF_TYPE: ${{ github.ref_type }}
          DOWNLOAD: ${{ steps.download.outcome }}
          RESULTS: |
            refused|bad-mode|${{ steps.bad-mode.outcome }}|${{ steps.bad-mode.outputs.mode }}|${{ steps.bad-mode.outputs.page-url }}
            refused|deploy-dir|${{ steps.deploy-dir.outcome }}|${{ steps.deploy-dir.outputs.mode }}|${{ steps.deploy-dir.outputs.page-url }}
            refused|deploy-cname|${{ steps.deploy-cname.outcome }}|${{ steps.deploy-cname.outputs.mode }}|${{ steps.deploy-cname.outputs.page-url }}
            refused|deploy-release|${{ steps.deploy-release.outcome }}|${{ steps.deploy-release.outputs.mode }}|${{ steps.deploy-release.outputs.page-url }}
            refused|upload-nodir|${{ steps.upload-nodir.outcome }}|${{ steps.upload-nodir.outputs.mode }}|${{ steps.upload-nodir.outputs.page-url }}
            refused|upload-release|${{ steps.upload-release.outcome }}|${{ steps.upload-release.outputs.mode }}|${{ steps.upload-release.outputs.page-url }}
            refused|release-nodir|${{ steps.release-nodir.outcome }}|${{ steps.release-nodir.outputs.mode }}|${{ steps.release-nodir.outputs.page-url }}
            refused|bad-asset-name|${{ steps.bad-asset-name.outcome }}|${{ steps.bad-asset-name.outputs.mode }}|${{ steps.bad-asset-name.outputs.page-url }}
            upload|upload|${{ steps.upload.outcome }}|${{ steps.upload.outputs.mode }}|${{ steps.upload.outputs.page-url }}
            release|release|${{ steps.release.outcome }}|${{ steps.release.outputs.mode }}|${{ steps.release.outputs.page-url }}
        run: |
          set -euo pipefail
          bad=0 n=0
          while IFS='|' read -r want id outcome mode url; do
            [ -n "$want" ] || continue
            n=$((n + 1))
            case "$want" in
              refused) expect="failure|" ;;
              upload) expect="success|upload" ;;
              # Off a tag it skips with a warning. On a tag, a dispatch of this
              # workflow, it gets as far as the token check, and fails there.
              release) if [ "$REF_TYPE" = tag ]; then expect="failure|release"; else expect="success|release"; fi ;;
            esac
            if [ "$outcome|$mode" != "$expect" ] || [ -n "$url" ]; then
              echo "::error::$id: expected outcome and mode [$expect] and no page-url, got [$outcome|$mode] and page-url [$url]"
              bad=1
            else
              echo "✓ $id: outcome=$outcome mode=${mode:-(refused before anything ran)}"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 10 ] || { echo "::error::expected 10 cases, read $n"; exit 1; }

          [ "$DOWNLOAD" = success ] \
            || { echo "::error::no github-pages artifact to download, so mode upload uploaded nothing"; exit 1; }
          tar -tf "$RUNNER_TEMP/pages/artifact.tar" | grep -qx './index.html' \
            || { echo "::error::the github-pages artifact holds no ./index.html"; tar -tf "$RUNNER_TEMP/pages/artifact.tar" || true; exit 1; }

          [ "$bad" -eq 0 ]
          echo "✅ mode upload uploaded the site with contents: read alone, mode release skipped off a tag, and every refused combination failed before anything ran"

  # ==========================================================================
  # preview-* — the pinned CLIs and the deploy decision (a real deploy needs
  # provider secrets, so none succeeds here)
  # ==========================================================================

  preview-cli-install:
    # #105: preview-cloudflare and preview-netlify install their CLI with
    # `npm ci` from a lockfile beside action.yml, and Dependabot bumps those
    # lockfiles. The actions cannot deploy here — that needs the provider's
    # token — and they skip Dependabot's PRs outright, so preview-wiring below
    # installs nothing on exactly the PRs that bump a CLI. Without this job a
    # CLI bump would merge with no CI signal at all.
    #
    # Scope, stated honestly: this proves each lockfile installs on a clean
    # runner and that the CLI it installs starts and reports the pinned
    # version. It does not run the actions' install step itself (preview-wiring
    # does, on this repository's own pull requests), and it cannot tell whether
    # the new CLI still deploys; that is for the next real PR.
    name: 'preview-*: pinned CLIs install from their lockfiles and run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      # The Node the manual tells hosted-runner callers to set up, and the major
      # the QuantEcon containers ship.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: npm ci from each lockfile, then run the CLI
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          # action dir, npm package, bin name
          for spec in preview-cloudflare:wrangler:wrangler preview-netlify:netlify-cli:netlify; do
            IFS=: read -r dir pkg bin <<< "$spec"
            want=$(node -p "require('./$dir/package.json').dependencies['$pkg']")
            echo "::group::$dir: npm ci ($pkg $want)"
            D="$(mktemp -d)"
            cp "$dir/package.json" "$dir/package-lock.json" "$D/"
            npm ci --prefix "$D" --no-audit --no-fund
            echo "::endgroup::"
            got=$("$D/node_modules/.bin/$bin" --version) \
              || { echo "::error::$dir: $bin installed from the lockfile but does not run"; exit 1; }
            echo "$bin --version: $got"
            grep -qF "$want" <<< "$got" \
              || { echo "::error::$dir: $bin reports [$got], expected the pinned $want"; exit 1; }
          done
          echo "✅ both pinned CLIs install from their lockfiles and run"

  preview-change-detection:
    # scripts/detect-changed-lectures.sh, which both preview actions run to
    # list a pull request's lectures. It needs only git, so unlike the rest of
    # those actions it can run here, against a scratch repository served over
    # file:// and checked out the way actions/checkout checks out a pull
    # request. Each case is one of the script's promises:
    #   - only what the pull request changed: three dots, from the merge
    #     base, so a lecture changed only on main is not listed (#215);
    #   - a renamed lecture listed under its new path (--no-renames);
    #   - a bounded fetch: no fetch at all when the merge base is already
    #     here, and in a shallow checkout a history deepened only as far as
    #     the merge base, to 1,024 commits behind each end and no further
    #     (#147), whether or not the two commits had to be fetched first;
    #   - history already in the checkout is never cut;
    #   - every git failure a ::warning:: with git's own message, and never a
    #     failed step (finding L4 of the 2026-10-06 review).
    name: 'preview-*: change detection lists only what the pull request changed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the script against a scratch pull request
        run: |
          set -euo pipefail
          script="$PWD/scripts/detect-changed-lectures.sh"
          work="$RUNNER_TEMP/detect"
          rm -rf "$work"; mkdir -p "$work"; cd "$work"
          # So that norepo/ below cannot find a repository above it.
          export GIT_CEILING_DIRECTORIES="$work"
          export GIT_AUTHOR_NAME=harness GIT_AUTHOR_EMAIL=harness@example.com
          export GIT_COMMITTER_NAME=harness GIT_COMMITTER_EMAIL=harness@example.com

          # The server. main: 1,500 commits, then the pull request branches
          # off and edits lectures/a.md and renames lectures/b.md to b2.md.
          # main then gets 100 commits and edits lectures/d.md. `long`
          # continues main for 1,000 more commits, past the script's 1,024
          # cap. The filler commits change nothing, so only the lecture edits
          # show in a diff. Fetching by SHA is allowed, as GitHub allows it.
          git init -q -b main srv
          cd srv
          git config uploadpack.allowReachableSHA1InWant true
          mkdir lectures
          for f in a b c d; do echo "# $f" > "lectures/$f.md"; done
          echo "root: intro" > lectures/_toc.yml
          git add -A && git commit -qm init
          filler() {  # filler N: N commits that change nothing, on HEAD
            local c tree i
            c=$(git rev-parse HEAD); tree=$(git rev-parse 'HEAD^{tree}')
            for i in $(seq "$1"); do c=$(git commit-tree "$tree" -p "$c" -m "filler $i"); done
            git reset -q --hard "$c"
          }
          filler 1500
          git checkout -qb pr
          echo "pr edit" >> lectures/a.md && git commit -qam "pr: edit a"
          git mv lectures/b.md lectures/b2.md && git commit -qm "pr: rename b"
          git checkout -q main
          filler 100
          echo "main edit" >> lectures/d.md && git commit -qam "main: edit d"
          git checkout -qb long
          filler 1000
          # GitHub's test merge commits, refs/pull/N/merge: base tip + head.
          # long~100 puts the merge base 1,001 commits behind the base, just
          # inside the cap.
          n=0
          for base in main long long~100; do
            n=$((n + 1))
            git checkout -q --detach "$base"
            git merge -q --no-ff -m "merge pr into $base" pr
            git update-ref "refs/pull/$n/merge" HEAD
          done
          git checkout -q main
          TOTAL=$(git rev-list --count --all)
          HEAD_SHA=$(git rev-parse pr)
          cd "$work"
          echo "server: $TOTAL commits"

          # checkout DIR N DEPTH: what actions/checkout does for a pull
          # request: the test merge commit refs/pull/N/merge, DEPTH commits
          # deep, or with every branch when DEPTH is 0 (fetch-depth: 0).
          checkout() {
            local merge
            merge=$(git -C srv rev-parse "refs/pull/$2/merge")
            git init -q "$1"
            git -C "$1" remote add origin "file://$work/srv"
            if [ "$3" = 0 ]; then
              git -C "$1" fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*' "+$merge:refs/remotes/pull/$2/merge"
            else
              git -C "$1" fetch -q --no-tags --depth="$3" origin "+$merge:refs/remotes/pull/$2/merge"
            fi
            git -C "$1" checkout -q --detach "$merge"
          }

          # detect DIR BASE: run the script in DIR, as the actions do. Its
          # stdout goes to DIR.log, its changed-files output to DIR.files.
          # The log is echoed between stop-commands, so the warnings these
          # cases expect are not raised as annotations on this job.
          detect() {
            local status=0 token="detect-$RANDOM$RANDOM$RANDOM"
            ( cd "$1" && GITHUB_OUTPUT="$work/$1.out" BASE_SHA="$2" HEAD_SHA="$HEAD_SHA" LECTURES_DIR=lectures bash "$script" ) \
              > "$1.log" 2>&1 || status=$?
            echo "::stop-commands::$token"
            sed 's/^/    /' "$1.log"
            echo "::$token::"
            [ "$status" -eq 0 ] || fail "$1: the script exited $status"
            awk '/^changed-files<<EOF$/ { on = 1; next } /^EOF$/ { on = 0 } on' "$1.out" | sort > "$1.files"
            grep -qx 'strip-lectures-dir=true' "$1.out" || fail "$1: no strip-lectures-dir=true output"
          }

          bad=0
          fail() { echo "::error::$*"; bad=1; }
          expect_files() {  # expect_files DIR FILE...
            local want
            want=$(printf '%s\n' "${@:2}" | sort)
            [ "$(cat "$1.files")" = "$want" ] \
              || fail "$1: changed-files is [$(paste -sd' ' "$1.files")], expected [$(paste -sd' ' - <<< "$want")]"
          }
          expect_no_warning() { ! grep -q '::warning::' "$1.log" || fail "$1: unexpected warning"; }

          MAIN=$(git -C srv rev-parse main)
          LONG=$(git -C srv rev-parse long)
          FAR=$(git -C srv rev-parse long~100)

          echo "::group::full: fetch-depth 0, the consumers' checkout today"
          checkout full 1 0
          detect full "$MAIN"
          expect_files full lectures/a.md lectures/b2.md
          expect_no_warning full
          # The merge base was already here, so nothing was fetched.
          ! git -C full rev-parse -q --verify refs/remotes/origin/pr-base >/dev/null \
            || fail "full: fetched although the checkout had the merge base"
          echo "::endgroup::"

          echo "::group::shallow: depth 1, as #148 plans and templates/ci.yml has"
          checkout shallow 1 1
          detect shallow "$MAIN"
          expect_files shallow lectures/a.md lectures/b2.md
          expect_no_warning shallow
          got=$(git -C shallow rev-list --count --all)
          echo "fetched $got of the server's $TOTAL commits"
          [ "$got" -lt 500 ] || fail "shallow: fetched $got of $TOTAL commits; the fetch is not bounded"
          echo "::endgroup::"

          echo "::group::deeper: depth 50, so both commits are here but not the merge base"
          checkout deeper 1 50
          before=$(git -C deeper rev-list --count HEAD)
          detect deeper "$MAIN"
          expect_files deeper lectures/a.md lectures/b2.md
          expect_no_warning deeper
          after=$(git -C deeper rev-list --count HEAD)
          # --depth on a commit already here would cut the history behind it.
          [ "$after" -ge "$before" ] || fail "deeper: the checkout's history went from $before to $after commits"
          echo "::endgroup::"

          echo "::group::stale: depth 1, merge base past the 1,024-commit cap"
          checkout stale 2 1
          detect stale "$LONG"
          grep -q '::warning::Found no merge base within 1024 commits' stale.log \
            || fail "stale: no warning naming the cap"
          # The fallback compares from the base tip, so d.md is listed too.
          expect_files stale lectures/a.md lectures/b2.md lectures/d.md
          # 1,024 commits behind each end, plus the merge commit, and slack.
          got=$(git -C stale rev-list --count --all)
          echo "fetched $got of the server's $TOTAL commits"
          [ "$got" -le 2100 ] || fail "stale: fetched $got of $TOTAL commits; the fetch is not bounded"
          echo "::endgroup::"

          echo "::group::far: depth 2, both commits here, the merge base 1,001 commits behind"
          # With no commit to fetch first, the search must still reach the
          # full 1,024 commits behind each end before it gives up.
          checkout far 3 2
          detect far "$FAR"
          expect_files far lectures/a.md lectures/b2.md
          expect_no_warning far
          echo "::endgroup::"

          echo "::group::nofetch: depth 1, and origin cannot be fetched from"
          checkout nofetch 1 1
          git -C nofetch remote set-url origin "file://$work/missing"
          detect nofetch "$MAIN"
          grep -q "::warning::Could not fetch the pull request's base and head commits: .*missing" nofetch.log \
            || fail "nofetch: no warning carrying git's message"
          expect_files nofetch
          echo "::endgroup::"

          echo "::group::norepo: no git repository at all"
          mkdir -p norepo/lectures && echo "root: intro" > norepo/lectures/_toc.yml
          detect norepo "$MAIN"
          grep -q '::warning::git cannot read the checkout, so no changed lectures are listed: .*not a git repository' norepo.log \
            || fail "norepo: no warning carrying git's message"
          expect_files norepo
          echo "::endgroup::"

          [ "$bad" -eq 0 ] || exit 1
          echo "✅ change detection lists what the pull request changed, fetches a bounded history, and warns when git fails"

  preview-decide:
    # #227, #193: scripts/preview-decide.sh is the one decision both preview
    # actions follow, for their change detection, CLI install, deploy and
    # comment. It reads only its environment, so every event can be tried
    # here, including the ones this workflow never runs on (schedule,
    # pull_request_target), with no provider secrets. The decision's own
    # annotations are shown only when a case fails, so a green run carries no
    # wall of expected ::error:: lines.
    name: 'preview-*: the deploy decision admits only its listed events, and a valid dispatch-alias'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Decide for each event, actor and dispatch-alias
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/decide.out"
          bad=0 n=0
          trim() { local s=$1; s=${s#"${s%%[![:space:]]*}"}; printf '%s' "${s%"${s##*[![:space:]]}"}"; }

          # want: `deploy` (the expect column is the alias), `notice` or
          # `warning` (deploys nothing; expect is in the message), or `error`
          # (exits 1, writes no decision). Every case is QuantEcon/actions.
          # Columns are trimmed, so an empty one means an empty value.
          while IFS='|' read -r want event actor head pr dalias expect; do
            want=$(trim "$want")
            [ -n "$want" ] && [ "${want:0:1}" != "#" ] || continue
            event=$(trim "$event"); actor=$(trim "$actor"); head=$(trim "$head")
            pr=$(trim "$pr"); dalias=$(trim "$dalias"); expect=$(trim "$expect")
            n=$((n + 1))
            : > "$out"
            rc=0
            log=$(PROVIDER=Harness EVENT_NAME="$event" ACTOR="$actor" REPOSITORY=QuantEcon/actions \
                  HEAD_REPO="$head" PR_NUMBER="$pr" DISPATCH_ALIAS="$dalias" GITHUB_OUTPUT="$out" \
                  bash scripts/preview-decide.sh 2>&1) || rc=$?
            got=$(paste -sd' ' "$out")
            case "$want" in
              deploy)  ok() { [ "$rc" = 0 ] && [ "$got" = "deploy=true alias=$expect" ]; } ;;
              notice|warning)
                       ok() { [ "$rc" = 0 ] && [ "$got" = "deploy=false alias=" ] \
                                && grep -qF "::$want::No Harness preview deployed: " <<< "$log" \
                                && grep -qF -- "$expect" <<< "$log"; } ;;
              error)   ok() { [ "$rc" = 1 ] && [ -z "$got" ] && grep -q '^::error::' <<< "$log" \
                                && grep -qF -- "$expect" <<< "$log"; } ;;
              *)       echo "::error::harness typo: want [$want]"; exit 1 ;;
            esac
            label="$event / $actor / head [$head] / pr [$pr] / alias [$dalias]"
            if ok; then
              echo "✓ $want: $label"
            else
              echo "::error::expected $want [$expect] for $label; got exit $rc, outputs [$got], log:"
              # shellcheck disable=SC2001 # anchored to each line of the log, which ${var//} cannot do
              sed 's/^::\([a-z]*\)::/  (\1) /' <<< "$log"
              bad=1
            fi
          done <<'CASES'
          # want  | event               | actor           | head repo         | pr | dispatch-alias               | expect
          deploy  | pull_request        | mmcky           | QuantEcon/actions | 5  |                              | pr-5
          deploy  | pull_request        | mmcky           | QuantEcon/actions | 5  | dispatch-canary              | pr-5
          notice  | pull_request        | mmcky           | someone/actions   | 5  |                              | from forks
          notice  | pull_request        | mmcky           |                   | 5  |                              | from forks
          notice  | pull_request        | dependabot[bot] | QuantEcon/actions | 5  |                              | Dependabot
          error   | pull_request        | mmcky           | QuantEcon/actions |    |                              | pull request number
          deploy  | workflow_dispatch   | mmcky           |                   |    | dispatch-canary              | dispatch-canary
          deploy  | schedule            | mmcky           |                   |    | dispatch-canary-weekly-2     | dispatch-canary-weekly-2
          deploy  | workflow_dispatch   | mmcky           |                   |    | dispatch-abcdefghijklmnopqrs | dispatch-abcdefghijklmnopqrs
          notice  | workflow_dispatch   | mmcky           |                   |    |                              | only when dispatch-alias is set
          notice  | schedule            | mmcky           |                   |    |                              | only when dispatch-alias is set
          notice  | workflow_dispatch   | dependabot[bot] |                   |    | dispatch-canary              | Dependabot
          # The allow-list: no input makes any other event deploy.
          warning | pull_request_target | mmcky           | QuantEcon/actions | 5  |                              | pull_request_target
          warning | pull_request_target | mmcky           | QuantEcon/actions | 5  | dispatch-canary              | pull_request_target
          notice  | push                | mmcky           |                   |    | dispatch-canary              | not on push
          notice  | push                | mmcky           |                   |    |                              | not on push
          notice  | merge_group         | mmcky           |                   |    | dispatch-canary              | not on merge_group
          notice  | release             | mmcky           |                   |    | dispatch-canary              | not on release
          notice  | PULL_REQUEST        | mmcky           | QuantEcon/actions | 5  |                              | not on PULL_REQUEST
          notice  |                     | mmcky           |                   |    | dispatch-canary              | an unnamed event
          # An invalid alias fails on every event, a pull request's included.
          error   | workflow_dispatch   | mmcky           |                   |    | pr-5                         | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | main                         | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch                     | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch-                    | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch-canary-             | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch--canary             | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | Dispatch-Canary              | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch_canary              | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch-canary.v2           | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch-canary v2           | must be dispatch-
          error   | workflow_dispatch   | mmcky           |                   |    | dispatch-abcdefghijklmnopqrst | at most 28
          error   | pull_request        | mmcky           | QuantEcon/actions | 5  | pr-6                         | must be dispatch-
          error   | pull_request        | mmcky           | someone/actions   | 5  | dispatch-Canary              | must be dispatch-
          error   | push                | mmcky           |                   |    | dispatch-                    | must be dispatch-
          CASES

          # A line break must not reach GITHUB_OUTPUT as a second key, nor the
          # log as a second workflow command: the error is one escaped line.
          n=$((n + 1)); : > "$out"; rc=0
          log=$(PROVIDER=Harness EVENT_NAME=workflow_dispatch ACTOR=mmcky \
                DISPATCH_ALIAS=$'dispatch-100%\r\ndeploy=true\n::warning::injected' \
                GITHUB_OUTPUT="$out" bash scripts/preview-decide.sh 2>&1) || rc=$?
          if [ "$rc" = 1 ] && [ ! -s "$out" ] && [ "$(grep -c '' <<< "$log")" = 1 ] \
             && grep -qF '::error::dispatch-alias [dispatch-100%25%0D%0Adeploy=true%0A::warning::injected]' <<< "$log"; then
            echo "✓ error: an alias with a line break, escaped"
          else
            echo "::error::an alias with a line break: expected exit 1, no outputs and one escaped ::error:: line; got exit $rc, outputs [$(paste -sd' ' "$out")], log:"
            # shellcheck disable=SC2001 # anchored to each line of the log, which ${var//} cannot do
            sed 's/^::\([a-z]*\)::/  (\1) /' <<< "$log"
            bad=1
          fi

          [ "$n" -eq 35 ] || { echo "::error::expected 35 cases, ran $n"; exit 1; }
          [ "$bad" -eq 0 ]
          echo "✅ preview-decide.sh deploys only on pull_request, or on workflow_dispatch or schedule with a valid dispatch-alias ($n cases)"

  preview-comment:
    # #153, and finding M2 of the 2026-10-06 review: both preview actions post
    # their comment with scripts/preview-comment.cjs, after a deploy and, with
    # placeholder: 'true', before one. The comment step runs only after a real
    # deploy or in a job with pull-requests: write, so preview-wiring below
    # never reaches it. This job reads each action's own steps from its
    # action.yml and runs them against a stand-in for the GitHub API, with no
    # token:
    #   - the input check, for every mode and missing input;
    #   - the bash step that finds the script, from the action's directory;
    #   - the github-script body, called as actions/github-script calls it,
    #     with the step's env.
    # It asserts that each deploy's comment renders as v0.14.0's inline
    # scripts rendered it, after one hidden marker line (those fixtures are
    # their bodies); that the placeholder's comment lists the lectures by
    # change detection's rules, and that the deploy's comment then replaces
    # it, never the other way round for one commit; and that the action
    # updates its own comment however many come before it, and never anyone
    # else's. test.cjs lists the cases.
    name: 'preview-*: each action renders its comment as before, and updates only its own'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Node that actions/github-script@v9 runs on.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # PyYAML, at the pin in scripts/requirements.txt, as the gate installs it.
      - name: Read each action's comment steps
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check --quiet -r scripts/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" - preview-netlify preview-cloudflare > "$RUNNER_TEMP/comment-steps.json" <<'PY'
          import json, os, sys, yaml
          steps = {}
          for d in sys.argv[1:]:
              with open(os.path.join(d, 'action.yml')) as f:
                  by_id = {s['id']: s for s in yaml.safe_load(f)['runs']['steps'] if 'id' in s}
              check, resolve, comment = by_id['check-inputs'], by_id['comment-script'], by_id['comment']
              steps[d] = {
                  'dir': os.path.abspath(d),
                  'check': {'shell': check['shell'], 'env': check['env'], 'run': check['run']},
                  'resolve': {'shell': resolve['shell'], 'run': resolve['run']},
                  'comment': {'uses': comment['uses'], 'env': comment['env'], 'with': comment['with']},
                  # Each step's condition, by id, '' for none.
                  'if': {k: str(s.get('if', '')) for k, s in by_id.items()},
              }
          json.dump(steps, sys.stdout)
          PY

      - name: Run them against a stand-in GitHub API
        run: node .github/fixtures/preview-comment/test.cjs "$RUNNER_TEMP/comment-steps.json"

  preview-wiring:
    # What preview-decide above cannot see: that each action follows the
    # decision. An invalid dispatch-alias or placeholder input must stop it
    # before its CLI is installed, on any event, and so must a missing token
    # or build-dir wherever a deploy would run (#153); the CLI must be
    # installed exactly when a deploy will run (#193); and `deployed` must
    # always be set. The credentials are fake, so a run the decision lets
    # through installs the CLI and then fails at the provider, while a run it
    # stops passes having installed nothing. Which of the two to expect
    # depends on this workflow's own event, so the assertions work it out
    # from the same context the actions read. The last pair of steps is an
    # existing caller's, with every input it passes today. The placeholder's
    # comment needs pull-requests: write, which no harness job has: the
    # preview-comment job runs its steps against a stand-in instead.
    name: 'preview-*: each action installs its CLI only for a deploy, and refuses a bad input first'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    if: needs.gate.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Create a site
        run: |
          mkdir -p harness-site
          echo '<h1>preview</h1>' > harness-site/index.html

      - name: 'preview-netlify: dispatch-alias without the dispatch- prefix'
        id: netlify-bad
        continue-on-error: true
        uses: ./preview-netlify
        with:
          netlify-auth-token: 'harness-fake-token'
          netlify-site-id: '00000000-0000-0000-0000-000000000000'
          build-dir: 'harness-site'
          lectures-dir: ''
          dispatch-alias: 'pr-5'

      - name: 'preview-cloudflare: dispatch-alias with a capital letter'
        id: cloudflare-bad
        continue-on-error: true
        uses: ./preview-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          project-name: 'harness-no-such-project'
          build-dir: 'harness-site'
          lectures-dir: ''
          dispatch-alias: 'dispatch-Harness'

      # #153: the placeholder's inputs are checked on every event too. Neither
      # step has a secret, as a placeholder's job has none.
      - name: 'preview-netlify: placeholder without netlify-site-name'
        id: netlify-bad-placeholder
        continue-on-error: true
        uses: ./preview-netlify
        with:
          placeholder: 'true'
          lectures-dir: ''

      - name: "preview-cloudflare: placeholder neither 'true' nor 'false'"
        id: cloudflare-bad-placeholder
        continue-on-error: true
        uses: ./preview-cloudflare
        with:
          placeholder: 'yes'
          project-name: 'harness-no-such-project'
          lectures-dir: ''

      - name: Assert an invalid input failed before any install
        env:
          RESULTS: |
            preview-netlify|${{ steps.netlify-bad.outcome }}|${{ steps.netlify-bad.outputs.deployed }}|${{ steps.netlify-bad.outputs.deploy-url }}
            preview-cloudflare|${{ steps.cloudflare-bad.outcome }}|${{ steps.cloudflare-bad.outputs.deployed }}|${{ steps.cloudflare-bad.outputs.deploy-url }}
            preview-netlify|${{ steps.netlify-bad-placeholder.outcome }}|${{ steps.netlify-bad-placeholder.outputs.deployed }}|${{ steps.netlify-bad-placeholder.outputs.deploy-url }}
            preview-cloudflare|${{ steps.cloudflare-bad-placeholder.outcome }}|${{ steps.cloudflare-bad-placeholder.outputs.deployed }}|${{ steps.cloudflare-bad-placeholder.outputs.deploy-url }}
        run: |
          set -euo pipefail
          bad=0 n=0
          while IFS='|' read -r action outcome deployed url; do
            [ -n "$action" ] || continue
            n=$((n + 1))
            if [ "$outcome" != "failure" ] || [ "$deployed" != "false" ] || [ -n "$url" ]; then
              echo "::error::$action, case $n: expected outcome=failure, deployed=false and no deploy-url, got outcome=[$outcome] deployed=[$deployed] deploy-url=[$url]"
              bad=1
            elif compgen -G "$RUNNER_TEMP/$action.*" > /dev/null; then
              echo "::error::$action, case $n: $(compgen -G "$RUNNER_TEMP/$action.*") exists, so an invalid input got as far as the CLI install"
              bad=1
            else
              echo "✓ $action, case $n: refused the input before installing its CLI"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 4 ] || { echo "::error::expected 4 cases, read $n"; exit 1; }
          [ "$bad" -eq 0 ]
          echo "✅ an invalid dispatch-alias or placeholder input fails each action before anything is installed"

      # #153: a deploy without its secrets or build-dir fails at the input
      # check, before the CLI install, wherever a deploy would run. An empty
      # value is what a missing secret gives. dispatch-alias lets a dispatch of
      # the harness deploy, as a pull request does.
      - name: 'preview-netlify: a deploy without its token'
        id: netlify-no-token
        continue-on-error: true
        uses: ./preview-netlify
        with:
          netlify-auth-token: ''
          netlify-site-id: '00000000-0000-0000-0000-000000000000'
          build-dir: 'harness-site'
          lectures-dir: ''
          dispatch-alias: 'dispatch-harness'

      - name: 'preview-cloudflare: a deploy without build-dir'
        id: cloudflare-no-build-dir
        continue-on-error: true
        uses: ./preview-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          project-name: 'harness-no-such-project'
          lectures-dir: ''
          dispatch-alias: 'dispatch-harness'

      - name: Assert a deploy without its inputs failed before any install
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RESULTS: |
            preview-netlify|${{ steps.netlify-no-token.outcome }}|${{ steps.netlify-no-token.outputs.deployed }}|${{ steps.netlify-no-token.outputs.deploy-url }}
            preview-cloudflare|${{ steps.cloudflare-no-build-dir.outcome }}|${{ steps.cloudflare-no-build-dir.outputs.deployed }}|${{ steps.cloudflare-no-build-dir.outputs.deploy-url }}
        run: |
          set -euo pipefail
          # As in the last assertion below: where a deploy would run, the
          # check must fail it; elsewhere it is skipped, and the check with it.
          want=success
          if [ "$ACTOR" != "dependabot[bot]" ]; then
            case "$EVENT_NAME" in
              pull_request) [ "$HEAD_REPO" != "$REPOSITORY" ] || want=failure ;;
              workflow_dispatch) want=failure ;;
            esac
          fi
          echo "event [$EVENT_NAME], actor [$ACTOR], head [$HEAD_REPO]: expecting outcome=$want"
          bad=0 n=0
          while IFS='|' read -r action outcome deployed url; do
            [ -n "$action" ] || continue
            n=$((n + 1))
            if [ "$outcome" != "$want" ] || [ "$deployed" != "false" ] || [ -n "$url" ]; then
              echo "::error::$action: expected outcome=$want, deployed=false and no deploy-url, got outcome=[$outcome] deployed=[$deployed] deploy-url=[$url]"
              bad=1
            elif compgen -G "$RUNNER_TEMP/$action.*" > /dev/null; then
              echo "::error::$action: $(compgen -G "$RUNNER_TEMP/$action.*") exists, so a deploy without its inputs got as far as the CLI install"
              bad=1
            else
              echo "✓ $action: outcome=$outcome, nothing installed"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 2 ] || { echo "::error::expected 2 cases, read $n"; exit 1; }
          [ "$bad" -eq 0 ]
          echo "✅ a deploy without its token or build-dir fails before anything is installed"

      # A valid alias, on this workflow's own event. On a pull request it is
      # ignored and the target is pr-<number>.
      - name: 'preview-netlify: on this event, with a valid dispatch-alias'
        id: netlify
        continue-on-error: true
        uses: ./preview-netlify
        with:
          netlify-auth-token: 'harness-fake-token'
          netlify-site-id: '00000000-0000-0000-0000-000000000000'
          build-dir: 'harness-site'
          lectures-dir: ''
          dispatch-alias: 'dispatch-harness'

      - name: 'preview-cloudflare: on this event, with a valid dispatch-alias'
        id: cloudflare
        continue-on-error: true
        uses: ./preview-cloudflare
        with:
          cloudflare-api-token: 'harness-fake-token'
          cloudflare-account-id: '00000000000000000000000000000000'
          project-name: 'harness-no-such-project'
          build-dir: 'harness-site'
          lectures-dir: ''
          dispatch-alias: 'dispatch-harness'

      - name: Assert each action installed its CLI exactly when it was going to deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RESULTS: |
            preview-netlify|${{ steps.netlify.outcome }}|${{ steps.netlify.outputs.deployed }}|${{ steps.netlify.outputs.deploy-url }}
            preview-cloudflare|${{ steps.cloudflare.outcome }}|${{ steps.cloudflare.outputs.deployed }}|${{ steps.cloudflare.outputs.deploy-url }}
        run: |
          set -euo pipefail
          # This workflow runs on pull_request, push and workflow_dispatch. A
          # pull request from this repository deploys to pr-<number>, and a
          # dispatch to dispatch-harness; a fork's pull request, a push and
          # anything by Dependabot deploy nothing.
          want=skip
          if [ "$ACTOR" != "dependabot[bot]" ]; then
            case "$EVENT_NAME" in
              pull_request) [ "$HEAD_REPO" != "$REPOSITORY" ] || want=deploy ;;
              workflow_dispatch) want=deploy ;;
            esac
          fi
          echo "event [$EVENT_NAME], actor [$ACTOR], head [$HEAD_REPO]: expecting each action to $want"

          bad=0 n=0
          while IFS='|' read -r action outcome deployed url; do
            [ -n "$action" ] || continue
            n=$((n + 1))
            # The install's last act is to link the CLI into bin/.
            cli=$(compgen -G "$RUNNER_TEMP/$action.*/bin/*" || true)
            if [ "$deployed" != "false" ] || [ -n "$url" ]; then
              echo "::error::$action: expected deployed=false and no deploy-url with fake credentials, got deployed=[$deployed] deploy-url=[$url]"
              bad=1
            elif [ "$want" = deploy ] && { [ "$outcome" != "failure" ] || [ -z "$cli" ]; }; then
              echo "::error::$action: expected the CLI installed and the deploy to fail on the fake credentials, got outcome=[$outcome] and CLI [${cli:-not installed}]"
              bad=1
            elif [ "$want" = skip ] && { [ "$outcome" != "success" ] || compgen -G "$RUNNER_TEMP/$action.*" > /dev/null; }; then
              echo "::error::$action: expected success with nothing installed, got outcome=[$outcome] and [$(compgen -G "$RUNNER_TEMP/$action.*" || echo 'nothing installed')]"
              bad=1
            else
              echo "✓ $action: outcome=$outcome, deployed=$deployed, CLI ${cli:+installed at }${cli:-not installed}"
            fi
          done <<< "$RESULTS"
          [ "$n" -eq 2 ] || { echo "::error::expected 2 cases, read $n"; exit 1; }
          [ "$bad" -eq 0 ]
          echo "✅ each action installed its CLI only for a deploy, and set deployed"

  # ==========================================================================
  # Single anchor for branch protection
  # ==========================================================================

  harness-summary:
    name: 'Action harness: all checks'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - gate
      - unit-build-seed
      - unit-build-restore
      - unit-build-restore-save
      - unit-build-miss-guard
      - unit-exec-seed
      - unit-exec-restore
      - unit-exec-restore-save
      - unit-custom-seed
      - unit-custom-restore
      - unit-line-break
      - unit-input-values
      - env-seed
      - env-hit-build
      - env-version-bump
      - env-file-edit
      - env-pinned-seed
      - env-pinned-hit
      - env-pinned-edit
      - build-fail-guard
      - build-display-error-guard
      - build-html-copy
      - env-container-update
      - pdf-check-handoff
      - pdf-check-build
      - pdf-check-switch-off
      - pdf-check-switch-verify
      - preview-site-handoff
      - preview-deploy-job
      - container-images
      - bjc-smoke
      - bjc-fail-guard
      - bjc-abort-guard
      - bjc-builders-parse
      - bjc-restore-build
      - bjc-restore-exec
      - dc-gate-probe
      - dc-refuses-ungated
      - dc-inputs
      - dc-wrangler-config
      - dc-refuses-mismatch
      - publish-release-packaging
      - publish-modes
      - preview-cli-install
      - preview-change-detection
      - preview-decide
      - preview-comment
      - preview-wiring
    steps:
      # This is the job intended to be the single required status check, so it
      # has to be correct in BOTH shapes the gate can produce, and must never be
      # vacuously green. Three failure modes it explicitly rejects:
      #   - the gate itself failed or was skipped: nothing can be certified
      #   - gate said relevant, but a job did not succeed
      #   - gate said not relevant, but a job ran anyway (the fan-out and the
      #     gate disagree, so one of them is wrong)
      - name: Certify the harness result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"

          GATE=$(jq -r '.gate.result // "missing"' <<< "$RESULTS")
          RELEVANT=$(jq -r '.gate.outputs.relevant // ""' <<< "$RESULTS")
          JOBS=$(jq -c 'del(.gate)' <<< "$RESULTS")
          COUNT=$(jq 'length' <<< "$JOBS")

          [ "$GATE" = "success" ] \
            || { echo "::error::the relevance gate did not succeed (result=[$GATE]) — the harness result cannot be certified"; exit 1; }
          [ "$COUNT" -gt 0 ] \
            || { echo "::error::no harness jobs in needs — this check would certify nothing"; exit 1; }

          case "$RELEVANT" in
            true)
              jq -e 'all(.[]; .result == "success")' <<< "$JOBS" > /dev/null \
                || { echo "::error::One or more harness jobs did not succeed"; exit 1; }
              echo "✅ action harness green ($COUNT jobs)"
              ;;
            false)
              jq -e 'all(.[]; .result == "skipped")' <<< "$JOBS" > /dev/null \
                || { echo "::error::the gate found no harness-relevant changes, but not every job skipped — the gate and the fan-out disagree"; exit 1; }
              echo "✅ no harness-relevant paths changed — all $COUNT jobs skipped"
              ;;
            *)
              echo "::error::the gate produced no relevance decision (relevant=[$RELEVANT])"; exit 1
              ;;
          esac
