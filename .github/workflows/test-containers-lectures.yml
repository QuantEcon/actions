name: Test Container Builds

# Validates containers by building all lecture repos with all builders.
# Architecture: Each job builds one repo × one container through the full
# builder pipeline (html → pdflatex → jupyter) sequentially.
#
# The job-level concurrency group ensures the same repo never builds on two
# containers simultaneously, avoiding network contention from concurrent dataset
# downloads. Different repos can run in parallel.
#
# That group is scoped by run id on purpose. A concurrency group holds one
# running job plus one pending job — a third arrival evicts the pending one — so
# an unscoped group let a second run silently cancel the first run's queued
# matrix legs, and `cancelled` does not read as a regression. Run-id scoping caps
# each group at the number of containers in the matrix; keep that at two, or the
# eviction returns. Overlapping runs are handled by the workflow-level group
# below instead, where superseding is explicit.
#
# The `quantecon` GHCR org is intentionally hardcoded (GHCR image paths must be
# lowercase, so github.repository_owner — which preserves casing — can't be substituted here).

on:
  workflow_run:
    workflows: ["Build QuantEcon Containers"]
    types:
      - completed
    # After a promotion, which only main's runs make (#142). A dispatch from
    # another branch dry-runs it and leaves :latest as it was, so it has
    # nothing new for this matrix, and in this workflow's concurrency group it
    # would cancel a scheduled run in progress.
    branches: [main]
  # Weekly against the published :latest, with no image change behind it. The
  # image builds no longer run on a schedule (#235), and without this the matrix
  # would run only when an image changes, which can be weeks apart (none from
  # 2026-09-25 to 2026-11-04). This run is what catches the lecture repos, or
  # the actions they build with, drifting against an unchanged image.
  schedule:
    - cron: '0 2 * * 1'   # Monday 02:00 UTC
  workflow_dispatch:

concurrency:
  group: test-containers-lectures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    # Per repo: an entry may set its own ceiling, otherwise 120. lecture-python.myst
    # needs more: on CPU its HTML build alone takes 72-163 min depending on the
    # runner, and its slowest leg took 174 of the 180 it had (#141, #159, #196).
    # Lower it once its lectures are faster on CPU: see
    # QuantEcon/lecture-python.myst#1118. The durations job warns when a leg
    # passes 80% of its ceiling, and reads the ceilings from this matrix.
    timeout-minutes: ${{ matrix.repo.timeout-minutes || 120 }}

    permissions:
      contents: read
      packages: read

    # Serialize containers for the same repo to avoid concurrent downloads.
    # Scoped by run id so queued legs are never evicted by a later run — see the
    # note at the top of this file.
    concurrency:
      group: test-build-${{ github.run_id }}-${{ matrix.repo.repo }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        container: [quantecon, quantecon-build]
        repo:
          - repo: lecture-python-intro
            owner: QuantEcon
          # Dropped without a note by the February 2026 rewrite (81e96ff),
          # unlike lecture-jax below, while the validation docs went on
          # describing a four-repo matrix; restored in #102. Its notebooks
          # fetch from raw GitHub at build time too, so it relies on the HTML
          # retry below.
          - repo: lecture-python-programming
            owner: QuantEcon
          - repo: lecture-python.myst
            owner: QuantEcon
            timeout-minutes: 240
          - repo: lecture-python-advanced.myst
            owner: QuantEcon
          # TODO: Re-enable after https://github.com/QuantEcon/lecture-jax/issues/284 is resolved
          # lecture-jax requires JAX but doesn't include pip install commands
          # - repo: lecture-jax
          #   owner: QuantEcon

    container:
      image: ghcr.io/quantecon/${{ matrix.container }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    name: ${{ matrix.repo.repo }} · ${{ matrix.container }}

    steps:
      # Build times differ by up to ~1.6x between legs running identical inputs,
      # so record the host CPU with each run: without it, a slow leg cannot be
      # told apart from a slower build (#141).
      - name: Record runner CPU
        env:
          LEG: ${{ matrix.repo.repo }} · ${{ matrix.container }}
        run: |
          model=$(grep -m1 '^model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//' || true)
          echo "Runner CPU: ${model:-unknown} ($(nproc) cores)"
          echo "**$LEG**: ${model:-unknown CPU}, $(nproc) cores" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout actions repository
        uses: actions/checkout@v7
        with:
          # Use the composite actions from the commit that built the container
          # under test. workflow_run checks out the default branch by default;
          # fall back to github.sha, the default branch's head, for scheduled
          # and manual workflow_dispatch runs.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: actions-repo

      - name: Checkout lecture repository
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo.owner }}/${{ matrix.repo.repo }}
          path: lecture-repo

      - name: Setup Environment
        uses: ./actions-repo/setup-environment

      # Stage 1: HTML (executes notebooks). Tried twice.
      #
      # Several lectures fetch a dataset from raw GitHub in a hidden cell at
      # build time, and with the matrix building several repos at once from
      # shared runner IPs that fetch is sometimes refused with HTTP 429. It is
      # transient — the same notebook passed on the other container in the
      # same run — but nothing in the stack retries it, so one 429 failed the
      # leg and, off the weekly workflow_run trigger, filed a CI-failure issue
      # for a flake (#102). The lectures cannot read the data locally instead:
      # the published notebooks are a flat directory opened in Colab, where a
      # local path does not exist.
      #
      # So a first attempt that fails is rebuilt once. The retry is cheap, so
      # it is not gated on the 429 string: the lecture repos build with
      # `execute_notebooks: cache`, and lecture-repo/_build/.jupyter_cache
      # survives between steps — it is why stages 2 and 3 skip execution — so
      # the second build executes only the notebooks that failed the first.
      #
      # `--all` is what makes the retry sound. After a failed `-W --keep-going`
      # build the saved Sphinx environment counts every page as up to date, so
      # a plain rebuild reads nothing, re-executes nothing, re-emits no warning
      # and exits 0 with the traceback still in the page: it would pass every
      # persistent failure. `--all` discards that environment, so every page
      # is re-read and every warning re-checked, while the jupyter cache still
      # spares the notebooks that executed. A persistent failure fails the
      # retry, and with it the leg.
      #
      # The first attempt's failure report — its traceback, `::error::`
      # annotation and reports artifact — still appears on a leg the retry
      # turns green. That is deliberate: with the job-summary line below, it
      # is how a flake stays visible.
      - name: Build HTML (Execute Notebooks)
        id: build-html
        continue-on-error: true
        uses: ./actions-repo/build-lectures
        with:
          source-dir: lecture-repo/lectures
          output-dir: lecture-repo
          builder: html
          upload-failure-reports: true
          failure-artifact-name: reports-html-${{ matrix.container }}-${{ matrix.repo.repo }}

      # The first attempt's execution reports are in its own artifact by now.
      # Cleared so that a retry that fails too reports, and uploads, only the
      # notebooks that failed on the retry (myst-nb recreates the directory).
      - name: Record the HTML retry and clear the first attempt's reports
        if: steps.build-html.outcome == 'failure'
        env:
          LEG: ${{ matrix.repo.repo }} · ${{ matrix.container }}
          ARTIFACT: reports-html-${{ matrix.container }}-${{ matrix.repo.repo }}
        run: |
          rm -rf lecture-repo/_build/html/reports
          echo "The first HTML build attempt failed; retrying with --all. Its execution reports are in the $ARTIFACT artifact."
          echo "**$LEG**: the first HTML build attempt failed and was retried (its execution reports: \`$ARTIFACT\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build HTML (Retry)
        if: steps.build-html.outcome == 'failure'
        uses: ./actions-repo/build-lectures
        with:
          source-dir: lecture-repo/lectures
          output-dir: lecture-repo
          builder: html
          extra-args: -W --keep-going --all
          upload-failure-reports: true
          # Its own name: build-lectures uploads the reports under this name
          # when the build fails, and a run cannot hold two artifacts of one
          # name, so reusing the first attempt's would fail the upload.
          failure-artifact-name: reports-html-retry-${{ matrix.container }}-${{ matrix.repo.repo }}

      # The lecture repos use quantecon-book-theme, which renders a page's
      # "Last changed" header only when git can read the checkout during the
      # build, and omits it silently otherwise, so a green build is no
      # evidence the header rendered. Count the pages that carry it.
      - name: Assert pages carry the "Last changed" header
        run: |
          n=$(grep -l -- 'class="qe-page__header-changed"' lecture-repo/_build/html/*.html 2>/dev/null | wc -l || true)
          [ "$n" -gt 0 ] \
            || { echo "::error::no page in lecture-repo/_build/html has the 'Last changed' header: git could not read the checkout during the build"; exit 1; }
          echo "✅ $n pages carry the 'Last changed' header"

      # Stage 2: pdflatex (reuses cached notebooks from HTML build)
      - name: Build PDF (No Execution)
        uses: ./actions-repo/build-lectures
        with:
          source-dir: lecture-repo/lectures
          output-dir: lecture-repo
          builder: pdflatex
          upload-failure-reports: true
          failure-artifact-name: reports-pdflatex-${{ matrix.container }}-${{ matrix.repo.repo }}

      # Stage 3: jupyter (reuses cached notebooks from HTML build)
      - name: Build Jupyter Notebooks (No Execution)
        uses: ./actions-repo/build-lectures
        with:
          source-dir: lecture-repo/lectures
          output-dir: lecture-repo
          builder: jupyter
          upload-failure-reports: true
          failure-artifact-name: reports-jupyter-${{ matrix.container }}-${{ matrix.repo.repo }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.container }}-${{ matrix.repo.repo }}
          path: lecture-repo/_build
          retention-days: 3

  # Slow drift shows only as time (#141): a leg that grows towards its ceiling
  # passes until the day it is cancelled. On every run, dispatches too, this
  # writes each leg's minutes, its share of its ceiling and its change on its
  # recent green runs to the run's summary, and warns on a leg over 80% of
  # its ceiling, or 50% and 15 minutes over its median. A warning fails
  # nothing and files nothing.
  durations:
    name: Leg durations
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() && needs.test.result != 'skipped' }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # the run's jobs, and earlier runs'
    steps:
      - name: Checkout actions repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # leg-durations.sh reads the ceilings from this file's matrix with yq,
      # which GitHub's Ubuntu runner images include, 24.04 and 26.04 alike, so
      # nothing installs it here. Without it the step fails with an ::error::
      # that says so, the self-test in validate-containers.yml fails on every
      # harness run, and the legs' own results are untouched.
      - name: Record each leg's duration
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        # The history is main's runs, the script's default, whichever branch this run is on.
        run: |
          set -euo pipefail
          scripts/leg-durations.sh | tee -a "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Report failure
    runs-on: ubuntu-latest
    needs: [test]
    # This workflow runs unattended on its weekly schedule and after each
    # container build. Manual dispatches have someone watching them.
    #
    # `cancelled` must alert as well as `failure`. A leg killed by
    # `timeout-minutes` concludes *cancelled*, not failed, so a bare `failure()`
    # guard is silently disarmed by exactly the regression this matrix exists to
    # catch — a build that got slow enough to stop finishing. That is how the
    # 2026-08-03, -08-05 and -08-10 sweeps all went unreported: both
    # `lecture-python.myst` legs hit the 120-minute ceiling, every other leg
    # passed, and nothing was filed. Same class as #83 and #103; the same
    # guard-polarity lesson #123 encoded in `build-jupyter-cache`.
    #
    # `always()` is required because `failure()` is false once a needed job is
    # cancelled. But the workflow-level `cancel-in-progress` also cancels a run
    # that a newer one superseded, and the newer run reports for itself (a
    # dispatch, through whoever is watching it), so a
    # cancelled run files only when no newer run of this workflow exists on its
    # branch: otherwise a container build landing during a matrix run files a
    # false alarm, as #249 did twice in one morning. A failed leg always files,
    # and so does a timed-out one, since nothing newer has started. When the
    # runs cannot be listed, it files. build-containers.yml's alert takes the
    # same rule, through the same script (#286).
    if: ${{ always() && github.event_name != 'workflow_dispatch' && (needs.test.result == 'failure' || needs.test.result == 'cancelled') }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Checkout actions repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check whether a newer run superseded this one
        id: superseded
        if: ${{ needs.test.result == 'cancelled' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # If the runs cannot be listed, report the cancellation.
          if ! newer=$(scripts/newer-runs.sh test-containers-lectures.yml "$BRANCH" "$RUN_NUMBER"); then
            echo "::warning::cannot list this workflow's runs, so the cancellation is reported"
            exit 0
          fi
          if [ "$newer" -gt 0 ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Cancelled, and $newer newer run(s) of this workflow exist on $BRANCH, which report for themselves: no issue filed."
          fi

      - name: Open or update the failure tracking issue
        if: steps.superseded.outputs.superseded != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_LABELS: bug,infrastructure
        run: ./scripts/create-ci-failure-issue.sh
