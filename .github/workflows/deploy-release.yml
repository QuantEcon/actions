# Deploy a release to GitHub Pages: a reusable workflow
#
# Deploys the site one of the repository's releases holds, as publish-gh-pages
# attached it: on a release published for a `publish-*` tag, that release; on
# a dispatch, the release of the tag it names, which puts an earlier site back
# (a rollback). It is for a lecture repository whose site is built elsewhere
# and arrives as a release, which calls it from a short workflow of its own,
# templates/deploy-release.yml. The user manual's chapter is
# docs/user/workflows/deploy-release.md.
#
# Two jobs, so that only the second holds the Pages permissions, and a third
# for a series with a companion notebooks repository:
#   upload     restore-gh-pages downloads the release's archive and checksum,
#              checks the archive's SHA-256 and extracts the site, and
#              publish-gh-pages uploads it as the run's github-pages artifact.
#              It has read access alone.
#   deploy     publish-gh-pages deploys that artifact, in the caller's
#              github-pages environment, and does nothing else. A deploy that
#              fails can be re-run alone within a day, while the upload is
#              kept; after that, dispatch the tag again.
#   notebooks  only with notebooks-repository: after the deploy, restores the
#              release again and makes the companion repository, such as
#              QuantEcon/lecture-python-intro.notebooks, hold exactly the
#              site's _notebooks/ and a README it writes (a mirror: a
#              notebook the release no longer has is deleted there). It
#              pushes with the notebooks-token secret, which no other job
#              sees, and has read access alone besides.
# None runs repository or notebook code.
#
# The actions are named as quantecon/actions/<action>@v0: in a called
# workflow a ./ path is the caller's checkout. So whatever ref a caller pins
# this workflow at, the actions it runs are the latest release.
#
# The deploy joins the `pages` concurrency group, without cancelling, as the
# templates' publish.yml and restore.yml do, so two deploys never overlap. A
# caller should not use that group itself, at its top level or on the calling
# job: GitHub documents that a called workflow and its caller sharing a group
# with cancel-in-progress: true cancels the run already going, and says
# nothing of the same group without it.

name: Deploy a release to GitHub Pages, or an earlier one to roll back

on:
  workflow_call:
    inputs:
      tag:
        description: >-
          The tag of the release to deploy, such as `publish-2026-11-27`. Empty, the default, takes
          the tag of the release whose `published` event started the run. A run started by a
          release whose tag does not start with `publish-` deploys nothing, whatever this says.
          Only letters, digits, `.`, `_` and `-`, starting with a letter or a digit: any other tag,
          this input's or the release's, fails the job before anything is downloaded.
        type: string
        required: false
        default: ''
      asset-name:
        description: >-
          The start of the release's asset names, as `restore-gh-pages` takes it. Empty, the
          default, takes the release's one archive for the tag.
        type: string
        required: false
        default: ''
      notebooks-repository:
        description: >-
          A companion repository that serves the site's notebooks to Colab, as `owner/name`, such
          as `QuantEcon/lecture-python-intro.notebooks`. After the deploy, the `notebooks` job
          makes its default branch hold exactly the release's `_notebooks/`, at its root, and a
          README the job writes: a notebook the release no longer has is deleted. It needs the
          `notebooks-token` secret. Empty, the default, pushes no notebooks, and the job is
          skipped. Any value that is not `owner/name` fails the job.
        type: string
        required: false
        default: ''
    secrets:
      notebooks-token:
        description: >-
          A token that can push to `notebooks-repository`, such as a fine-grained token with
          Contents read and write on that repository alone. Only the `notebooks` job receives it.
          Required with `notebooks-repository`, and not used without it.
        required: false
    outputs:
      page-url:
        description: The URL of the deployed site, as GitHub Pages reports it.
        value: ${{ jobs.deploy.outputs.page-url }}
      commit:
        description: >-
          The full SHA of the commit the deployed site was built from, as the release's manifest
          records it. Empty when the manifest gives none.
        value: ${{ jobs.upload.outputs.commit }}

jobs:
  upload:
    # A release event deploys a publish- tag alone; a dispatch names its tag.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'publish-')
    runs-on: ubuntu-latest
    permissions:
      contents: read            # Required to read the release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.restore.outputs.commit }}
    steps:
      - name: Choose the release
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag=${INPUT_TAG:-$RELEASE_TAG}
          if [ -z "$tag" ]; then
            echo "::error::no tag: pass the tag input, or call this workflow on a release event"
            exit 1
          fi
          # restore-gh-pages' rule, checked before anything prints the tag, so
          # a value with a line break cannot start a workflow command (#267).
          # The error does not echo it.
          if ! [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::the tag must be letters, digits, '.', '_' and '-' only, starting with a letter or a digit"
            exit 1
          fi
          echo "Deploying the release of $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore the site from the release
        id: restore
        uses: quantecon/actions/restore-gh-pages@v0
        with:
          tag: ${{ steps.tag.outputs.tag }}
          asset-name: ${{ inputs.asset-name }}

      - name: Upload the site for GitHub Pages
        uses: quantecon/actions/publish-gh-pages@v0
        with:
          mode: 'upload'
          build-dir: ${{ steps.restore.outputs.build-dir }}

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write              # Required for GitHub Pages deployment
      id-token: write           # Required for GitHub Pages OIDC
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page-url }}
    outputs:
      page-url: ${{ steps.publish.outputs.page-url }}
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        uses: quantecon/actions/publish-gh-pages@v0
        with:
          mode: 'deploy'

  # After the deploy, so a companion repository's notebooks never run ahead of
  # the site; a rollback's dispatch puts the earlier release's notebooks back
  # too. It restores the release again, with its checksum check, rather than
  # take the site from the upload job. The companion repository is public, as
  # Colab needs, so the clone uses no token; the token reaches git on the push
  # alone, through that command's environment, never on a command line or in
  # .git/config.
  notebooks:
    needs: [upload, deploy]
    if: inputs.notebooks-repository != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read            # Required to read the release
    # Two releases' pushes to one repository never overlap: the later waits,
    # and a push that still loses a race fails rather than overwrite. A
    # caller should not use this group itself.
    concurrency:
      group: deploy-release-notebooks-${{ inputs.notebooks-repository }}
      cancel-in-progress: false
    steps:
      - name: Check the repository and the token
        env:
          REPOSITORY: ${{ inputs.notebooks-repository }}
          HAVE_TOKEN: ${{ secrets.notebooks-token != '' }}
        run: |
          # Checked before anything prints it or puts it in a URL, so a line
          # break cannot start a workflow command (#267); the error does not
          # echo it.
          if ! [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::notebooks-repository must be owner/name, such as QuantEcon/lecture-python-intro.notebooks"
            exit 1
          fi
          if [ "$HAVE_TOKEN" != true ]; then
            echo "::error::notebooks-repository is $REPOSITORY, and no notebooks-token secret reaches this workflow: pass one that can push there, under secrets: in the calling job"
            exit 1
          fi

      - name: Restore the site from the release
        id: restore
        uses: quantecon/actions/restore-gh-pages@v0
        with:
          tag: ${{ needs.upload.outputs.tag }}
          asset-name: ${{ inputs.asset-name }}

      # The mirror: the clone keeps .git alone, then takes every *.ipynb under
      # the site's _notebooks/, at the same path, and a README written here.
      # Nothing else from the site reaches it, and every other file there
      # goes, an environment.yml or an older README among them.
      - name: Mirror the notebooks into a clone of the companion repository
        id: mirror
        env:
          REPOSITORY: ${{ inputs.notebooks-repository }}
          SITE: ${{ steps.restore.outputs.build-dir }}
          TAG: ${{ needs.upload.outputs.tag }}
          COMMIT: ${{ needs.upload.outputs.commit }}
          PAGE_URL: ${{ needs.deploy.outputs.page-url }}
          SOURCE: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          src="$SITE/_notebooks"
          count=0
          [ -d "$src" ] && count=$(find "$src" -type f -name '*.ipynb' | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::error::the release of $TAG holds no notebook under _notebooks/, so nothing is pushed: a mirror of it would empty $REPOSITORY. The site is deployed; the notebooks there are still the last ones pushed."
            exit 1
          fi

          dest="$RUNNER_TEMP/notebooks-repository"
          GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 --no-tags "$SERVER/$REPOSITORY.git" "$dest"
          echo "branch=$(git -C "$dest" symbolic-ref --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "dir=$dest" >> "$GITHUB_OUTPUT"

          find "$dest" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          (cd "$src" && find . -type f -name '*.ipynb' -print0) | while IFS= read -r -d '' nb; do
            mkdir -p "$dest/$(dirname "$nb")"
            cp "$src/$nb" "$dest/$nb"
          done
          built="${COMMIT:+, built from $SOURCE@${COMMIT:0:7}}"
          {
            printf '# %s\n\n' "${REPOSITORY#*/}"
            printf 'The notebooks of %s, one for each page that has one, at the paths its "Open in Colab" links name.\n\n' "${PAGE_URL:-the site of $SOURCE}"
            # shellcheck disable=SC2016 # the backticks are Markdown, not a command
            printf 'This repository holds the release `%s` of [%s](%s/%s)%s. Each release replaces all of it, this README included, so an edit made here is lost at the next one: change the lectures in their source instead.\n' "$TAG" "$SOURCE" "$SERVER" "$SOURCE" "$built"
          } > "$dest/README.md"

          cd "$dest"
          git add --all
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "$REPOSITORY already holds the $count notebooks of $TAG: nothing to push."
            exit 0
          fi
          git diff --cached --no-renames --name-status | awk -F '\t' '
            $2 ~ /\.ipynb$/ { nb[$1]++; next }
            { other = other " " $2 " (" ($1 == "A" ? "added" : $1 == "D" ? "deleted" : "changed") ")" }
            END {
              printf "Notebooks: %d added, %d changed, %d deleted.\n", nb["A"], nb["M"], nb["D"]
              if (other != "") printf "Other files:%s.\n", other
            }'
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "Notebooks of $TAG${built}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # The token's one step. git reads the header from the push command's own
      # environment (GIT_CONFIG_*, git 2.31 and later), so it is in no file,
      # on no command line and in no later step. No --force: a push that a
      # newer one beat fails, rather than overwrite it.
      - name: Push the notebooks
        if: steps.mirror.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.notebooks-token }}
          DIR: ${{ steps.mirror.outputs.dir }}
          BRANCH: ${{ steps.mirror.outputs.branch }}
          COUNT: ${{ steps.mirror.outputs.count }}
          REPOSITORY: ${{ inputs.notebooks-repository }}
          TAG: ${{ needs.upload.outputs.tag }}
          SERVER: ${{ github.server_url }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git -C "$DIR" push --quiet origin "HEAD:$BRANCH"
          echo "Pushed the $COUNT notebooks of $TAG to $REPOSITORY ($BRANCH)."
