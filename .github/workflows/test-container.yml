name: Test Container

# The `quantecon` GHCR org is intentionally hardcoded (GHCR image paths must be
# lowercase, so github.repository_owner — which preserves casing — can't be substituted here).
#
# Two ways in, one set of jobs:
#   workflow_call      candidates, before they can reach :latest (#142). Main's,
#                      from build-containers.yml, which promotes them only if
#                      the smoke test passes and reports a failure in a tracking
#                      issue. A pull request's, from validate-containers.yml,
#                      whose result reaches the pull request's required check.
#   workflow_dispatch  any tag of any image, by hand, e.g. :latest, a pull
#                      request's pr-<N>, or a candidate from #150.
# The images and tag inputs mean the same on both. A caller can run the smoke
# test or the size report alone (`checks`), and gate on that call only.

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to test, as a JSON list'
        required: false
        default: '["quantecon", "quantecon-build"]'
      tag:
        description: 'Tag to test in each image'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      images:
        description: 'Images to test, as a JSON list of names under ghcr.io/quantecon'
        type: string
        required: true
      tag:
        description: 'Tag to test in each image'
        type: string
        required: true
      checks:
        description: 'The jobs to run: smoke, size, or all'
        type: string
        required: false
        default: 'all'

jobs:
  smoke:
    name: 'Smoke: ${{ matrix.image }}'
    runs-on: ubuntu-latest
    # A dispatch has no checks input, and runs both jobs.
    if: inputs.checks != 'size'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    # A real container job, not `docker run`. The runner mounts an empty
    # directory at /github/home and forces HOME=/github/home; `docker run` gets
    # HOME=/root. That is exactly how #85 (kaleido v1 losing its bundled
    # chromium, provisioned under /root at image build time) passed this
    # workflow while failing test-containers-lectures.yml, which does use a
    # container job. Same pattern as that workflow.
    container:
      image: ghcr.io/quantecon/${{ matrix.image }}:${{ inputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      # github.sha. For a call it is the commit that built the images: the
      # push to main, or the pull request's merge commit.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assert the container-job environment
        run: |
          cat /etc/quantecon-container
          # If this ever stops being /github/home, the job has silently reverted
          # to an environment in which #85 could not have surfaced.
          [ "$HOME" = "/github/home" ] \
            || { echo "::error::HOME=[$HOME], expected /github/home — this is no longer a container job"; exit 1; }

      # The checkout belongs to the runner's user (uid 1001) and is bind-mounted
      # into this container, where steps run as root: the shape in which git
      # refuses the work tree and quantecon-book-theme silently drops every
      # page's "Last changed" header. actions/checkout's own safe.directory
      # entry is gone by now (it wrote it under a temporary HOME), so this
      # passes only if the image itself trusts the tree.
      - name: Assert git can read the checkout
        run: |
          git log -1 --format='HEAD %h %cI' \
            || { echo "::error::git cannot read the checkout in a container job, so pages built with this image lose their 'Last changed' header"; exit 1; }

      - name: Smoke test
        run: ./containers/quantecon/tests/smoke-test.sh

      # Runs even if the smoke test failed: a green smoke test whose fixture
      # cannot fail is the defect #108 was about, so the guard has to report
      # independently.
      - name: Self-test (the fixture must be able to fail)
        if: always()
        run: ./containers/quantecon/tests/smoke-test.sh --self-test

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.image }}
          path: ${{ runner.temp }}/smoke-*/
          if-no-files-found: warn

  # Two figures per image, each labelled, and the job fails if either cannot be
  # computed. They measure different things, so compare each only with itself.
  #
  # Compressed: the layer sizes in the registry's linux/amd64 image manifest,
  # i.e. what a cold pull downloads. build-push-action attaches a provenance
  # attestation by default, so :latest is an OCI image index (the amd64 image
  # plus an unknown/unknown attestation manifest) with no top-level .layers.
  # The first version of this job (#125) read .layers off the index, and with
  # no pipefail tee's exit status kept it green: it never produced a figure.
  # A pull request's candidate is pushed without an attestation
  # (validate-containers.yml), so it is a plain image manifest, measured as is.
  #
  # On disk: the unpacked layers after a pull on this runner, as `docker image
  # inspect` reports them on the classic graph driver (overlay2). That is the
  # figure `docker images` printed in the job before #125 (lean image only).
  # Under the containerd image store, the default for fresh installs from
  # Docker Engine 29, the same field is the compressed content size. Since
  # ubuntu-latest became ubuntu-26.04 (Docker 29.4) in November 2026, a step
  # first switches this runner's daemon back to the classic store, and the
  # report still fails if the switch did not hold rather than print compressed
  # content as on-disk.
  size:
    name: 'Image size: ${{ matrix.image }}'
    runs-on: ubuntu-latest
    if: inputs.checks != 'smoke'
    # The pull dominates: the smoke job's container init takes ~2m10s.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      # features.containerd-snapshotter=false is Docker's documented way back
      # to the classic store. The runner is fresh, so no images are lost.
      - name: Use Docker's classic image store
        shell: bash
        run: |
          store=$(docker info --format '{{json .DriverStatus}}')
          if [[ $store != *io.containerd.snapshotter* ]]; then
            echo "Docker already uses the classic image store ($(docker info --format '{{.Driver}}'))"
            exit 0
          fi
          conf=/etc/docker/daemon.json
          if sudo test -s "$conf"; then current=$(sudo cat "$conf"); else current='{}'; fi
          jq '.features["containerd-snapshotter"] = false' <<<"$current" | sudo tee "$conf" >/dev/null
          sudo systemctl restart docker
          docker info --format 'Docker {{.ServerVersion}} now uses {{.Driver}}: {{json .DriverStatus}}'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `shell: bash` runs with pipefail, which the default shell does not.
      - name: Report image size (compressed and on disk)
        shell: bash
        env:
          NAME: ${{ matrix.image }}
          REPO: ghcr.io/quantecon/${{ matrix.image }}
          TAG: ${{ inputs.tag }}
        run: |
          fail() { echo "::error::$NAME: $*"; exit 1; }
          is_size() { [[ $1 =~ ^[1-9][0-9]*$ ]]; }
          gb() { awk -v b="$1" 'BEGIN { printf "%.2f GB", b / 1e9 }'; }

          # An index or manifest list: measure and pull its linux/amd64 image.
          # A plain image manifest is measured as is.
          top=$(docker manifest inspect "$REPO:$TAG") || fail "docker manifest inspect $REPO:$TAG failed"
          if jq -e 'has("manifests")' <<<"$top" >/dev/null 2>&1; then
            digest=$(jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
              | if length == 1 then .[0].digest else error("\(length) linux/amd64 manifests") end' <<<"$top") \
              || fail "expected exactly one linux/amd64 manifest under $REPO:$TAG"
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || fail "bad linux/amd64 digest [$digest]"
            ref="$REPO@$digest"
            manifest=$(docker manifest inspect "$ref") || fail "docker manifest inspect $ref failed"
          else
            ref="$REPO:$TAG"
            manifest=$top
          fi
          compressed=$(jq -r '[.layers[].size]
            | if length > 0 and all(type == "number") then add else error("bad layer sizes") end' <<<"$manifest") \
            || fail "no layer list in the manifest for $ref"
          is_size "$compressed" || fail "compressed size [$compressed] is not a positive integer"

          engine=$(docker version --format '{{.Server.Version}}')
          driver=$(docker info --format '{{.Driver}}')
          store=$(docker info --format '{{json .DriverStatus}}')
          [[ $store != *io.containerd.snapshotter* ]] \
            || fail "Docker $engine uses the containerd image store, where image inspect's Size is compressed content, not on-disk size"
          docker pull --quiet "$ref" >/dev/null || fail "docker pull $ref failed"
          on_disk=$(docker image inspect --format '{{.Size}}' "$ref") || fail "docker image inspect $ref failed"
          is_size "$on_disk" || fail "on-disk size [$on_disk] is not a positive integer"

          {
            echo "- \`$NAME:$TAG\` compressed: $(gb "$compressed") ($compressed bytes), sum of the layer sizes in the registry's linux/amd64 manifest (what a cold pull downloads)"
            echo "- \`$NAME:$TAG\` on disk: $(gb "$on_disk") ($on_disk bytes), unpacked layers after docker pull, per docker image inspect (Docker $engine, $driver)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
