name: 'Build Lectures'
description: >-
  Builds the lectures with Jupyter Book, as the website, the PDF or notebooks. When the build
  fails it prints each failing notebook's traceback, and can upload the execution reports.
author: 'QuantEcon'

# Each description below is copied verbatim into the user manual
# (docs/user/actions/build-lectures.md) by scripts/generate-docs.py, so it is
# written for a reader.
inputs:
  builder:
    description: >-
      What to build: `html`, the default, builds the website into `<output-dir>/_build/html`;
      `pdflatex` builds the PDF into `<output-dir>/_build/latex`, and needs LaTeX; `jupyter`
      builds notebooks into `<output-dir>/_build/jupyter`. Any other value is passed to `jb build`
      as `--builder <value>`, which writes into a directory under `<output-dir>/_build`.
    required: false
    default: 'html'
  source-dir:
    description: >-
      The book to build: the directory that holds its `_config.yml` and `_toc.yml`, relative to
      the workspace.
    required: false
    default: 'lectures'
  output-dir:
    description: >-
      The directory the build is written under, passed to `jb build` as `--path-output`, so the
      output lands in `<output-dir>/_build`. The cache actions read and write `_build` at the
      workspace root, so keep the default, `.`, in a job that uses them.
    required: false
    default: '.'
  extra-args:
    description: >-
      Further arguments for `jb build`. They are split on whitespace, so a quoted value that
      contains a space cannot be passed. Setting this replaces the default, so keep `-W` in it:
      without `-W`, a notebook that raises an exception is only a warning, and the build
      succeeds.
    required: false
    default: '-W --keep-going'
  html-copy-pdf:
    description: >-
      With `builder: html`: `'true'` copies each PDF under `<output-dir>/_build/latex` into
      `<output-dir>/_build/html/_pdf/` before the build, so the site offers it for download. The
      PDF comes from a `pdflatex` build earlier in the job, or from a restored build cache; if
      that directory does not exist, a warning says so and the site is built without it. Ignored
      by the other builders.
    required: false
    default: 'false'
  html-copy-notebooks:
    description: >-
      With `builder: html`: `'true'` copies each notebook under `<output-dir>/_build/jupyter` into
      `<output-dir>/_build/html/_notebooks/` before the build, so the site offers them for
      download. The notebooks come from a `jupyter` build earlier in the job, or from a restored
      build cache; if that directory does not exist, a warning says so and the site is built
      without them. Ignored by the other builders.
    required: false
    default: 'false'
  upload-failure-reports:
    description: >-
      `'true'` uploads an artifact when the build fails, holding the `reports` directories in
      `_build/html`, `_build/latex` and `_build/jupyter`, and `_build/.jupyter_cache`, all under
      `output-dir`, kept for 7 days. `'false'`, the default, uploads nothing. For the `html`,
      `pdflatex` and `jupyter` builders the log shows each failing notebook's traceback either
      way.
    required: false
    default: 'false'
  failure-artifact-name:
    description: >-
      The name of the artifact that `upload-failure-reports` uploads. Empty, the default, names it
      `execution-reports-<builder>`. A name can be used only once in a workflow run, so set this
      when more than one job in a run builds with the same builder.
    required: false
    default: ''

outputs:
  build-path:
    description: >-
      The directory the builder wrote to: `<output-dir>/_build/html`, `_build/latex` or
      `_build/jupyter` for those three builders. For any other it is `<output-dir>/_build`, the
      directory above the one that builder wrote to. With the default `output-dir` it starts
      with `./`, as in `./_build/html`. Set whether or not the build succeeds.
    value: ${{ steps.build.outputs.build-path }}

runs:
  using: "composite"
  steps:
    - name: Stage PDF for HTML build
      if: inputs.builder == 'html' && inputs.html-copy-pdf == 'true'
      shell: bash
      run: |
        echo "::group::Stage PDF for HTML build"
        PDF_SOURCE="${{ inputs.output-dir }}/_build/latex"
        PDF_DEST="${{ inputs.output-dir }}/_build/html/_pdf"
        
        if [ -d "$PDF_SOURCE" ]; then
          mkdir -p "$PDF_DEST"
          find "$PDF_SOURCE" -name "*.pdf" -exec cp {} "$PDF_DEST/" \;
          echo "Staged PDFs in $PDF_DEST (Jupyter Book will detect and enable downloads):"
          ls -lh "$PDF_DEST" || echo "No PDFs found"
        else
          echo "::warning::PDF source directory not found: $PDF_SOURCE"
          echo "Run pdflatex builder before html builder with html-copy-pdf"
        fi
        echo "::endgroup::"

    - name: Stage notebooks for HTML build
      if: inputs.builder == 'html' && inputs.html-copy-notebooks == 'true'
      shell: bash
      run: |
        echo "::group::Stage notebooks for HTML build"
        NB_SOURCE="${{ inputs.output-dir }}/_build/jupyter"
        NB_DEST="${{ inputs.output-dir }}/_build/html/_notebooks"
        
        if [ -d "$NB_SOURCE" ]; then
          mkdir -p "$NB_DEST"
          find "$NB_SOURCE" -name "*.ipynb" -exec cp {} "$NB_DEST/" \;
          NB_COUNT=$(find "$NB_DEST" -name "*.ipynb" | wc -l)
          echo "Staged $NB_COUNT notebooks in $NB_DEST (Jupyter Book will detect and enable downloads)"
        else
          echo "::warning::Notebook source directory not found: $NB_SOURCE"
          echo "Run jupyter builder before html builder with html-copy-notebooks"
        fi
        echo "::endgroup::"

    # Git history for page metadata. quantecon-book-theme dates each page and
    # builds its changelog from `git log`, and when git fails it drops the
    # "Last changed" header without a warning. In a container job git does
    # fail: the runner creates the workspace as its own user (uid 1001) and
    # bind-mounts it into the container, where steps run as root, so git
    # refuses the work tree ("detected dubious ownership", exit 128).
    # actions/checkout trusts the tree only in a temporary HOME that it
    # deletes when its step ends, so later steps do not inherit the entry.
    #
    # The trust is job-scoped: command-scope config passed through the
    # environment (GIT_CONFIG_COUNT/KEY/VALUE) and exported via $GITHUB_ENV,
    # which git reads as protected config and so honours for safe.directory.
    # Nothing is written to disk, so nothing outlives the job even on a
    # long-lived runner, and the real global config stays in force
    # (GIT_CONFIG_GLOBAL would replace it for every later step).
    # The entry names the work-tree root found from source-dir, not
    # $GITHUB_WORKSPACE: the two differ when the caller checks out into a
    # subdirectory (test-containers-lectures.yml does), and git does not
    # honour an entry for a subdirectory of the tree. A no-op wherever git
    # can already read the tree (the hosted runner, or an image that trusts
    # it system-wide).
    - name: Check git history for page metadata
      if: inputs.builder != 'pdflatex' && inputs.builder != 'jupyter'
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
      run: |
        # -c safe.directory='*' applies to this one command only (git reads
        # safe.directory from command-line config), so it can find the root
        # of a tree that git does not yet trust.
        if ! command -v git >/dev/null 2>&1; then
          echo "::warning::git is not installed, so pages will be built without their 'Last changed' date and changelog"
        elif ! TOP=$(git -c safe.directory='*' -C "$SOURCE_DIR" rev-parse --show-toplevel 2>&1); then
          # Quote git's own reason: not a work tree, or anything else that stops
          # git before it can look (a malformed GIT_CONFIG_COUNT, for one).
          echo "::warning::git cannot find the work tree for $SOURCE_DIR, so pages will be built without their 'Last changed' date and changelog: ${TOP%%$'\n'*}"
        else
          # Adds the entry only while git refuses the tree, so the repeat calls
          # of multi-format callers and build-jupyter-cache add nothing. It is
          # appended after any entries a caller already set, exported here so
          # the check below sees it, and written to $GITHUB_ENV for the build
          # step and the rest of the job.
          if ! git -C "$SOURCE_DIR" rev-parse --git-dir >/dev/null 2>&1; then
            n=${GIT_CONFIG_COUNT:-0}
            export GIT_CONFIG_COUNT=$((n + 1)) "GIT_CONFIG_KEY_$n=safe.directory" "GIT_CONFIG_VALUE_$n=$TOP"
            if [ -n "${GITHUB_ENV:-}" ] && printf '%s\n' "GIT_CONFIG_COUNT=$GIT_CONFIG_COUNT" \
                 "GIT_CONFIG_KEY_$n=safe.directory" "GIT_CONFIG_VALUE_$n=$TOP" >> "$GITHUB_ENV"; then
              echo "Trusted $TOP for git for the rest of this job (GIT_CONFIG_KEY_$n)"
            fi
          fi
          if ! git -C "$SOURCE_DIR" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::warning::git cannot read $TOP, so pages will be built without their 'Last changed' date and changelog: $(git -C "$SOURCE_DIR" rev-parse --git-dir 2>&1 | head -n 1)"
          elif [ "$(git -C "$SOURCE_DIR" rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::warning::$TOP is a shallow clone, so every page's 'Last changed' date will be the checked-out commit's date. Set fetch-depth: 0 on actions/checkout to date each page from its own history."
          else
            echo "Git history available in $TOP"
          fi
        fi

    - name: Build lectures
      id: build
      shell: bash -l {0}
      env:
        BUILDER: ${{ inputs.builder }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        echo "Building with builder: $BUILDER"

        # Builder-specific flags as an array — no eval, and paths stay quoted.
        case "$BUILDER" in
          html)     builder_args=() ;;
          pdflatex) builder_args=(--builder pdflatex -n) ;;
          jupyter)  builder_args=(--builder=custom --custom-builder=jupyter -n) ;;
          *)        builder_args=(--builder "$BUILDER") ;;
        esac

        # EXTRA_ARGS is intentionally left unquoted so it word-splits into
        # separate flags (e.g. "-W --keep-going"); quoted args with embedded
        # spaces inside EXTRA_ARGS are not supported.
        echo "::group::Build Command"
        echo "jb build $SOURCE_DIR --path-output $OUTPUT_DIR ${builder_args[*]} $EXTRA_ARGS"
        echo "::endgroup::"

        # Execute build and capture exit code
        set +e
        jb build "$SOURCE_DIR" --path-output "$OUTPUT_DIR" "${builder_args[@]}" $EXTRA_ARGS
        BUILD_EXIT_CODE=$?
        set -e

        # Set output path regardless of success/failure (compute once; write
        # with the heredoc delimiter form so it's robust to odd characters).
        case "$BUILDER" in
          html)     build_path="${OUTPUT_DIR}/_build/html" ;;
          pdflatex) build_path="${OUTPUT_DIR}/_build/latex" ;;
          jupyter)  build_path="${OUTPUT_DIR}/_build/jupyter" ;;
          *)        build_path="${OUTPUT_DIR}/_build" ;;
        esac
        {
          echo "build-path<<EOF"
          echo "$build_path"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

        # Return the build status by ending the script, NOT via the exit
        # builtin. This step runs in a login shell (bash -l, required for
        # conda activation), and on hosted runners the explicit exit builtin
        # triggers ~/.bash_logout processing at SHLVL=1, where Ubuntu's
        # clear_console fails on a headless runner and its status overrides
        # the one passed to exit — turning a successful build into exit 1.
        # Containers are unaffected (root has no ~/.bash_logout), which is
        # why production container builds never hit this.
        (exit "$BUILD_EXIT_CODE")

    - name: Report build failure
      if: failure()
      shell: bash
      env:
        BUILDER: ${{ inputs.builder }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        UPLOAD_FAILURE_REPORTS: ${{ inputs.upload-failure-reports }}
        # The same expression as the upload step's name: below, so the banner
        # names the artifact actually uploaded (failure-artifact-name wins when
        # set). Keep the two in step.
        ARTIFACT_NAME: ${{ inputs.failure-artifact-name != '' && inputs.failure-artifact-name || format('execution-reports-{0}', inputs.builder) }}
      run: |
        # The reports directory the upload step collects for this builder: the
        # sphinx outdir, which for pdflatex is _build/latex, not _build/pdflatex.
        # Mirrors the upload step's path list and the build-path case above.
        case "$BUILDER" in
          html)     REPORTS_DIR="${OUTPUT_DIR}/_build/html/reports" ;;
          pdflatex) REPORTS_DIR="${OUTPUT_DIR}/_build/latex/reports" ;;
          jupyter)  REPORTS_DIR="${OUTPUT_DIR}/_build/jupyter/reports" ;;
          *)        REPORTS_DIR="" ;;
        esac

        echo ""
        echo "::error::❌ BUILD FAILED - Jupyter Book build encountered errors"
        echo ""
        echo "╔════════════════════════════════════════════════════════════════╗"
        echo "║                    BUILD FAILURE SUMMARY                       ║"
        echo "╚════════════════════════════════════════════════════════════════╝"
        echo ""
        echo "  Builder:   $BUILDER"
        echo "  Source:    $SOURCE_DIR"
        echo "  Output:    $OUTPUT_DIR/_build"
        echo ""
        echo "════════════════════════════════════════════════════════════════════"
        echo ""

        # myst-nb logs only "CellExecutionError" and the report path for a
        # notebook that raised: the traceback goes to <outdir>/reports/<doc>.err.log
        # and nowhere else, so without this it lives only in a 7-day artifact.
        # Print each one, trimmed, in its own group. stop-commands keeps a
        # notebook's output from being read as workflow commands.
        if [ -n "$REPORTS_DIR" ] && [ -d "$REPORTS_DIR" ]; then
          mapfile -t ERR_LOGS < <(find "$REPORTS_DIR" -name '*.err.log' -type f | sort)
          if [ "${#ERR_LOGS[@]}" -gt 0 ]; then
            echo "📓 ${#ERR_LOGS[@]} notebook(s) failed to execute; their tracebacks (last 200 lines each):"
            TOKEN="tb-$RANDOM$RANDOM$RANDOM"
            for f in "${ERR_LOGS[@]}"; do
              echo "::group::${f#"$REPORTS_DIR"/}"
              echo "::stop-commands::$TOKEN"
              # sed ensures a final newline, so the resume token starts its own line.
              tail -n 200 "$f" | sed -e '$a\'
              echo "::$TOKEN::"
              echo "::endgroup::"
            done
            echo ""
          fi
        fi

        if [ "$UPLOAD_FAILURE_REPORTS" = "true" ]; then
          echo "📦 Execution reports will be uploaded as artifact: $ARTIFACT_NAME"
          echo ""
          echo "To debug this failure:"
          echo "  1. Download the '$ARTIFACT_NAME' artifact from this workflow run"
          if [ -n "$REPORTS_DIR" ]; then
            echo "  2. Check $REPORTS_DIR/ for notebook execution logs"
          else
            echo "  2. The artifact holds no reports directory for builder '$BUILDER'; check the build log above"
          fi
          echo "  3. Check $OUTPUT_DIR/_build/.jupyter_cache/ for cached notebook states"
          echo ""
        else
          echo "💡 Tip: Enable 'upload-failure-reports: true' to get execution reports for debugging"
          echo ""
        fi

    - name: Upload execution reports on failure
      if: inputs.upload-failure-reports == 'true' && failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.failure-artifact-name != '' && inputs.failure-artifact-name || format('execution-reports-{0}', inputs.builder) }}
        path: |
          ${{ inputs.output-dir }}/_build/html/reports
          ${{ inputs.output-dir }}/_build/latex/reports
          ${{ inputs.output-dir }}/_build/jupyter/reports
          ${{ inputs.output-dir }}/_build/.jupyter_cache
        if-no-files-found: ignore
        retention-days: 7

    - name: Display Build Info
      if: success()
      shell: bash
      run: |
        echo "::group::Build Summary"
        echo "Builder: ${{ inputs.builder }}"
        echo "Source: ${{ inputs.source-dir }}"
        echo "Output: ${{ steps.build.outputs.build-path }}"
        if [ "${{ inputs.builder }}" = "html" ]; then
          echo "PDF copied to HTML: ${{ inputs.html-copy-pdf }}"
          echo "Notebooks copied to HTML: ${{ inputs.html-copy-notebooks }}"
        fi
        echo "::endgroup::"
        
        echo "::group::Build Artifacts"
        ls -lh ${{ steps.build.outputs.build-path }} || echo "Build directory not found"
        echo "::endgroup::"

branding:
  icon: 'book-open'
  color: 'purple'
