name: 'Deploy Cloudflare'
description: >-
  Publishes a built site to an existing Cloudflare Worker, and proves who can see it before and
  after the deploy: a private site must be behind Cloudflare Access, a public one served to anyone.
author: 'QuantEcon'

# Each description below is copied verbatim into the user manual
# (docs/user/actions/deploy-cloudflare.md) by scripts/generate-docs.py, so it
# is written for a reader. The repository is public: no account details here.
inputs:
  cloudflare-api-token:
    description: >-
      An account-owned Cloudflare API token with Editor on this one Worker, from a repository
      secret such as `secrets.CLOUDFLARE_API_TOKEN`. It can deploy the Worker but not create one,
      so a mistyped `worker-name` fails instead of creating a new Worker that nothing gates. The
      job fails if the token is empty, as it is on runs from forks and by Dependabot.
    required: true
  cloudflare-account-id:
    description: >-
      The ID of the Cloudflare account that owns the Worker, from a repository secret such as
      `secrets.CLOUDFLARE_ACCOUNT_ID`. The job fails if it is empty.
    required: true
  worker-name:
    description: >-
      The Worker to deploy to, one per site: lowercase letters, digits and dashes, not starting or
      ending with a dash, at most 63 characters. It must already exist, with its `workers.dev`
      route on, and, for a private site, already be behind Access.
    required: true
  account-subdomain:
    description: >-
      The account's `workers.dev` subdomain: `my-subdomain` for `*.my-subdomain.workers.dev`, which
      `my-subdomain.workers.dev` also gives. The URLs are built from it, never read from
      wrangler's output.
    required: true
  visibility:
    description: >-
      Who may see the site: `private` or `public`. The site is checked against it before anything
      is uploaded, after the deploy, and on the alias after its upload. `private`: an anonymous
      request must be redirected to the Access login at `team-domain`, which is required. `public`:
      an anonymous request must be served the site, with no redirect to any Access login, and
      `team-domain` must be empty. Leaving it out, or any other value, fails the job.
    required: true
  team-domain:
    description: >-
      The Access team's login domain, `<team>.cloudflareaccess.com`; a bare `<team>` is accepted
      too. Required for a private site, whose every check requires an anonymous request to be
      redirected to exactly this host. Must be empty for a public site, so that a workflow copied
      from a private site fails rather than publish it.
    required: false
    default: ''
  build-dir:
    description: >-
      The directory that holds the built site. The job fails if it is missing or holds no files,
      and warns if it has no `index.html`, since the site's root would then answer 404. A public
      site must hold an `index.html` or a file that is not HTML, for the check to request.
    required: true
  alias:
    description: >-
      Also uploads the same build as a named preview alias, such as `report-2026-08`, for a
      permanent URL beside the production one, which moves with each deploy. Lowercase letters,
      digits and dashes, starting with a letter and not ending with a dash, and
      `<alias>-<worker-name>` must fit in 63 characters. Empty, the default, uploads no alias.
    required: false
    default: ''
  # Kept as an input only so that passing it can fail the job: an input the
  # action does not declare gets nothing but a warning from the runner.
  require-access:
    description: >-
      Removed: use `visibility`. Passing it, with any value, fails the job, with a message that
      says which `visibility` replaces it.
    required: false
    default: ''

outputs:
  deploy-url:
    description: >-
      The production URL, `https://<worker-name>.<account-subdomain>.workers.dev`. Set once the
      deploy succeeds, even if the gate check after it then fails the job.
    value: ${{ steps.deploy.outputs.deploy-url }}
  alias-url:
    description: >-
      The alias's URL, `https://<alias>-<worker-name>.<account-subdomain>.workers.dev`. Empty when
      no `alias` is given, or when its upload failed or did not run.
    value: ${{ steps.alias.outputs.alias-url }}
  visibility:
    description: >-
      Who the site is checked as visible to: `private` or `public`, as `visibility` gives it. Set
      once every input is valid, even if a check then fails the job. Empty when an input is
      rejected.
    value: ${{ steps.inputs.outputs.visibility }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      id: inputs
      shell: bash
      env:
        API_TOKEN: ${{ inputs.cloudflare-api-token }}
        ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        WORKER_NAME: ${{ inputs.worker-name }}
        ACCOUNT_SUBDOMAIN: ${{ inputs.account-subdomain }}
        TEAM_DOMAIN: ${{ inputs.team-domain }}
        BUILD_DIR: ${{ inputs.build-dir }}
        ALIAS: ${{ inputs.alias }}
        VISIBILITY: ${{ inputs.visibility }}
        REQUIRE_ACCESS: ${{ inputs.require-access }}
      run: |
        set -euo pipefail
        # shellcheck source=scripts/workflow-command.sh
        . "$GITHUB_ACTION_PATH/../scripts/workflow-command.sh"
        fail() { annotate error "$1"; exit 1; }
        label='^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'

        # Every input but the two secrets is one value, and a line break in one
        # would end the line that prints it, and could start a workflow command
        # (#267), or, in build-dir, write another key to GITHUB_OUTPUT below.
        # The secrets are never printed, and neither is require-access, which
        # is refused below whatever it holds.
        single_line "worker-name=$WORKER_NAME" "account-subdomain=$ACCOUNT_SUBDOMAIN" \
          "visibility=$VISIBILITY" "team-domain=$TEAM_DOMAIN" "build-dir=$BUILD_DIR" \
          "alias=$ALIAS" || exit 1

        # Who may see the site comes first, so that the log's first line says
        # it (#177). visibility replaced require-access, which is refused
        # whatever its value: no input turns the checks off, and a site is
        # never taken to be private because nothing said otherwise.
        [ -z "$REQUIRE_ACCESS" ] \
          || fail "require-access has been removed: use visibility. For require-access: 'true', set visibility: private. For require-access: 'false', set visibility: public and remove team-domain if the site is public, or visibility: private if it is behind Access."
        case "$VISIBILITY" in
          private|public) mode=$VISIBILITY ;;
          '') fail "visibility is required: set it to private, for a site behind Access, or public." ;;
          *) fail "visibility must be private or public, got [$VISIBILITY]." ;;
        esac

        # Each kind of site refuses the other's team-domain, so a workflow
        # copied from one kind to the other fails here.
        team=""
        if [ "$mode" = public ]; then
          [ -z "$TEAM_DOMAIN" ] || fail "team-domain is set, but visibility is public — did you mean private?"
        elif [ -z "$TEAM_DOMAIN" ]; then
          fail "visibility is private, so team-domain is required."
        else
          team=$(printf '%s' "$TEAM_DOMAIN" | tr '[:upper:]' '[:lower:]')
          team=${team#https://}; team=${team%/}
          [[ "$team" == *.* ]] || team="$team.cloudflareaccess.com"
          [[ "$team" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?\.cloudflareaccess\.com$ ]] \
            || fail "team-domain [$TEAM_DOMAIN] is not an Access login domain (<team>.cloudflareaccess.com)."
        fi

        case "$mode" in
          private) echo "🔒 PRIVATE site, gated by $team" ;;
          public)  echo "🌐 PUBLIC site, served anonymously" ;;
        esac

        # Secrets are empty, not absent, on fork and Dependabot runs.
        [ -n "$API_TOKEN" ] || fail "cloudflare-api-token is empty. Secrets are not passed to workflows triggered from forks or by Dependabot."
        [ -n "$ACCOUNT_ID" ] || fail "cloudflare-account-id is empty."

        [[ "$WORKER_NAME" =~ $label ]] \
          || fail "worker-name [$WORKER_NAME] is not a valid workers.dev hostname label (lowercase letters, digits and dashes, at most 63 characters)."

        subdomain=$(printf '%s' "$ACCOUNT_SUBDOMAIN" | tr '[:upper:]' '[:lower:]')
        subdomain=${subdomain#https://}; subdomain=${subdomain%/}; subdomain=${subdomain%.workers.dev}
        [[ "$subdomain" =~ $label ]] \
          || fail "account-subdomain [$ACCOUNT_SUBDOMAIN] is not a workers.dev subdomain; pass the part before .workers.dev."

        if [ -n "$ALIAS" ]; then
          # Cloudflare's rule; wrangler does not check it before uploading.
          [[ "$ALIAS" =~ ^[a-z]([a-z0-9-]*[a-z0-9])?$ ]] \
            || fail "alias [$ALIAS] must be lowercase letters, digits and dashes, start with a letter and not end with a dash (e.g. report-2026-08, not 2026-08)."
          [ $(( ${#ALIAS} + 1 + ${#WORKER_NAME} )) -le 63 ] \
            || fail "alias [$ALIAS] is too long: [$ALIAS-$WORKER_NAME] must fit in one 63-character hostname label."
        fi

        [ -d "$BUILD_DIR" ] || fail "build-dir [$BUILD_DIR] is not a directory."
        BUILD_DIR=$(cd "$BUILD_DIR" && pwd -P)
        [ -n "$(find "$BUILD_DIR" -type f -print -quit)" ] || fail "build-dir [$BUILD_DIR] contains no files."

        # One real non-HTML file to probe besides the root, so a gate that
        # covers only the document root cannot pass (the pilot's
        # data/latest.json check). Deterministic, URL-safe paths only, so no
        # encoding is needed. Dotfiles and the _headers/_redirects/_worker.js
        # names are skipped to keep the choice predictable: wrangler does not
        # serve the control files, and a gated site redirects every path
        # anyway. `awk` reads to the end rather than exiting early, which under
        # pipefail would fail on sort's SIGPIPE.
        probe_path=$(cd "$BUILD_DIR" && find . -type f ! -path '*/.*' ! -iname '*.html' ! -iname '*.htm' \
            ! -name '_headers' ! -name '_redirects' ! -name '_worker.js' -print \
          | LC_ALL=C sort \
          | awk '!found && /^\.\/[A-Za-z0-9._~\/-]+$/ { print substr($0, 2); found = 1 }' || true)

        # Without an index.html the root answers 404 even when the site is
        # served, so a public site's checks after the deploy rest on the file
        # alone, and need one. The check before the deploy still requests the
        # root, where a 404 passes as "not behind Access".
        probe_root=true
        if [ ! -f "$BUILD_DIR/index.html" ]; then
          if [ "$mode" != public ]; then
            echo "::warning::build-dir has no index.html, so the site root will answer 404 once past the Access login."
          elif [ -n "$probe_path" ]; then
            probe_root=false
            annotate warning "build-dir has no index.html, so the site root will answer 404. After the deploy only $probe_path is checked, not the root."
          else
            fail "build-dir has no index.html and no file that is not HTML, so nothing could show that the public site is served. Add an index.html."
          fi
        fi

        deploy_url="https://${WORKER_NAME}.${subdomain}.workers.dev"
        # Every version and alias is served at <prefix>-<worker>.<subdomain>.workers.dev.
        preview_suffix="-${WORKER_NAME}.${subdomain}.workers.dev"
        alias_url=""
        [ -z "$ALIAS" ] || alias_url="https://${ALIAS}-${WORKER_NAME}.${subdomain}.workers.dev"

        {
          echo "mode=$mode"
          echo "visibility=$mode"
          echo "team-domain=$team"
          echo "build-dir=$BUILD_DIR"
          echo "probe-path=$probe_path"
          echo "probe-root=$probe_root"
          echo "deploy-url=$deploy_url"
          echo "preview-suffix=$preview_suffix"
          echo "alias-url=$alias_url"
        } >> "$GITHUB_OUTPUT"

        echo "Worker:      $WORKER_NAME"
        echo "Production:  $deploy_url"
        [ -z "$alias_url" ] || echo "Alias:       $alias_url"
        [ -z "$team" ] || echo "Access team: $team"
        echo "Probe paths: / ${probe_path:-(no non-HTML file in build-dir)}"

    # Prevention, not detection. Before anything is uploaded, a private site's
    # Worker must already answer an anonymous request with a redirect to this
    # team's login. That refuses a Worker that does not exist (a mistyped name,
    # which a broader token than the manual's would otherwise create, ungated),
    # one that is public, and one gated by the wrong Access organisation.
    #
    # A public site's Worker must not be behind any Access, which refuses a
    # mix-up before it overwrites anything: a private site's Worker named by
    # mistake, or a public declaration for a site that is gated. A 404 passes
    # here, because the version live now need not hold this build's files; a
    # Worker that does not exist then fails at wrangler deploy, since the
    # manual's token cannot create one.
    #
    # It has no condition: every deploy is checked, and a mode that somehow
    # came out empty fails here rather than skip the check.
    - name: Check who can see the site before deploying
      id: gate-before
      shell: bash
      env:
        MODE: ${{ steps.inputs.outputs.mode }}
        TEAM: ${{ steps.inputs.outputs.team-domain }}
        URL: ${{ steps.inputs.outputs.deploy-url }}
        PROBE_PATH: ${{ steps.inputs.outputs.probe-path }}
      run: |
        set -uo pipefail
        check="$GITHUB_ACTION_PATH/../scripts/check-access-gate.sh"
        checklist="https://github.com/QuantEcon/actions/blob/main/docs/user/actions/deploy-cloudflare.md#setup-checklist"
        urls=("$URL/")
        [ -z "$PROBE_PATH" ] || urls+=("$URL$PROBE_PATH")
        case "$MODE" in
          private)
            bash "$check" "$TEAM" "${urls[@]}" && exit 0
            echo "::error::Refusing to deploy: $URL is not behind Access for $TEAM. Nothing was uploaded. An admin must create the Worker and turn Access on (All traffic) before its first deploy; see the setup checklist at $checklist"
            ;;
          public)
            bash "$check" --public --allow-404 "${urls[@]}" && exit 0
            echo "::error::Refusing to deploy: visibility is public, but $URL did not answer an anonymous request as a public site (see above). Nothing was uploaded. If it is behind Access, check worker-name, then either turn Access off for the Worker or set visibility: private and team-domain; see the setup checklist at $checklist"
            ;;
          *)
            echo "::error::Unknown mode [$MODE]; refusing to deploy unchecked."
            ;;
        esac
        exit 1

    - name: Check for Node.js 22 or later
      id: node
      shell: bash
      run: |
        major=0
        if command -v node >/dev/null 2>&1; then
          v=$(node --version); major=${v#v}; major=${major%%.*}
          echo "Found node $v"
        fi
        # wrangler refuses to run below 22. The QuantEcon images carry 24.
        if [ "$major" -ge 22 ] 2>/dev/null; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "Node.js 22+ not found; installing 24"
        fi

    - name: Set up Node.js
      if: steps.node.outputs.ok != 'true'
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false

    # Exact version from the committed lockfile, integrity-checked across the
    # whole dependency tree; Dependabot proposes bumps (#105). Installed outside
    # the workspace so nothing lands in the consumer's checkout.
    - name: Install wrangler
      id: wrangler
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/deploy-cloudflare"
        mkdir -p "$dir"
        cp "$GITHUB_ACTION_PATH/package.json" "$GITHUB_ACTION_PATH/package-lock.json" "$dir/"
        npm ci --prefix "$dir" --no-audit --no-fund
        "$dir/node_modules/.bin/wrangler" --version
        echo "bin=$dir/node_modules/.bin/wrangler" >> "$GITHUB_OUTPUT"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    # Generated per run, not committed per repo; see write-config.js.
    - name: Write the Worker config
      id: config
      shell: bash
      env:
        CONFIG: ${{ steps.wrangler.outputs.dir }}/${{ inputs.worker-name }}.wrangler.jsonc
        WORKER_NAME: ${{ inputs.worker-name }}
        BUILD_DIR: ${{ steps.inputs.outputs.build-dir }}
      run: |
        set -euo pipefail
        node "$GITHUB_ACTION_PATH/write-config.js" "$CONFIG" "$WORKER_NAME" "$BUILD_DIR"
        cat "$CONFIG"
        echo "path=$CONFIG" >> "$GITHUB_OUTPUT"

    # wrangler's output is teed, never captured into a variable, so its errors
    # reach the log as they happen. #105 is what capturing under pipefail does:
    # the step aborts at the assignment and the output is never printed.
    - name: Deploy to production
      id: deploy
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        WRANGLER_SEND_METRICS: 'false'
        CI: 'true'
        WRANGLER: ${{ steps.wrangler.outputs.bin }}
        CONFIG: ${{ steps.config.outputs.path }}
        LOG: ${{ steps.wrangler.outputs.dir }}/${{ inputs.worker-name }}.deploy.log
        DEPLOY_URL: ${{ steps.inputs.outputs.deploy-url }}
        PREVIEW_SUFFIX: ${{ steps.inputs.outputs.preview-suffix }}
      run: |
        set -uo pipefail
        message="${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7} run ${GITHUB_RUN_ID}"; message=${message:0:100}
        # The runner starts this script with `bash -e`, which would end it at a
        # failing pipeline, before the status and version id are read.
        set +e
        "$WRANGLER" deploy --config "$CONFIG" --message "$message" 2>&1 | tee "$LOG"
        status=${PIPESTATUS[0]}
        set -e

        # preview_urls: true gives every version its own preview URL,
        # https://<first 8 of the version id>-<worker>.<subdomain>.workers.dev,
        # which the check below must cover too. Read from the log, unlike the
        # URLs this action hands out, because it is only ever probed: if the
        # line is missing the check fails closed rather than skipping it.
        version=$(sed -n 's/.*Current Version ID: \([0-9a-f]\{8\}\)[0-9a-f-]*.*/\1/p' "$LOG" | tail -n 1)
        [ -z "$version" ] || echo "version-preview-url=https://${version}${PREVIEW_SUFFIX}" >> "$GITHUB_OUTPUT"

        if [ "$status" -ne 0 ]; then
          echo "::error::wrangler deploy failed (exit $status); see its output above. It can fail after the new version is already live, so the site is checked anyway. A permissions error usually means the token lacks Editor on this Worker."
          exit 1
        fi
        echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        echo "✅ Deployed $DEPLOY_URL"

    # A regression guard for production (the pilot showed Access survives a
    # redeploy, and the check before deploying already proved it), and the only
    # check of the new version's own preview URL, which a gate on the production
    # hostname alone would leave public. It also runs when wrangler failed,
    # because wrangler can exit non-zero after the new version is already live.
    # For a public site it is the check that the new build is served, now
    # that its files are live.
    - name: Check who can see the site after deploying
      id: gate-after
      if: ${{ !cancelled() && steps.gate-before.outcome == 'success' && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
      shell: bash
      env:
        MODE: ${{ steps.inputs.outputs.mode }}
        TEAM: ${{ steps.inputs.outputs.team-domain }}
        URL: ${{ steps.inputs.outputs.deploy-url }}
        PROBE_PATH: ${{ steps.inputs.outputs.probe-path }}
        PROBE_ROOT: ${{ steps.inputs.outputs.probe-root }}
        DEPLOY: ${{ steps.deploy.outcome }}
        VERSION_URL: ${{ steps.deploy.outputs.version-preview-url }}
      run: |
        set -uo pipefail
        check="$GITHUB_ACTION_PATH/../scripts/check-access-gate.sh"
        failed=0
        urls=()
        for base in "$URL" ${VERSION_URL:+"$VERSION_URL"}; do
          [ "$PROBE_ROOT" != true ] || urls+=("$base/")
          [ -z "$PROBE_PATH" ] || urls+=("$base$PROBE_PATH")
        done
        if [ -z "$VERSION_URL" ]; then
          # wrangler prints the id only after every post-upload step succeeds,
          # so a deploy that failed after going live usually lacks it too.
          if [ "$MODE" = private ]; then
            echo "::error::wrangler's output named no 'Current Version ID', so the new version's preview URL could not be checked. Treat it as public until verified by hand with scripts/check-access-gate.sh."
          else
            echo "::error::wrangler's output named no 'Current Version ID', so the new version's preview URL could not be checked."
          fi
          failed=1
        fi
        case "$MODE" in
          private)
            if ! bash "$check" "$TEAM" "${urls[@]}"; then
              echo "::error::A hostname serving this Worker is NOT behind Access for $TEAM (see above). Treat the site as public until this is fixed: turn Access on for the Worker with All traffic, which also covers its preview URLs, or turn off both its workers.dev route and its preview URLs."
              failed=1
            fi
            ;;
          public)
            if ! bash "$check" --public "${urls[@]}"; then
              echo "::error::visibility is public, but a hostname serving this Worker did not serve the new build to an anonymous request (see above). If it redirected to Access, the site is gated: turn Access off for the Worker if it is meant to be public, or set visibility: private. A 404 means the hostname does not serve this build: check the Worker's workers.dev route and preview URLs."
              failed=1
            fi
            ;;
          *)
            echo "::error::Unknown mode [$MODE]."
            failed=1
            ;;
        esac
        exit "$failed"

    - name: Upload preview alias
      id: alias
      if: inputs.alias != ''
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        WRANGLER_SEND_METRICS: 'false'
        CI: 'true'
        WRANGLER: ${{ steps.wrangler.outputs.bin }}
        CONFIG: ${{ steps.config.outputs.path }}
        ALIAS: ${{ inputs.alias }}
        ALIAS_URL: ${{ steps.inputs.outputs.alias-url }}
      run: |
        set -uo pipefail
        message="${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7} run ${GITHUB_RUN_ID}"; message=${message:0:100}
        if ! "$WRANGLER" versions upload --config "$CONFIG" --preview-alias "$ALIAS" --message "$message"; then
          echo "::error::wrangler versions upload failed for alias [$ALIAS]; see its output above. Production is already deployed."
          exit 1
        fi
        echo "alias-url=$ALIAS_URL" >> "$GITHUB_OUTPUT"
        echo "✅ Uploaded $ALIAS_URL"

    # Preview URLs can be gated separately from production, so a gate that
    # covers the Worker but not its previews would expose the alias; and one
    # that covers only previews would gate a public site's alias.
    - name: Check who can see the alias
      id: gate-alias
      if: inputs.alias != ''
      shell: bash
      env:
        MODE: ${{ steps.inputs.outputs.mode }}
        TEAM: ${{ steps.inputs.outputs.team-domain }}
        URL: ${{ steps.inputs.outputs.alias-url }}
        PROBE_PATH: ${{ steps.inputs.outputs.probe-path }}
        PROBE_ROOT: ${{ steps.inputs.outputs.probe-root }}
      run: |
        set -uo pipefail
        check="$GITHUB_ACTION_PATH/../scripts/check-access-gate.sh"
        urls=()
        [ "$PROBE_ROOT" != true ] || urls+=("$URL/")
        [ -z "$PROBE_PATH" ] || urls+=("$URL$PROBE_PATH")
        case "$MODE" in
          private)
            bash "$check" "$TEAM" "${urls[@]}" && exit 0
            echo "::error::The alias is uploaded but $URL is NOT behind Access for $TEAM. Treat it as public until this is fixed: set the Worker's Access to cover previews (All traffic)."
            ;;
          public)
            bash "$check" --public "${urls[@]}" && exit 0
            echo "::error::The alias is uploaded, but visibility is public and $URL did not serve it to an anonymous request (see above). If it redirected to Access, the Worker's previews are gated: turn Access off for the Worker if the site is meant to be public, or set visibility: private."
            ;;
          *)
            echo "::error::Unknown mode [$MODE]."
            ;;
        esac
        exit 1

    # On push, schedule and workflow_dispatch there is no PR to comment on, so
    # the job summary is where the result is read. It runs on failure too:
    # "refused, nothing uploaded" and "deployed, gate failed" need saying.
    - name: Write job summary
      if: always()
      shell: bash
      env:
        WORKER_NAME: ${{ inputs.worker-name }}
        MODE: ${{ steps.inputs.outputs.mode }}
        TEAM: ${{ steps.inputs.outputs.team-domain }}
        DEPLOY_URL: ${{ steps.inputs.outputs.deploy-url }}
        ALIAS_URL: ${{ steps.inputs.outputs.alias-url }}
        INPUTS: ${{ steps.inputs.outcome }}
        GATE_BEFORE: ${{ steps.gate-before.outcome }}
        DEPLOY: ${{ steps.deploy.outcome }}
        VERSION_URL: ${{ steps.deploy.outputs.version-preview-url }}
        GATE_AFTER: ${{ steps.gate-after.outcome }}
        ALIAS: ${{ steps.alias.outcome }}
        GATE_ALIAS: ${{ steps.gate-alias.outcome }}
      run: |
        gate() {
          case "$MODE:$1" in
            public:success)  echo "✅ public, served anonymously" ;;
            public:failure)  echo "🚨 **not served anonymously**, see the step log" ;;
            *:success)       echo "✅ redirects to \`$TEAM\`" ;;
            *:failure)       echo "🚨 **not proven gated**, treat as public" ;;
            *)               echo "not checked" ;;
          esac
        }
        case "$MODE" in
          private) heading="🔒 deploy-cloudflare: \`$WORKER_NAME\`, a PRIVATE site, gated by \`$TEAM\`" ;;
          public)  heading="🌐 deploy-cloudflare: \`$WORKER_NAME\`, a PUBLIC site, served anonymously" ;;
          *)       heading="☁️ deploy-cloudflare: \`$WORKER_NAME\`" ;;
        esac
        {
          echo "### $heading"
          echo
          if [ "$INPUTS" != "success" ]; then
            echo "❌ Inputs rejected, nothing was deployed. See the step log."
          elif [ "$GATE_BEFORE" = "failure" ] && [ "$MODE" = public ]; then
            echo "⛔ **Refused.** $DEPLOY_URL did not answer an anonymous request as a public site, so nothing was uploaded."
          elif [ "$GATE_BEFORE" = "failure" ]; then
            echo "⛔ **Refused.** $DEPLOY_URL is not behind Access for \`$TEAM\`, so nothing was uploaded."
          elif [ "$DEPLOY" = "failure" ]; then
            echo "❌ **wrangler deploy failed.** The new build may already be live; see the step log."
            echo
            echo "Production check after the failure: $(gate "$GATE_AFTER")"
          elif [ "$DEPLOY" != "success" ]; then
            echo "❌ The deploy did not run. See the step log."
          else
            [ "$MODE" = public ] && echo "| | URL | Public |" || echo "| | URL | Access gate |"
            echo "|---|---|---|"
            echo "| Production | $DEPLOY_URL | $(gate "$GATE_AFTER") |"
            [ -z "$VERSION_URL" ] || echo "| This version | $VERSION_URL | $(gate "$GATE_AFTER") |"
            if [ "$ALIAS" = "success" ]; then
              echo "| Alias | $ALIAS_URL | $(gate "$GATE_ALIAS") |"
            elif [ "$ALIAS" = "failure" ]; then
              echo "| Alias | ❌ upload failed | |"
            elif [ -n "$ALIAS_URL" ]; then
              echo "| Alias | not uploaded, an earlier step failed | |"
            fi
          fi
        } >> "$GITHUB_STEP_SUMMARY"

