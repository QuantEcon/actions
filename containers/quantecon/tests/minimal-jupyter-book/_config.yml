title: Test Book
author: QuantEcon
logo: ""

execute:
  # "force", not "off". The point of this fixture is to run the image's Python
  # stack — before #108 it executed nothing at all, so an image whose numpy,
  # matplotlib or kaleido was completely broken still produced a green
  # container test.
  execute_notebooks: "force"
  # Belt and braces with the `-W` that smoke-test.sh passes. myst-nb reports a
  # failed cell as a *warning* by default, so without one of these a raising
  # cell yields a published book and exit 0. Keep BOTH: a typo in this key
  # (e.g. `raise_on_errors`) is accepted silently by jupyter-book's config
  # validator, and `-W` is then the only thing still catching a failing cell.
  raise_on_error: true
  timeout: 300

latex:
  latex_documents:
    targetname: test-book.tex
  latex_engine: xelatex

sphinx:
  config:
    # The theme both images ship and every lecture site builds with. With
    # sphinx_book_theme here, a broken quantecon-book-theme install stayed green.
    html_theme: quantecon_book_theme
    # Deliberately no latex_elements.fontpkg override. Sphinx's default xelatex
    # fontpkg loads the FreeFont faces with Extension=.otf, while Ubuntu ships
    # them as .ttf; the .otf symlinks in both Dockerfiles exist for exactly that.
    # The old `fontpkg: ""` took the TeX-defaults path instead, so a regression
    # in those symlinks could not fail this build.
