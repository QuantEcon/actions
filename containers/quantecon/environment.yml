# Full environment for QuantEcon lectures (maximum compatibility)
# Uses Anaconda metapackage for comprehensive package coverage
# For lean builds, use quantecon-build container instead

name: quantecon
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.13
  - anaconda=2026.07  # Full Anaconda: numpy, scipy, pandas, matplotlib, seaborn, sympy, jupyter, jupyterlab, ipywidgets, networkx, statsmodels, numba, and 400+ more
  - pip
  - pip:
    # Jupyter Book build tools
    - jupyter-book==1.0.4post1
    - quantecon-book-theme==0.22.2
    - sphinx-tojupyter==0.6.0
    - sphinxext-rediraffe==0.3.0
    - sphinx-exercise==1.2.2
    - sphinx-proof==0.4.1
    - sphinxcontrib-youtube==1.5.0
    - sphinx-togglebutton==0.4.5
    - sphinx-reredirects==1.1.0
    - quantecon-book-networks
    # kaleido 1 bundles no browser: it drives the Chrome the Dockerfile installs
    # at /opt/chrome, which it finds through BROWSER_PATH whatever HOME a job
    # sets. Without that Chrome the images held kaleido below 1.0 (#85, #342).
    # Pinned exactly, since it moves with the Chrome it drives: each bump is a
    # pull request whose smoke test exports a figure with the pair.
    - kaleido==1.5.2  # Plotly static image export
