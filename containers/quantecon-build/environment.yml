# Lean environment for QuantEcon lecture builds
# Contains superset of packages used across all QuantEcon lecture series
# Lecture-specific packages (quantecon, wbgapi, jax, etc.) installed from lecture's environment.yml

name: quantecon
channels:
  - defaults
dependencies:
  # Every package below that the anaconda=2026.07 metapackage also pins is pinned
  # to its version there: the Anaconda baseline every QuantEcon lecture repo builds
  # against (they pin `anaconda=2026.07`), and what the full `quantecon` image gets
  # from the metapackage. A package left unpinned moves ahead of that baseline
  # whenever the image is rebuilt, and the drift has broken notebook execution
  # downstream twice: un_insure.md's fsolve call (#28), and plotly 7, which a
  # scheduled rebuild picked up and which cannot export images with the kaleido
  # below (#222).
  # Versions are the anaconda=2026.07 linux-64 py313 (MKL) pins; bump them as a set
  # when the lecture repos move to a newer anaconda release, and keep each one in
  # the conda `ignore` list in .github/dependabot.yml. xlrd, graphviz,
  # python-graphviz and lxml are not in the metapackage, so they have no baseline
  # version and stay unpinned.
  
  # Python
  - python=3.13.14
  
  # Core scientific stack
  - numpy=2.4.6
  - scipy=1.18.0
  - pandas=3.0.3
  - matplotlib=3.11.0
  - seaborn=0.13.2
  - sympy=1.14.0
  - numba=0.65.1
  - networkx=3.6.1
  - statsmodels=0.14.6
  - scikit-learn=1.9.0
  
  # CPU acceleration (Intel MKL for optimized linear algebra)
  - mkl=2025.0.0
  - mkl-service=2.7.2
  
  # Jupyter ecosystem
  - jupyter=1.1.1
  - jupyterlab=4.5.9
  - ipywidgets=8.1.7
  - ipykernel=6.31.0
  - notebook=7.5.7
  
  # Data handling
  - xlrd
  - openpyxl=3.1.5
  - pytables=3.11.1
  - h5py=3.16.0
  
  # Visualization
  - plotly=6.7.0
  - graphviz
  - python-graphviz
  
  # Utilities
  - requests=2.34.2
  - beautifulsoup4=4.15.0
  - lxml
  - pyyaml=6.0.3
  
  - pip=26.1.2
  - pip:
    # Jupyter Book build tools
    - jupyter-book>=1.0.4post1,<2.0
    - quantecon-book-theme>=0.22.2
    - sphinx-tojupyter>=0.6.0
    - sphinxext-rediraffe>=0.3.0
    - sphinx-exercise>=1.2.1
    - sphinx-proof>=0.4.0
    - sphinxcontrib-youtube>=1.5.0
    - sphinx-togglebutton>=0.4.5
    - sphinx-reredirects>=1.1.0
    - quantecon-book-networks
    
    # Additional build dependencies
    # Pinned <1.0: kaleido v1 dropped the bundled chromium and needs a separately
    # provisioned Chrome, which isn't found at runtime in CI (container jobs set
    # HOME=/github/home, not the build-time /root). v0.2.x bundles its own
    # chromium (location-independent) and works with plotly 6, not 7: plotly 7
    # exports images only with kaleido>=1, which is why plotly is pinned above (#222).
    - kaleido<1.0  # Plotly static image export
    - prettytable
