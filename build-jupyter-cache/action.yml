name: 'Build Jupyter Cache'
description: 'Fresh build of all lecture formats and save to GitHub cache (runs on main branch, typically weekly)'
author: 'QuantEcon'

inputs:
  builders:
    description: 'Comma-separated list of builders to run: jupyter, pdflatex, html'
    required: false
    default: 'html'
  environment:
    description: 'Path to environment.yml for full environment (non-container builds)'
    required: false
    default: 'environment.yml'
  environment-update:
    description: 'Path to delta environment.yml for container builds (empty = use pre-installed packages only)'
    required: false
    default: ''
  source-dir:
    description: 'Source directory containing lectures'
    required: false
    default: 'lectures'
  upload-artifact:
    description: 'Upload the _build directory as an artifact when a build fails (for debugging; on success the cache already holds it). Set false to suppress even that.'
    required: false
    default: 'true'
  artifact-retention-days:
    description: 'Number of days to retain the build artifact'
    required: false
    default: '30'
  create-issue-on-failure:
    description: 'Create GitHub issue when build fails'
    required: false
    default: 'true'
  issue-assignees:
    description: 'Comma-separated GitHub usernames to assign to failure issues'
    required: false
    default: ''
  issue-labels:
    description: 'Comma-separated labels for failure issues'
    required: false
    default: 'build-failure,automated'
  upload-failure-reports:
    description: >-
      Pass upload-failure-reports through to the inner build-lectures calls, so a
      failed build uploads its execution-report artifact. Defaults to true here,
      unlike build-lectures' own default of false: that action is usually driven by
      a human watching a PR, whereas this one runs unattended (typically weekly),
      and the auto-filed failure issue tells the maintainer to go read a report.
      Set to false if re-uploading reports on every failure is too costly.
    required: false
    default: 'true'

outputs:
  cache-saved:
    description: 'Whether new cache was saved (only true if all builds passed)'
    value: ${{ steps.status.outputs.all-passed }}
  build-success:
    description: >-
      Whether the cache build succeeded. 'true' only if every requested build
      passed; 'false' for anything else, including a run that aborted during
      setup before any build started (it used to be empty in that case, which
      no caller could distinguish from success — see #123).
    value: ${{ steps.status.outputs.all-passed }}
  cache-key:
    description: 'The cache key used for saving'
    value: ${{ steps.cache-key.outputs.key }}
  jupyter-status:
    description: 'Status of jupyter build (success/failure/skipped)'
    value: ${{ steps.verify-builds.outputs.jupyter-status }}
  pdflatex-status:
    description: 'Status of pdflatex build (success/failure/skipped)'
    value: ${{ steps.verify-builds.outputs.pdflatex-status }}
  html-status:
    description: 'Status of html build (success/failure/skipped)'
    value: ${{ steps.verify-builds.outputs.html-status }}
  failure-issue-url:
    description: 'URL of the failure issue filed or commented on (empty when no failure, or alerting disabled)'
    value: ${{ steps.create-failure-issue.outputs.issue-url }}

runs:
  using: "composite"
  steps:
    # ============================================================
    # SETUP
    # ============================================================
    
    - name: Generate cache key
      id: cache-key
      shell: bash
      run: |
        # Include both environment files in hash for cache key stability
        # hashFiles returns empty string for non-existent files, which is fine
        ENV_HASH="${{ hashFiles(inputs.environment) }}"
        UPDATE_HASH="${{ hashFiles(inputs.environment-update) }}"
        KEY="build-${ENV_HASH}-${UPDATE_HASH}-${{ github.run_id }}"
        echo "key=$KEY" >> $GITHUB_OUTPUT
        echo "Cache key: $KEY"

    - name: Validate builders input
      id: validate-builders
      shell: bash
      run: |
        BUILDERS="${{ inputs.builders }}"
        
        # Check at least one valid builder is specified
        if [[ ! "$BUILDERS" == *"jupyter"* ]] && [[ ! "$BUILDERS" == *"pdflatex"* ]] && [[ ! "$BUILDERS" == *"html"* ]]; then
          echo "::error::No valid builders specified. Must include at least one of: jupyter, pdflatex, html"
          echo "::error::Received: '$BUILDERS'"
          exit 1
        fi
        echo "✅ Valid builders input: $BUILDERS"

    - name: Parse builders input
      id: parse-builders
      shell: bash
      run: |
        BUILDERS="${{ inputs.builders }}"
        
        # Check which builders are requested
        if [[ "$BUILDERS" == *"jupyter"* ]]; then
          echo "run-jupyter=true" >> $GITHUB_OUTPUT
        else
          echo "run-jupyter=false" >> $GITHUB_OUTPUT
        fi
        
        if [[ "$BUILDERS" == *"pdflatex"* ]]; then
          echo "run-pdflatex=true" >> $GITHUB_OUTPUT
        else
          echo "run-pdflatex=false" >> $GITHUB_OUTPUT
        fi
        
        if [[ "$BUILDERS" == *"html"* ]]; then
          echo "run-html=true" >> $GITHUB_OUTPUT
        else
          echo "run-html=false" >> $GITHUB_OUTPUT
        fi
        
        echo "Builders requested: $BUILDERS"
        echo "  jupyter: $(if [[ "$BUILDERS" == *"jupyter"* ]]; then echo yes; else echo no; fi)"
        echo "  pdflatex: $(if [[ "$BUILDERS" == *"pdflatex"* ]]; then echo yes; else echo no; fi)"
        echo "  html: $(if [[ "$BUILDERS" == *"html"* ]]; then echo yes; else echo no; fi)"

    # ============================================================
    # ENVIRONMENT SETUP
    # ============================================================
    
    - name: Setup environment
      id: setup-env
      uses: quantecon/actions/setup-environment@v0
      with:
        environment: ${{ inputs.environment }}
        environment-update: ${{ inputs.environment-update }}
        install-latex: ${{ steps.parse-builders.outputs.run-pdflatex }}

    # ============================================================
    # BUILD ALL REQUESTED FORMATS
    # Each build uses continue-on-error so we can check all results
    # ============================================================
    
    - name: Build notebooks (jupyter)
      id: build-jupyter
      if: steps.parse-builders.outputs.run-jupyter == 'true'
      continue-on-error: true
      uses: quantecon/actions/build-lectures@v0
      with:
        builder: 'jupyter'
        source-dir: ${{ inputs.source-dir }}
        upload-failure-reports: ${{ inputs.upload-failure-reports }}

    - name: Build PDF (pdflatex)
      id: build-pdflatex
      if: steps.parse-builders.outputs.run-pdflatex == 'true'
      continue-on-error: true
      uses: quantecon/actions/build-lectures@v0
      with:
        builder: 'pdflatex'
        source-dir: ${{ inputs.source-dir }}
        upload-failure-reports: ${{ inputs.upload-failure-reports }}

    - name: Build HTML
      id: build-html
      if: steps.parse-builders.outputs.run-html == 'true'
      continue-on-error: true
      uses: quantecon/actions/build-lectures@v0
      with:
        builder: 'html'
        source-dir: ${{ inputs.source-dir }}
        upload-failure-reports: ${{ inputs.upload-failure-reports }}
        html-copy-pdf: ${{ steps.parse-builders.outputs.run-pdflatex }}
        html-copy-notebooks: ${{ steps.parse-builders.outputs.run-jupyter }}

    # ============================================================
    # VERIFY ALL BUILDS SUCCEEDED
    # ============================================================
    
    - name: Verify all builds succeeded
      id: verify-builds
      shell: bash
      run: |
        echo ""
        echo "╔════════════════════════════════════════════════════════════════╗"
        echo "║                    BUILD VERIFICATION                          ║"
        echo "╚════════════════════════════════════════════════════════════════╝"
        echo ""
        
        ALL_PASSED=true
        
        # Check jupyter build
        if [ "${{ steps.parse-builders.outputs.run-jupyter }}" = "true" ]; then
          if [ "${{ steps.build-jupyter.outcome }}" = "success" ]; then
            echo "  ✅ jupyter: passed"
            echo "jupyter-status=success" >> $GITHUB_OUTPUT
          else
            echo "  ❌ jupyter: FAILED"
            echo "jupyter-status=failure" >> $GITHUB_OUTPUT
            ALL_PASSED=false
          fi
        else
          echo "  ⏭️  jupyter: skipped"
          echo "jupyter-status=skipped" >> $GITHUB_OUTPUT
        fi
        
        # Check pdflatex build
        if [ "${{ steps.parse-builders.outputs.run-pdflatex }}" = "true" ]; then
          if [ "${{ steps.build-pdflatex.outcome }}" = "success" ]; then
            echo "  ✅ pdflatex: passed"
            echo "pdflatex-status=success" >> $GITHUB_OUTPUT
          else
            echo "  ❌ pdflatex: FAILED"
            echo "pdflatex-status=failure" >> $GITHUB_OUTPUT
            ALL_PASSED=false
          fi
        else
          echo "  ⏭️  pdflatex: skipped"
          echo "pdflatex-status=skipped" >> $GITHUB_OUTPUT
        fi
        
        # Check html build
        if [ "${{ steps.parse-builders.outputs.run-html }}" = "true" ]; then
          if [ "${{ steps.build-html.outcome }}" = "success" ]; then
            echo "  ✅ html: passed"
            echo "html-status=success" >> $GITHUB_OUTPUT
          else
            echo "  ❌ html: FAILED"
            echo "html-status=failure" >> $GITHUB_OUTPUT
            ALL_PASSED=false
          fi
        else
          echo "  ⏭️  html: skipped"
          echo "html-status=skipped" >> $GITHUB_OUTPUT
        fi
        
        echo ""
        echo "════════════════════════════════════════════════════════════════════"
        
        if [ "$ALL_PASSED" = "true" ]; then
          echo "  ✅ ALL BUILDS PASSED - Cache will be saved"
          echo "all-passed=true" >> $GITHUB_OUTPUT
        else
          echo "  ❌ SOME BUILDS FAILED - Cache will NOT be saved"
          echo "  Existing cache preserved for PR workflows"
          echo "all-passed=false" >> $GITHUB_OUTPUT
        fi

        echo ""

    # ============================================================
    # RESOLVE OVERALL STATUS
    # ============================================================

    # Single source of truth for "did this run succeed?". Every guard below
    # reads THIS step, not verify-builds, and the distinction is the whole
    # point of #123.
    #
    # verify-builds has no `if:` at all, and a composite step without `always()`
    # is skipped once an earlier step has failed. So any earlier failure —
    # `Setup environment`, or the input validation above it — skips
    # verify-builds entirely and leaves all-passed as '', not 'false'. (The
    # steps further down that DO carry an `if:` have the same problem for the
    # same reason: a written condition gains an implicit success() on top of
    # whatever it says.) The guards below used to test `== 'false'`, so on that
    # path ALL of them skipped: no issue was filed, the postcondition assert
    # never fired, and the only red was the aborting step itself. For an
    # unattended weekly build that is the same silence #83 was about.
    #
    # Resolving '' to 'false' here makes the failure path fail SAFE — it alerts
    # on any abort, not only on the ones that were anticipated. That is why the
    # guards below test `!= 'true'` rather than `== 'false'`: a value nobody
    # wrote must not read as success.
    - name: Resolve overall status
      id: status
      if: always()
      shell: bash
      env:
        VERIFIED: ${{ steps.verify-builds.outputs.all-passed }}
        SETUP_OUTCOME: ${{ steps.setup-env.outcome }}
      run: |
        # phase names which part of the composite decided the outcome, so the
        # failure issue and the summary can say "no lecture was ever built"
        # instead of pointing a maintainer at lectures that never ran.
        if [ -n "$VERIFIED" ]; then
          PHASE=build
        elif [ "$SETUP_OUTCOME" = "failure" ]; then
          PHASE=setup
        else
          PHASE=pre-build
        fi

        echo "all-passed=${VERIFIED:-false}" >> $GITHUB_OUTPUT
        echo "phase=$PHASE" >> $GITHUB_OUTPUT
        echo "Overall status: all-passed=${VERIFIED:-false} (decided in phase: $PHASE)"

    # ============================================================
    # SAVE CACHE (only if all builds passed)
    # ============================================================

    - name: Save build cache
      if: steps.status.outputs.all-passed == 'true'
      uses: actions/cache/save@v6
      with:
        path: _build
        key: ${{ steps.cache-key.outputs.key }}

    - name: Save execution cache
      if: steps.status.outputs.all-passed == 'true'
      uses: actions/cache/save@v6
      with:
        path: _build/.jupyter_cache
        key: jupyter-cache-${{ hashFiles(format('{0}/**/*.md', inputs.source-dir)) }}-${{ github.run_id }}

    # ============================================================
    # UPLOAD ARTIFACT
    # ============================================================
    
    - name: Upload build artifact (on failure, for debugging)
      id: upload-artifact
      # On success the GHA cache already holds _build, so skip the redundant
      # 30-day artifact; only upload when a build failed (the cache is not saved
      # then), making the artifact the sole copy for debugging.
      #
      # The bare `if:` (implicit success()) is deliberate and stays: when the
      # composite aborted during setup there is no _build to upload. The failure
      # issue therefore keys its artifact list off this step's `artifact-id`
      # output rather than off inputs.upload-artifact. Not off the step's
      # outcome either: `if-no-files-found: warn` lets the step SUCCEED having
      # uploaded nothing, whereas artifact-id is empty in that case as well as
      # when the step is skipped. So the issue never names an artifact that was
      # not produced.
      if: inputs.upload-artifact == 'true' && steps.status.outputs.all-passed != 'true'
      uses: actions/upload-artifact@v7
      with:
        name: build-cache-${{ github.run_id }}
        path: _build
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: warn

    # ============================================================
    # CREATE ISSUE ON FAILURE
    # ============================================================
    
    # Filed via actions/github-script (octokit/REST), not the gh CLI, and not a
    # script reached through github.action_path. That combination caused three
    # independent silent failures on this 14-line path (#83):
    #
    #   1. `${{ github.action_path }}/scripts/...` expands to the RUNNER's path
    #      (/home/runner/work/_actions/...). In a `container:` job the action is
    #      mounted at /__w/_actions/..., so bash got a path that does not exist:
    #      "No such file or directory", exit 127, before the script ever ran.
    #      (actions/runner#2185. Note $GITHUB_ACTION_PATH does NOT have this
    #      problem — env values are translated in StepHost.TranslateToContainerPath
    #      — which is why the preview actions' use of it is correct.)
    #   2. Neither container image installs `gh`, so fixing (1) alone would have
    #      died one line later on `gh issue list`.
    #   3. `gh issue create --label` validates labels client-side and fails if
    #      they don't exist. No consumer has `build-failure` or `automated`, so
    #      even a hosted runner with gh would have failed. The REST API creates
    #      missing labels implicitly.
    #
    # always() because this step must run even though a preceding step failed —
    # a composite step's plain `if:` carries an implicit success(), which is what
    # made the artifact upload above able to skip alerting entirely.
    - name: Create failure issue
      id: create-failure-issue
      if: always() && steps.status.outputs.all-passed != 'true' && inputs.create-issue-on-failure == 'true'
      uses: actions/github-script@v9
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        ISSUE_LABELS: ${{ inputs.issue-labels }}
        ISSUE_ASSIGNEES: ${{ inputs.issue-assignees }}
        JUPYTER_STATUS: ${{ steps.verify-builds.outputs.jupyter-status }}
        PDFLATEX_STATUS: ${{ steps.verify-builds.outputs.pdflatex-status }}
        HTML_STATUS: ${{ steps.verify-builds.outputs.html-status }}
        FAILURE_PHASE: ${{ steps.status.outputs.phase }}
        # artifact-id, not the step's outcome: `if-no-files-found: warn` means
        # the step also succeeds when it uploaded nothing at all. The output is
        # documented as empty unless an artifact was really created, and it is
        # empty for a skipped step too, which is the case that matters here.
        ARTIFACT_UPLOADED: ${{ steps.upload-artifact.outputs.artifact-id != '' }}
        UPLOAD_FAILURE_REPORTS: ${{ inputs.upload-failure-reports }}
      with:
        github-token: ${{ github.token }}
        script: |
          // Consumer-supplied values are read from env, never interpolated into
          // this script body (same discipline as the preview actions).
          const sourceDir = process.env.SOURCE_DIR || 'lectures';
          const labels = (process.env.ISSUE_LABELS || '')
            .split(',').map(s => s.trim()).filter(Boolean);
          const assignees = (process.env.ISSUE_ASSIGNEES || '')
            .split(',').map(s => s.trim()).filter(Boolean);
          // 'not run' is distinct from 'skipped' on purpose. verify-builds
          // writes 'skipped' for a builder that was considered and not
          // requested; an empty value means verify-builds never ran, so the
          // builder was never considered at all.
          const status = {
            jupyter: process.env.JUPYTER_STATUS || 'not run',
            pdflatex: process.env.PDFLATEX_STATUS || 'not run',
            html: process.env.HTML_STATUS || 'not run',
          };
          const icon = s => ({
            success: '✅ success', failure: '❌ failure', skipped: '⏭️ skipped',
          }[s] || '⚪ not run');

          // Which part of the composite decided the outcome. On anything other
          // than 'build' every row of the table below reads 'not run', which is
          // accurate but easy to misread, so say plainly that no lecture ever
          // ran — otherwise this issue looks like a lecture bug when the cause
          // was the environment.
          const phase = process.env.FAILURE_PHASE || 'build';
          const phaseLabel = {
            build: 'the lecture builds',
            setup: 'environment setup — no lecture was built',
            'pre-build': 'input validation, before environment setup — no lecture was built',
          }[phase] || phase;

          const { owner, repo } = context.repo;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;

          // Reproduce commands must match build-lectures' own builder flags.
          const repro = {
            html: `jb build ${sourceDir} -W --keep-going`,
            pdflatex: `jb build ${sourceDir} --builder pdflatex -n -W --keep-going`,
            jupyter: `jb build ${sourceDir} --builder=custom --custom-builder=jupyter -n -W --keep-going`,
          };
          const failed = Object.keys(status).filter(k => status[k] === 'failure');

          // Name the artifacts rather than saying "download the build artifact".
          // Both lists are gated on something that PRODUCED an artifact, not on
          // the input that asked for one: a run that aborted before any build
          // uploads nothing, and an issue naming a nonexistent artifact sends
          // the maintainer looking for a download that is not there.
          const artifacts = [];
          if (process.env.UPLOAD_FAILURE_REPORTS === 'true') {
            for (const b of failed) artifacts.push(`\`execution-reports-${b}\` — \`reports/*.err.log\` tracebacks for the ${b} build`);
          }
          if (process.env.ARTIFACT_UPLOADED === 'true') {
            artifacts.push(`\`build-cache-${context.runId}\` — the whole \`_build\` tree (large; includes \`.jupyter_cache\`)`);
          }

          const body = [
            '## 🔴 Jupyter Cache Build Failed',
            '',
            `**Workflow run:** [${context.runId}](${runUrl})`,
            `**Trigger:** ${context.eventName}`,
            `**Branch:** ${process.env.GITHUB_REF_NAME}`,
            `**Commit:** ${context.sha}`,
            `**Failed during:** ${phaseLabel}`,
            '',
            '### Build results',
            '',
            '| Builder | Status |',
            '|---|---|',
            `| jupyter | ${icon(status.jupyter)} |`,
            `| pdflatex | ${icon(status.pdflatex)} |`,
            `| html | ${icon(status.html)} |`,
            '',
            '### Impact',
            '',
            '⚠️ **The existing cache is preserved** — PR workflows keep using the last good cache.',
            '',
            '### Debug',
            '',
            `1. [Workflow logs](${runUrl})`,
            artifacts.length
              ? `2. Artifacts on that run:\n${artifacts.map(a => `   - ${a}`).join('\n')}`
              : '2. No artifacts were uploaded — either nothing was built, or `upload-artifact` and `upload-failure-reports` are both off.',
            failed.length
              ? `3. Reproduce locally:\n\n   \`\`\`bash\n${failed.map(b => `   ${repro[b]}`).join('\n')}\n   \`\`\``
              : phase === 'build'
                ? '3. No builder reported failure — the run failed after the builds, in cache save, artifact upload, or alerting.'
                : '3. Nothing to reproduce locally: no lecture was built. Start from the failing step in the run logs — this is an environment or configuration failure, not a lecture failure.',
            '',
            '---',
            'Filed automatically by `build-jupyter-cache`. Close it once the build is fixed; the next successful run saves a new cache.',
          ].join('\n');

          // Dedupe on the first label, matching the previous behaviour.
          let issue;
          try {
            const existing = labels.length
              ? (await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', labels: labels[0], per_page: 1,
                })).data[0]
              : undefined;

            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              issue = existing;
              core.info(`Commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo,
                title: `🔴 Cache Build Failed - ${new Date().toISOString().slice(0, 10)}`,
                body, labels,
                ...(assignees.length ? { assignees } : {}),
              });
              issue = created.data;
              core.info(`Created issue #${issue.number}`);
            }
          } catch (err) {
            if (err.status === 403 || err.status === 404) {
              core.error(
                'Could not file the failure issue: the token lacks issue permissions. ' +
                'Add `issues: write` to the job\'s `permissions:` block. ' +
                `(${err.status} ${err.message})`);
            }
            throw err;
          }
          core.setOutput('issue-url', issue.html_url);

    # The defect this whole path had was being a silent no-op, so assert the
    # postcondition rather than trusting the step above. This also survives
    # someone later adding continue-on-error to it.
    - name: Verify the failure alert was filed
      if: always() && steps.status.outputs.all-passed != 'true' && inputs.create-issue-on-failure == 'true'
      shell: bash
      env:
        ALERT_OUTCOME: ${{ steps.create-failure-issue.outcome }}
        ISSUE_URL: ${{ steps.create-failure-issue.outputs.issue-url }}
        FAILURE_PHASE: ${{ steps.status.outputs.phase }}
      run: |
        if [ "$ALERT_OUTCOME" != "success" ] || [ -z "$ISSUE_URL" ]; then
          echo "::error::create-issue-on-failure is enabled but no failure issue was filed (alert step outcome=[$ALERT_OUTCOME], issue url=[$ISSUE_URL], failing phase=[$FAILURE_PHASE]). This run's failure would otherwise have gone unreported."
          exit 1
        fi
        echo "✅ failure issue filed: $ISSUE_URL"
        echo "Failure issue: $ISSUE_URL" >> "$GITHUB_STEP_SUMMARY"

    # ============================================================
    # BUILD SUMMARY
    # ============================================================
    
    # Values are read from env rather than interpolated into the script body:
    # same discipline as the alert step, and it lets each one carry a default.
    # A run that aborts before verify-builds has no per-builder outputs at all,
    # which used to render as three blank table cells.
    - name: Generate build summary
      if: always()
      shell: bash
      env:
        ALL_PASSED: ${{ steps.status.outputs.all-passed }}
        FAILURE_PHASE: ${{ steps.status.outputs.phase }}
        CACHE_KEY: ${{ steps.cache-key.outputs.key }}
        CONTAINER_MODE: ${{ steps.setup-env.outputs.container-mode }}
        JUPYTER_STATUS: ${{ steps.verify-builds.outputs.jupyter-status }}
        PDFLATEX_STATUS: ${{ steps.verify-builds.outputs.pdflatex-status }}
        HTML_STATUS: ${{ steps.verify-builds.outputs.html-status }}
      run: |
        JUPYTER_STATUS="${JUPYTER_STATUS:-not run}"
        PDFLATEX_STATUS="${PDFLATEX_STATUS:-not run}"
        HTML_STATUS="${HTML_STATUS:-not run}"

        icon() {
          case "$1" in
            success) echo "✅" ;;
            failure) echo "❌" ;;
            skipped) echo "⏭️" ;;
            *)       echo "⚪" ;;
          esac
        }

        {
          echo "## 📦 Jupyter Cache Build Summary"
          echo ""

          if [ "$ALL_PASSED" = "true" ]; then
            echo "### ✅ Build Successful - Cache Saved"
          else
            echo "### ❌ Build Failed - Cache NOT Saved"
            echo ""
            echo "> ⚠️ Existing cache preserved for PR workflows"
            if [ "$FAILURE_PHASE" != "build" ]; then
              echo ">"
              echo "> Failed during \`$FAILURE_PHASE\` — no lecture was built, which is why every builder below reads \`not run\`. Look at the failing step, not at the lectures."
            fi
          fi

          echo ""
          echo "| Item | Value |"
          echo "|------|-------|"
          echo "| Cache Key | \`${CACHE_KEY:-not generated}\` |"
          echo "| Trigger | $GITHUB_EVENT_NAME |"
          echo "| Commit | \`$GITHUB_SHA\` |"
          echo "| Container Mode | ${CONTAINER_MODE:-unknown} |"
          echo ""

          echo "### Builder Results"
          echo ""
          echo "| Builder | Status |"
          echo "|---------|--------|"
          echo "| jupyter | $(icon "$JUPYTER_STATUS") $JUPYTER_STATUS |"
          echo "| pdflatex | $(icon "$PDFLATEX_STATUS") $PDFLATEX_STATUS |"
          echo "| html | $(icon "$HTML_STATUS") $HTML_STATUS |"
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

        if [ -d "_build" ]; then
          {
            echo "### Build Output"
            echo ""
            echo "| Directory | Size |"
            echo "|-----------|------|"
            echo "| Total | $(du -sh _build 2>/dev/null | cut -f1 || echo 'N/A') |"
            for dir in _build/*/; do
              if [ -d "$dir" ]; then
                NAME=$(basename "$dir")
                SIZE=$(du -sh "$dir" 2>/dev/null | cut -f1 || echo 'N/A')
                echo "| $NAME | $SIZE |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # ============================================================
    # FAIL WORKFLOW IF THE CACHE BUILD DID NOT SUCCEED
    # ============================================================

    # always() is load-bearing. A composite step's plain `if:` carries an
    # implicit success(), so once any earlier step failed — the artifact upload,
    # or the alert step itself — this one silently skipped and the composite's
    # only red was whatever incidental step happened to fail. In lecture-dp run
    # 26381283100 that meant the visible error was an exit-127 from "Create
    # failure issue", and the actual build failure never surfaced at all.
    #
    # On a setup/pre-build abort the job is already red from the aborting step,
    # so this is belt-and-braces there rather than the sole red. It still runs,
    # because a guard that only covers the case someone remembered is how #123
    # happened in the first place.
    - name: Fail if the cache build did not succeed
      if: always() && steps.status.outputs.all-passed != 'true'
      shell: bash
      env:
        FAILURE_PHASE: ${{ steps.status.outputs.phase }}
      run: |
        if [ "$FAILURE_PHASE" = "build" ]; then
          echo "::error::One or more builds failed - see summary above"
        else
          echo "::error::The cache build aborted during $FAILURE_PHASE, before any lecture was built - see the failing step above"
        fi
        exit 1

branding:
  icon: 'package'
  color: 'green'
