name: 'Preview Cloudflare'
description: 'Deploys lecture builds to Cloudflare Pages for PR previews with smart comments showing changed pages'
author: 'QuantEcon'

inputs:
  cloudflare-api-token:
    description: 'Cloudflare API token (use secrets.CLOUDFLARE_API_TOKEN)'
    required: true
  cloudflare-account-id:
    description: 'Cloudflare Account ID (use secrets.CLOUDFLARE_ACCOUNT_ID)'
    required: true
  project-name:
    description: 'Cloudflare Pages project name'
    required: true
  build-dir:
    description: 'Directory containing built site'
    required: true
  lectures-dir:
    description: 'Directory containing lecture .md files for change detection. Set to empty string to disable.'
    required: false
    default: 'lectures'

outputs:
  deploy-url:
    description: >-
      Stable preview URL for this PR — https://pr-{number}.{project}.pages.dev.
      This is the branch alias, so it keeps pointing at the newest deployment as
      the PR gets more commits. Use it for anything a human will follow.
    value: ${{ steps.deploy.outputs.deploy-url }}
  deployment-url:
    description: >-
      Immutable URL of this one deployment — https://{hash}.{project}.pages.dev.
      Pinned to the commit that produced it, so use it to compare a specific
      revision. Empty if wrangler's output did not name it.
    value: ${{ steps.deploy.outputs.deployment-url }}
  changed-files:
    description: 'List of changed lecture files'
    value: ${{ steps.detect-changes.outputs.changed-files }}

runs:
  using: "composite"
  steps:
    - name: Check for trusted actor
      id: check-trust
      shell: bash
      run: |
        # Skip for dependabot and fork PRs (they can't access secrets)
        if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "⚠️ Skipping Cloudflare deploy for dependabot"
        elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
          echo "skip=true" >> $GITHUB_OUTPUT
          echo "⚠️ Skipping Cloudflare deploy for fork PR"
        else
          echo "skip=false" >> $GITHUB_OUTPUT
        fi

    - name: Detect Changed Lecture Files
      id: detect-changes
      if: steps.check-trust.outputs.skip != 'true' && inputs.lectures-dir != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        LECTURES_DIR: ${{ inputs.lectures-dir }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/detect-changed-lectures.sh"

    - name: Install Wrangler CLI
      if: steps.check-trust.outputs.skip != 'true'
      shell: bash
      run: npm install -g wrangler@latest

    - name: Deploy to Cloudflare Pages
      id: deploy
      if: steps.check-trust.outputs.skip != 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        # Read from env rather than interpolated into the script body, matching
        # the discipline the comment step below already follows.
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        PROJECT_NAME: ${{ inputs.project-name }}
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        SHORT_SHA="${COMMIT_SHA:0:7}"
        BRANCH_ALIAS="pr-${PR_NUMBER}"

        echo "🔍 Deploying preview for PR #${PR_NUMBER} to Cloudflare Pages..."

        # Deploy to Cloudflare Pages with branch alias
        DEPLOY_OUTPUT=$(wrangler pages deploy "${BUILD_DIR}" \
          --project-name="${PROJECT_NAME}" \
          --branch="${BRANCH_ALIAS}" \
          --commit-hash="${COMMIT_SHA}" \
          --commit-message="PR #${PR_NUMBER} (${SHORT_SHA})" \
          2>&1)

        DEPLOY_EXIT_CODE=$?

        echo "::group::Deployment Output"
        echo "$DEPLOY_OUTPUT"
        echo "::endgroup::"

        if [ $DEPLOY_EXIT_CODE -ne 0 ]; then
          echo "❌ Error: Cloudflare Pages deployment failed"
          exit 1
        fi

        # The alias URL is CONSTRUCTED, never parsed (#14). Two reasons:
        #
        #   1. It is stable. The hash URL names one deployment, so every push to
        #      the PR produced a different link — including every per-lecture
        #      deep link in the comment below, which is the bigger cost. The
        #      alias tracks the newest deployment, so a reviewer can keep one
        #      tab open across the whole review.
        #   2. It needs no parsing at all. `pr-N` is already alias-safe
        #      (Cloudflare lowercases branch names and maps non-alphanumerics to
        #      `-`), so the URL is fully determined by inputs we already hold.
        #
        # Cloudflare creates the alias for any non-production branch, and this
        # step only runs on pull_request, so the branch is always `pr-N`.
        DEPLOY_URL="https://${BRANCH_ALIAS}.${PROJECT_NAME}.pages.dev"

        # The per-deployment URL is still worth having — it is the only way to
        # look at one specific revision — so keep it as a secondary output.
        # Match a pages.dev host and drop the alias, rather than taking the
        # first hit: wrangler prints both URLs in some versions, so `head -1`
        # silently chose one or the other depending on the wrangler release.
        DEPLOYMENT_URL=$(echo "$DEPLOY_OUTPUT" \
          | grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' \
          | grep -v "^https://${BRANCH_ALIAS}\." \
          | head -1 || true)

        echo "deploy-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        echo "deployment-url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT

        echo "✅ Deployment successful!"
        echo "📍 Preview (stable):  $DEPLOY_URL"
        if [ -n "$DEPLOYMENT_URL" ]; then
          echo "📌 This deployment:   $DEPLOYMENT_URL"
        else
          echo "📌 This deployment:   (not named in wrangler output)"
        fi

    - name: Comment on PR
      if: steps.check-trust.outputs.skip != 'true' && github.event_name == 'pull_request' && steps.deploy.outputs.deploy-url != ''
      uses: actions/github-script@v9
      env:
        DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        CHANGED_FILES: ${{ steps.detect-changes.outputs.changed-files }}
        LECTURES_DIR: ${{ inputs.lectures-dir }}
        STRIP_LECTURES_DIR: ${{ steps.detect-changes.outputs.strip-lectures-dir }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      with:
        github-token: ${{ github.token }}
        script: |
          // Untrusted PR data (file paths, deploy URL) is read from env, never
          // interpolated into the script body (avoids script injection).
          const deployUrl = process.env.DEPLOY_URL || '';
          const deploymentUrl = process.env.DEPLOYMENT_URL || '';
          const changedFiles = process.env.CHANGED_FILES || '';
          const lecturesDir = process.env.LECTURES_DIR || '';
          const stripLecturesDir = process.env.STRIP_LECTURES_DIR === 'true';
          const prNumber = context.issue.number;
          const commitSha = process.env.COMMIT_SHA || '';
          const shortSha = commitSha.substring(0, 7);
          const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${commitSha}`;
          
          // Build the comment body
          let comment = `## ☁️ Cloudflare Preview Ready!\n\n`;
          comment += `**Preview URL:** ${deployUrl}\n\n`;
          comment += `**Commit:** [\`${shortSha}\`](${commitUrl})\n\n`;
          
          // Add direct links to changed lecture pages
          if (changedFiles && changedFiles.trim() && lecturesDir) {
            const files = changedFiles.split('\n').filter(f => f.trim());
            if (files.length > 0) {
              comment += `### 📚 Changed Lectures\n\n`;
              for (const file of files) {
                const cleanFile = file.trim();
                if (cleanFile) {
                  // Determine URL path based on _toc.yml location
                  // If _toc.yml is in lectures-dir, strip the dir (JB builds relative to it)
                  // If _toc.yml is at root, keep the dir (JB preserves structure)
                  let filePath;
                  if (stripLecturesDir) {
                    filePath = cleanFile.replace(`${lecturesDir}/`, '').replace('.md', '');
                  } else {
                    filePath = cleanFile.replace('.md', '');
                  }
                  const displayName = filePath.split('/').pop();  // Just filename for display
                  const pageUrl = `${deployUrl}/${filePath}.html`;
                  comment += `- [${displayName}](${pageUrl})\n`;
                }
              }
              comment += '\n';
            }
          }
          
          // Add build info
          comment += `---\n`;
          comment += `<details><summary>Build Info</summary>\n\n`;
          comment += `- **Workflow:** [${context.workflow}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
          // The preview URL above is the branch alias, which follows the newest
          // deployment. Name the immutable one here too, so a reviewer who needs
          // to look at exactly this commit still has a link that will not move
          // under them when the next push lands.
          if (deploymentUrl) {
            comment += `- **This deployment:** ${deploymentUrl} (pinned to \`${shortSha}\`; the URL above always tracks the latest push)\n`;
          }
          comment += `</details>\n`;
          
          // Check for existing preview comment and update it
          const comments = await github.rest.issues.listComments({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const marker = '## ☁️ Cloudflare Preview Ready!';
          const existingComment = comments.data.find(c => c.body.includes(marker));
          
          if (existingComment) {
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log(`Updated existing comment ${existingComment.id}`);
          } else {
            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log('Created new comment');
          }

    - name: Skip notification
      if: steps.check-trust.outputs.skip == 'true'
      shell: bash
      run: |
        echo "⚠️ Cloudflare deployment skipped (untrusted actor or fork PR)"
        echo "This is expected for dependabot PRs and PRs from forks."

branding:
  icon: 'cloud'
  color: 'orange'
