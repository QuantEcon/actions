name: 'Preview Cloudflare'
description: >-
  Deploys a pull request's built site to Cloudflare Pages as a preview, at a URL that stays the
  same for every push, and comments on the pull request with it and with links to the lectures it
  changes.
author: 'QuantEcon'

# Each description below is copied verbatim into the user manual
# (docs/user/actions/preview-cloudflare.md) by scripts/generate-docs.py, so it
# is written for a reader.
inputs:
  cloudflare-api-token:
    description: >-
      A Cloudflare API token that can edit Cloudflare Pages in the account, from a repository
      secret such as `secrets.CLOUDFLARE_API_TOKEN`. Required for a deploy: a run that would deploy
      without it fails before anything is installed. Leave it out with `placeholder: 'true'`.
    required: false
  cloudflare-account-id:
    description: >-
      The ID of the Cloudflare account that owns the Pages project, from a repository secret such
      as `secrets.CLOUDFLARE_ACCOUNT_ID`. Required for a deploy, as `cloudflare-api-token` is.
      Leave it out with `placeholder: 'true'`.
    required: false
  project-name:
    description: >-
      The Cloudflare Pages project to deploy to, which must already exist. A deploy's URLs are on
      the address Cloudflare serves the project at, usually `<project-name>.pages.dev`.
      `placeholder: 'true'` needs it too: having no deploy to ask, it builds its preview URL on
      `<project-name>.pages.dev`.
    required: true
  build-dir:
    description: >-
      The directory that holds the built site, such as `_build/html`, which `build-lectures` gives
      in its `build-path` output. Required for a deploy, as `cloudflare-api-token` is.
    required: false
  lectures-dir:
    description: >-
      The directory of lecture `.md` files that change detection looks in, as a path from the
      repository root such as `lectures`, with no `./` or trailing slash: each lecture the pull
      request added or modified gets a link in the comment, and is listed in `changed-files`. Empty
      turns change detection off, and the comment gives only the preview URL.
    required: false
    default: 'lectures'
  dispatch-alias:
    description: >-
      Deploys on `workflow_dispatch` and `schedule` events too, to this branch, such as
      `dispatch-canary`, at `https://<alias>.<project-name>.pages.dev`. It must start with
      `dispatch-`, which keeps it clear of every pull request's `pr-<number>`, and be lowercase
      letters and digits in words joined by single dashes, at most 28 characters in all. Any other
      value fails the job, on every event. Such a run has no comment and no changed lectures, and a
      pull request ignores the input. Empty, the default, deploys on `pull_request` only.
    required: false
    default: ''
  placeholder:
    description: >-
      `'true'` posts the pull request's preview comment at once, before there is a build to
      deploy, and deploys nothing. The comment has the preview's URL and links to the lectures the
      pull request changes, all built from its number and `project-name`, and says that they show
      the last deployed push until this one's deploy finishes; the deploy's comment then replaces
      it. It needs no checkout and no secret, so it runs in a job of its own, with no `needs:`. It
      posts only where a deploy would run, so not for a pull request from a fork or by
      Dependabot, nor on any other event. Any value but `'true'` or `'false'` fails the job.
    required: false
    default: 'false'

outputs:
  deployed:
    description: >-
      `'true'` when this run deployed a preview, so that `deploy-url` is set, and `'false'` when it
      did not: then a notice or a warning in the log says why, or `placeholder` is `'true'`. A
      scheduled or dispatched check should assert `deployed == 'true'`, or it passes without
      testing the deploy.
    value: ${{ steps.deploy.outputs.deploy-url != '' && 'true' || 'false' }}
  deploy-url:
    description: >-
      The pull request's preview URL, `https://pr-<number>.<project-name>.pages.dev`, which always
      shows its newest push, so use it for anything a person will follow; on a `workflow_dispatch`
      or `schedule` run, `https://<dispatch-alias>.<project-name>.pages.dev`. Its host is the
      address the deployment is served at, so when Cloudflare serves the project at an address
      other than `<project-name>.pages.dev`, the URL uses that one. Empty when nothing was
      deployed.
    value: ${{ steps.deploy.outputs.deploy-url }}
  deployment-url:
    description: >-
      The URL of this one deployment, `https://<hash>.<project-name>.pages.dev`, which goes on
      showing this push after later ones, from wrangler's record of the deploy. Empty when the
      record does not name it, and when nothing was deployed.
    value: ${{ steps.deploy.outputs.deployment-url }}
  changed-files:
    description: >-
      The lecture files under `lectures-dir` that the pull request added or modified, one path per
      line, compared from the commit where it branched off. When a shallow checkout's history does
      not reach that commit within 1,024 commits, the comparison starts from the base branch's tip
      instead, with a warning, so a lecture changed only on the base branch is listed too. When git
      fails, the action warns and lists none.
      Empty when there are none, with `lectures-dir: ''`, on an event other than
      `pull_request`, for a pull request from a fork or by Dependabot, and with `placeholder:
      'true'`.
    value: ${{ steps.detect-changes.outputs.changed-files }}

runs:
  using: "composite"
  steps:
    # One decision for the whole run (#227): every step below follows
    # `deploy`. The event allow-list, the Dependabot and fork checks and the
    # dispatch-alias rules are in the script, shared with preview-netlify.
    - name: Decide whether to deploy
      id: decide
      shell: bash
      env:
        PROVIDER: Cloudflare
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.actor }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DISPATCH_ALIAS: ${{ inputs.dispatch-alias }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/preview-decide.sh"

    # The inputs each mode needs, checked before anything is installed. The
    # placeholder's on every event, as dispatch-alias is, so a typo shows on
    # the next pull request. A deploy's only when one will run: a fork's pull
    # request, which is skipped, gets no secrets. The secrets themselves never
    # reach this step, only whether they are set. project-name is required in
    # both modes, so only its line breaks are checked here.
    - name: Check the inputs
      id: check-inputs
      shell: bash
      env:
        PLACEHOLDER: ${{ inputs.placeholder }}
        DEPLOY: ${{ steps.decide.outputs.deploy }}
        HAVE_TOKEN: ${{ inputs.cloudflare-api-token != '' }}
        HAVE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id != '' }}
        HAVE_BUILD_DIR: ${{ inputs.build-dir != '' }}
        PROJECT_NAME: ${{ inputs.project-name }}
        BUILD_DIR: ${{ inputs.build-dir }}
        LECTURES_DIR: ${{ inputs.lectures-dir }}
      run: |
        # shellcheck source=scripts/workflow-command.sh
        . "$GITHUB_ACTION_PATH/../scripts/workflow-command.sh"
        # Each of these is one value, and a line break in one would end the
        # line that prints it, and could start a workflow command (#267).
        single_line "project-name=$PROJECT_NAME" "build-dir=$BUILD_DIR" "lectures-dir=$LECTURES_DIR" || exit 1
        case "$PLACEHOLDER" in
          true|false) ;;
          *) echo "::error::placeholder is [$(esc "$PLACEHOLDER")], not 'true' or 'false'"; exit 1 ;;
        esac
        if [ "$PLACEHOLDER" = true ]; then
          for given in "cloudflare-api-token=$HAVE_TOKEN" "cloudflare-account-id=$HAVE_ACCOUNT_ID"; do
            [ "${given#*=}" != true ] \
              || echo "::warning::${given%%=*} is not used with placeholder: 'true'. Leave it out, so that the placeholder's job holds no deploy secret."
          done
        elif [ "$DEPLOY" = true ]; then
          missing=()
          [ "$HAVE_TOKEN" = true ] || missing+=(cloudflare-api-token)
          [ "$HAVE_ACCOUNT_ID" = true ] || missing+=(cloudflare-account-id)
          [ "$HAVE_BUILD_DIR" = true ] || missing+=(build-dir)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::A deploy needs cloudflare-api-token, cloudflare-account-id and build-dir, and this run has no ${missing[*]}. A secret that the repository does not have is empty."
            exit 1
          fi
        fi

    - name: Detect Changed Lecture Files
      id: detect-changes
      if: steps.decide.outputs.deploy == 'true' && inputs.placeholder != 'true' && inputs.lectures-dir != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        LECTURES_DIR: ${{ inputs.lectures-dir }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/detect-changed-lectures.sh"

    - name: Install Wrangler CLI
      id: install-cli
      # Exactly the deploy's condition, so the CLI is installed only for a
      # deploy that will run (#193). The placeholder deploys nothing.
      if: steps.decide.outputs.deploy == 'true' && inputs.placeholder != 'true'
      shell: bash
      run: |
        # Exactly the version in package.json / package-lock.json beside this
        # file, not `wrangler@latest` (#105): this CLI is handed the deploy
        # token, so it is pinned like every third-party Action in this repo,
        # and Dependabot's npm entry keeps the pin current.
        #
        # Installed into a fresh directory under RUNNER_TEMP rather than
        # $GITHUB_ACTION_PATH, which in a container job is the _actions directory
        # mounted from the host. RUNNER_TEMP is cleared between jobs, so nothing
        # accumulates on a persistent self-hosted runner, as it would in /tmp.
        # Install scripts stay on, as they were for the global install:
        # workerd and esbuild use theirs to put their native binaries in place.
        D="$(mktemp -d "${RUNNER_TEMP:-/tmp}/preview-cloudflare.XXXXXX")"
        cp "$GITHUB_ACTION_PATH/package.json" "$GITHUB_ACTION_PATH/package-lock.json" "$D/"
        npm ci --prefix "$D" --no-audit --no-fund \
          || { echo "::error::npm ci of the pinned wrangler failed — see the npm output above (it needs registry.npmjs.org)"; exit 1; }

        WRANGLER="$D/node_modules/.bin/wrangler"
        "$WRANGLER" --version \
          || { echo "::error::wrangler installed but does not run — see the output above"; exit 1; }
        echo "bin=$WRANGLER" >> "$GITHUB_OUTPUT"

        # The old `npm install -g` left wrangler on PATH for later steps in the
        # caller's job; keep that, but expose only the CLI's own executables,
        # not every dependency bin in node_modules/.bin (esbuild, tsc, semver,
        # ...), which would shadow the caller's tools. The deploy step below
        # uses the absolute path.
        mkdir "$D/bin"
        for b in wrangler wrangler2 cf-wrangler; do
          if [ -e "$D/node_modules/.bin/$b" ]; then ln -s "$D/node_modules/.bin/$b" "$D/bin/$b"; fi
        done
        echo "$D/bin" >> "$GITHUB_PATH"

    - name: Deploy to Cloudflare Pages
      id: deploy
      if: steps.decide.outputs.deploy == 'true' && inputs.placeholder != 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        # Read from env rather than interpolated into the script body, matching
        # the discipline the comment step below already follows.
        BRANCH_ALIAS: ${{ steps.decide.outputs.alias }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
        # The pull request's head, or on a dispatched or scheduled run the
        # commit it ran on.
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PROJECT_NAME: ${{ inputs.project-name }}
        BUILD_DIR: ${{ inputs.build-dir }}
        WRANGLER: ${{ steps.install-cli.outputs.bin }}
      run: |
        # shellcheck source=scripts/workflow-command.sh
        . "$GITHUB_ACTION_PATH/../scripts/workflow-command.sh"
        SHORT_SHA="${COMMIT_SHA:0:7}"
        if [ "$EVENT_NAME" = "pull_request" ]; then
          WHAT="PR #${PR_NUMBER}"
        else
          WHAT="${EVENT_NAME} on ${REF_NAME}"
        fi

        echo "🔍 Deploying preview for ${WHAT} to Cloudflare Pages, branch ${BRANCH_ALIAS}..."

        # Deploy to Cloudflare Pages with branch alias. The output streams to
        # the log as wrangler runs, stderr included, and tee keeps a copy, so
        # that the group below can be closed on a line of its own. wrangler
        # also appends a JSON record of the deploy to WRANGLER_OUTPUT_FILE_PATH,
        # which the URLs below are read from.
        #
        # `set +e` because the step runs under `bash -eo pipefail`: a failing
        # wrangler would otherwise abort the step before EXIT= could read
        # PIPESTATUS. The old `DEPLOY_OUTPUT=$(wrangler … 2>&1)` hit exactly
        # that, with wrangler's error captured into the variable, so a failed
        # deploy ended the log at the line above with no diagnostic (#105).
        LOG="$(mktemp)"
        RECORD="$(mktemp)"
        echo "::group::Deployment Output"
        set +e
        WRANGLER_OUTPUT_FILE_PATH="$RECORD" "$WRANGLER" pages deploy "${BUILD_DIR}" \
          --project-name="${PROJECT_NAME}" \
          --branch="${BRANCH_ALIAS}" \
          --commit-hash="${COMMIT_SHA}" \
          --commit-message="${WHAT} (${SHORT_SHA})" \
          2>&1 | tee "$LOG"
        EXIT=${PIPESTATUS[0]}
        set -e
        # A workflow command is only read at the start of a line, so end any
        # unterminated last line first or ::endgroup:: is printed as text.
        [ -z "$(tail -c 1 "$LOG")" ] || echo
        echo "::endgroup::"

        if [ "$EXIT" -ne 0 ]; then
          echo "❌ Error: Cloudflare Pages deployment failed"
          echo "::error::wrangler pages deploy failed (exit $EXIT) — see the Deployment Output group above"
          exit "$EXIT"
        fi

        # The alias URL is CONSTRUCTED, never taken from wrangler (#14). Two
        # reasons:
        #
        #   1. It is stable. The hash URL names one deployment, so every push to
        #      the PR produced a different link — including every per-lecture
        #      deep link in the comment below, which is the bigger cost. The
        #      alias tracks the newest deployment, so a reviewer can keep one
        #      tab open across the whole review.
        #   2. It is always there. wrangler names the alias only when its
        #      status checks see the deploy finish, within about 30 seconds.
        #
        # Cloudflare creates the alias for any non-production branch, and the
        # branch is `pr-N` or a `dispatch-` alias that preview-decide.sh has
        # checked is lowercase letters, digits and single dashes, at most 28
        # characters, so the alias is the branch name unchanged.
        #
        # Its host is the project's own pages.dev address, which Cloudflare
        # keeps apart from the project's name and which can differ from
        # <project-name>.pages.dev (#216). wrangler's record of the deploy
        # names the deployment's URL, https://<hash>.<address>, so the address
        # is that host without its first label. wrangler writes the record, a
        # `pages-deploy-detailed` line, after every deploy that exits 0, and
        # Cloudflare's wrangler-action reads the same line. The URL is checked
        # against a strict pattern before it goes anywhere; when the record
        # gives none of that form, the address falls back to
        # <project-name>.pages.dev, with a warning. The per-deployment URL, the
        # only way to look at one specific revision, is the record's URL
        # itself.
        URL=$(node -e '
          let url = "";
          for (const line of require("fs").readFileSync(process.argv[1], "utf8").split("\n")) {
            let entry;
            try { entry = JSON.parse(line); } catch { continue; }
            if (entry && entry.type === "pages-deploy-detailed" && entry.version === 1 && typeof entry.url === "string") url = entry.url;
          }
          process.stdout.write(url);
        ' "$RECORD") || URL=""
        re='^https://[a-z0-9-]+\.([a-z0-9][a-z0-9-]*\.pages\.dev)$'
        if [[ "$URL" =~ $re ]]; then
          ADDRESS="${BASH_REMATCH[1]}"
          DEPLOYMENT_URL="$URL"
        else
          ADDRESS="${PROJECT_NAME}.pages.dev"
          DEPLOYMENT_URL=""
          annotate warning "wrangler's record of the deploy gives no deployment URL of the form https://<hash>.<name>.pages.dev (it gives [${URL}]), so deploy-url assumes the project is served at ${ADDRESS}, and deployment-url is empty"
        fi
        DEPLOY_URL="https://${BRANCH_ALIAS}.${ADDRESS}"
        # The placeholder's comment has no deploy to ask, so it links to
        # <project-name>.pages.dev until this deploy's comment replaces it.
        [ "$ADDRESS" = "${PROJECT_NAME}.pages.dev" ] \
          || annotate notice "Cloudflare serves the project ${PROJECT_NAME} at ${ADDRESS}, not ${PROJECT_NAME}.pages.dev. The preview URLs here use ${ADDRESS}; a comment posted with placeholder: 'true' links to ${PROJECT_NAME}.pages.dev until this deploy's comment replaces it."

        echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

        echo "✅ Deployment successful!"
        echo "📍 Preview (stable):  $DEPLOY_URL"
        if [ -n "$DEPLOYMENT_URL" ]; then
          echo "📌 This deployment:   $DEPLOYMENT_URL"
        else
          echo "📌 This deployment:   (not named in wrangler output)"
        fi
        # No pull request means no comment, so put the URL on the run's
        # summary page instead.
        [ "$EVENT_NAME" = "pull_request" ] || echo "::notice::Cloudflare preview deployed to $DEPLOY_URL"

    # The comment is built and posted by a script shared with preview-netlify
    # (#153). Its path is resolved here, from $GITHUB_ACTION_PATH, as the
    # steps above find theirs: in a container job, `github.action_path` gives
    # the runner's path, which the container does not have. The two steps run
    # after a deploy, and for the placeholder, whose pending comment the
    # deploy's comment later replaces.
    - name: Find the comment script
      id: comment-script
      if: steps.decide.outputs.deploy == 'true' && github.event_name == 'pull_request' && (inputs.placeholder == 'true' || steps.deploy.outputs.deploy-url != '')
      shell: bash
      run: |
        SCRIPT="$GITHUB_ACTION_PATH/../scripts/preview-comment.cjs"
        [ -f "$SCRIPT" ] || { echo "::error::the comment script is missing from the action: $SCRIPT"; exit 1; }
        echo "path=$SCRIPT" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      id: comment
      if: steps.decide.outputs.deploy == 'true' && github.event_name == 'pull_request' && (inputs.placeholder == 'true' || steps.deploy.outputs.deploy-url != '')
      uses: actions/github-script@v9
      env:
        PREVIEW_COMMENT_SCRIPT: ${{ steps.comment-script.outputs.path }}
        # Picks the comment's heading and hidden marker in the script.
        PROVIDER: cloudflare
        PREVIEW_STATE: ${{ inputs.placeholder == 'true' && 'pending' || 'ready' }}
        DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        # The placeholder builds the URL from these, having no deploy to ask:
        # the same URL as the deploy step's.
        PREVIEW_ALIAS: ${{ steps.decide.outputs.alias }}
        PREVIEW_SITE: ${{ inputs.project-name }}
        # Named under Build Info, when wrangler printed it.
        DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        CHANGED_FILES: ${{ steps.detect-changes.outputs.changed-files }}
        LECTURES_DIR: ${{ inputs.lectures-dir }}
        STRIP_LECTURES_DIR: ${{ steps.detect-changes.outputs.strip-lectures-dir }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      with:
        github-token: ${{ github.token }}
        # Untrusted PR data (file paths, deploy URL) is read from env by the
        # script, never interpolated into this body (avoids script injection).
        script: |
          await require(process.env.PREVIEW_COMMENT_SCRIPT).run({ github, context, core });

branding:
  icon: 'cloud'
  color: 'orange'
