name: 'Publish to GitHub Pages'
description: >-
  Publishes a built site to GitHub Pages with GitHub's own Pages deploy, so no gh-pages branch is
  needed. On a tag it can also attach the site to the release, as an archive with its checksum and
  a manifest. The upload, the deploy and the release assets can each run in a job of their own.
author: 'QuantEcon'

# Each description below is copied verbatim into the user manual
# (docs/user/actions/publish-gh-pages.md) by scripts/generate-docs.py, so it is
# written for a reader.
inputs:
  mode:
    description: >-
      Which part of the publish this step does. `all`, the default, does all of it in one job:
      the upload, the deploy, and the release assets when `create-release-assets` is `'true'`.
      The other three split it across jobs, so that only the job that deploys holds the Pages
      permissions. `upload` uploads `build-dir` as the run's `github-pages` artifact, and needs
      no permission beyond `contents: read`. `deploy` deploys the `github-pages` artifact an
      earlier job's `upload` made, takes no `build-dir` or `cname`, and needs `pages: write` and
      `id-token: write`. `release` makes the release assets from `build-dir`, whatever
      `create-release-assets` says, and needs `contents: write`. Any other value fails the job,
      as does `create-release-assets: 'true'` with `upload` or `deploy`.
    required: false
    default: 'all'
  build-dir:
    description: >-
      The directory that holds the built site, such as `_build/html`, which `build-lectures` gives
      in its `build-path` output. Required in every `mode` but `deploy`, which fails if it is
      given. The job fails if it does not exist.
    required: false
    default: ''
  cname:
    description: >-
      A domain to write into `build-dir` as a `CNAME` file, which also lands in the release
      archive. It does not set the site's custom domain, and a warning says so: a GitHub Actions
      Pages deploy ignores `CNAME` files, so set the domain under Settings, Pages. Empty, the
      default, writes no file. `mode: deploy` fails if it is given.
    required: false
    default: ''
  create-release-assets:
    description: >-
      `'true'` also attaches the site to the GitHub release of the tag the run was triggered by,
      creating the release if there is none: an archive, its SHA-256 checksum and a manifest. It
      needs `github-token`, and a run triggered by a tag: any other run skips it, with a warning.
      `'false'`, the default, attaches nothing. It applies to `mode: all`; `mode: release` always
      makes them.
    required: false
    default: 'false'
  asset-name:
    description: >-
      With `create-release-assets: 'true'` or `mode: release`: the start of each asset's file
      name. Empty, the default, uses the repository's name followed by `-html`, as in
      `<repository>-html`. Only letters, digits, `.`, `_` and `-`: any other character fails the
      job before anything runs, in every mode, since a name with a backslash, say, would give a
      checksum file that `sha256sum --check` cannot read.
    required: false
    default: ''
  github-token:
    description: >-
      With `create-release-assets: 'true'` or `mode: release`: a token that can write the
      repository's releases, such as `secrets.GITHUB_TOKEN` in a job with `contents: write`. On a
      run triggered by a tag, the job fails if it is empty. The Pages deploy does not use it.
    required: false
    default: ''

outputs:
  page-url:
    description: >-
      The URL of the published site, as GitHub Pages reports it, such as
      `https://<owner>.github.io/<repository>/`, or the custom domain's. Set once the deploy
      succeeds, by `mode: all` or `deploy`.
    value: ${{ steps.deployment.outputs.page_url }}
  mode:
    description: >-
      The `mode` the step ran in, set once the inputs have passed the action's checks. Empty when
      they did not, and then nothing was uploaded, deployed or released.
    value: ${{ steps.check.outputs.mode }}

runs:
  using: "composite"
  steps:
    # Before anything is uploaded or deployed, so that a job given the wrong
    # mode, or a mode it cannot carry out, fails having done nothing (#233).
    - name: Check inputs
      id: check
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        BUILD_DIR: ${{ inputs.build-dir }}
        CNAME: ${{ inputs.cname }}
        CREATE_RELEASE_ASSETS: ${{ inputs.create-release-assets }}
        ASSET_NAME: ${{ inputs.asset-name }}
      run: |
        case "$MODE" in
          all|upload|deploy|release) ;;
          *)
            echo "::error::mode [$MODE] must be all, upload, deploy or release"
            exit 1
            ;;
        esac
        if [ "$MODE" = deploy ]; then
          if [ -n "$BUILD_DIR" ] || [ -n "$CNAME" ]; then
            echo "::error::mode: deploy deploys the github-pages artifact that an earlier job's mode: upload made, so it takes no build-dir or cname: pass them to the upload"
            exit 1
          fi
        elif [ -z "$BUILD_DIR" ]; then
          echo "::error::build-dir is required with mode: $MODE"
          exit 1
        fi
        # The release needs contents: write, which a job that only uploads or
        # only deploys should not hold.
        if [ "$CREATE_RELEASE_ASSETS" = true ] && { [ "$MODE" = upload ] || [ "$MODE" = deploy ]; }; then
          echo "::error::create-release-assets does nothing with mode: $MODE. Make the release assets in a job of their own, with mode: release and contents: write"
          exit 1
        fi
        # Every file name the release step writes starts with it. In every
        # mode, so that a bad name shows before the first tag.
        if [ -n "$ASSET_NAME" ] && ! [[ "$ASSET_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::asset-name [$ASSET_NAME] must be letters, digits, '.', '_' and '-' only"
          exit 1
        fi
        echo "mode: $MODE"
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"

    - name: Prepare build directory
      id: prepare
      if: inputs.mode != 'deploy'
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
        CNAME: ${{ inputs.cname }}
      run: |
        echo "Preparing build directory: $BUILD_DIR"
        
        # Verify build directory exists
        if [ ! -d "$BUILD_DIR" ]; then
          echo "❌ Error: Build directory not found: $BUILD_DIR"
          exit 1
        fi
        
        # Count files
        FILE_COUNT=$(find "$BUILD_DIR" -type f | wc -l)
        echo "📊 Files to deploy: $FILE_COUNT"
        echo "file-count=$FILE_COUNT" >> "$GITHUB_OUTPUT"
        
        # Calculate size
        SIZE=$(du -sh "$BUILD_DIR" | cut -f1)
        SIZE_MB=$(du -sm "$BUILD_DIR" | cut -f1)
        echo "💾 Total size: $SIZE"
        echo "size-mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
        
        # Add CNAME file if specified. It still lands in the release tarball,
        # but the Pages deploy below (configure-pages -> upload-pages-artifact
        # -> deploy-pages) never reads it: with a GitHub Actions Pages source
        # the custom domain lives only in the repository's Pages settings.
        if [ -n "$CNAME" ]; then
          echo "$CNAME" > "$BUILD_DIR/CNAME"
          echo "🌐 Added CNAME: $CNAME"
          echo "::warning::cname has no effect on the GitHub Pages deployment: a GitHub Actions Pages deploy ignores CNAME files. Set the custom domain in Settings -> Pages -> Custom domain (the CNAME file is still written into build-dir)."
        fi
        
        echo "✅ Preparation complete"

    # In the deploy, not the upload: it reads the repository's Pages settings,
    # which needs the Pages permission that only the deploying job holds.
    - name: Setup Pages
      if: inputs.mode == 'all' || inputs.mode == 'deploy'
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      if: inputs.mode == 'all' || inputs.mode == 'upload'
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.build-dir }}

    - name: Deploy to GitHub Pages
      id: deployment
      if: inputs.mode == 'all' || inputs.mode == 'deploy'
      uses: actions/deploy-pages@v5

    - name: Create release assets
      id: create-assets
      if: (inputs.mode == 'all' && inputs.create-release-assets == 'true') || inputs.mode == 'release'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        RELEASE_TOKEN: ${{ inputs.github-token }}
        ASSET_NAME: ${{ inputs.asset-name }}
        BUILD_DIR: ${{ inputs.build-dir }}
        SIZE_MB: ${{ steps.prepare.outputs.size-mb }}
        FILE_COUNT: ${{ steps.prepare.outputs.file-count }}
      run: |
        # Guard: release assets need a tag trigger and a token. Skip cleanly
        # off-tag; fail fast on a missing token (clear misconfiguration) so the
        # upload step does not error mid-flight.
        if [ "$MODE" = release ]; then
          ASKED="mode is release"
        else
          ASKED="create-release-assets is enabled"
        fi
        if [ "$GITHUB_REF_TYPE" != "tag" ]; then
          echo "::warning::$ASKED but this run was not triggered by a tag (GITHUB_REF_TYPE='$GITHUB_REF_TYPE'); skipping release assets."
          echo "assets-created=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        if [ -z "$RELEASE_TOKEN" ]; then
          echo "::error::$ASKED but 'github-token' is empty. Pass a token via the github-token input (e.g. secrets.GITHUB_TOKEN)."
          exit 1
        fi

        # Default to the repository's name.
        [ -n "$ASSET_NAME" ] || ASSET_NAME="${GITHUB_REPOSITORY#*/}-html"

        # Written to RUNNER_TEMP, OUTSIDE build-dir, so the growing tarball
        # can't recurse into itself when build-dir is the cwd or a parent.
        TAG_NAME="$GITHUB_REF_NAME" OUT_DIR="$RUNNER_TEMP" COMMIT_SHA="$GITHUB_SHA" \
          REPOSITORY="$GITHUB_REPOSITORY" ASSET_NAME="$ASSET_NAME" \
          bash "$GITHUB_ACTION_PATH/../scripts/package-release-assets.sh"
        echo "assets-created=true" >> $GITHUB_OUTPUT

    - name: Upload release assets
      id: upload-release
      if: steps.create-assets.outputs.assets-created == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          ${{ steps.create-assets.outputs.archive-name }}
          ${{ steps.create-assets.outputs.checksum-name }}
          ${{ steps.create-assets.outputs.manifest-name }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Display Deployment Info
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CNAME: ${{ inputs.cname }}
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        ASSETS_CREATED: ${{ steps.create-assets.outputs.assets-created }}
      run: |
        echo "::group::Deployment Summary"
        case "$MODE" in
          upload)
            echo "✅ Uploaded as this run's github-pages artifact, for a later job's mode: deploy"
            ;;
          all|deploy)
            echo "✅ Deployment successful!"
            echo "📍 Page URL: $PAGE_URL"
            ;;
          release)
            [ "$ASSETS_CREATED" == "true" ] || echo "No release assets: this run was not triggered by a tag"
            ;;
        esac
        if [ -n "$CNAME" ]; then
          echo "🌐 CNAME file: $CNAME (the custom domain itself is set in Settings -> Pages)"
        fi
        if [ "$ASSETS_CREATED" == "true" ]; then
          echo "📦 Release assets uploaded to: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
        fi
        echo "::endgroup::"

branding:
  icon: 'globe'
  color: 'blue'
