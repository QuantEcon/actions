name: 'Publish to GitHub Pages'
description: >-
  Publishes a built site to GitHub Pages with GitHub's own Pages deploy, so no gh-pages branch is
  needed. On a tag it can also attach the site to the release, as an archive with its checksum and
  a manifest.
author: 'QuantEcon'

# Each description below is copied verbatim into the user manual
# (docs/user/actions/publish-gh-pages.md) by scripts/generate-docs.py, so it is
# written for a reader.
inputs:
  build-dir:
    description: >-
      The directory that holds the built site, such as `_build/html`, which `build-lectures` gives
      in its `build-path` output. The job fails if it does not exist.
    required: true
  cname:
    description: >-
      A domain to write into `build-dir` as a `CNAME` file, which also lands in the release
      archive. It does not set the site's custom domain, and a warning says so: a GitHub Actions
      Pages deploy ignores `CNAME` files, so set the domain under Settings, Pages. Empty, the
      default, writes no file.
    required: false
    default: ''
  create-release-assets:
    description: >-
      `'true'` also attaches the site to the GitHub release of the tag the run was triggered by,
      creating the release if there is none: an archive, its SHA-256 checksum and a manifest. It
      needs `github-token`, and a run triggered by a tag: any other run skips it, with a warning.
      `'false'`, the default, attaches nothing.
    required: false
    default: 'false'
  asset-name:
    description: >-
      With `create-release-assets: 'true'`: the start of each asset's file name. Empty, the
      default, uses the repository's name followed by `-html`, as in `<repository>-html`.
    required: false
    default: ''
  github-token:
    description: >-
      With `create-release-assets: 'true'`: a token that can write the repository's releases,
      such as `secrets.GITHUB_TOKEN` in a job with `contents: write`. The job fails if it is
      empty. The Pages deploy does not use it.
    required: false
    default: ''

outputs:
  page-url:
    description: >-
      The URL of the published site, as GitHub Pages reports it: `https://<owner>.github.io/<repository>/`,
      or the custom domain's. Set once the deploy succeeds.
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: "composite"
  steps:
    - name: Prepare build directory
      id: prepare
      shell: bash
      env:
        CNAME: ${{ inputs.cname }}
      run: |
        echo "Preparing build directory: ${{ inputs.build-dir }}"
        
        # Verify build directory exists
        if [ ! -d "${{ inputs.build-dir }}" ]; then
          echo "❌ Error: Build directory not found: ${{ inputs.build-dir }}"
          exit 1
        fi
        
        # Count files
        FILE_COUNT=$(find "${{ inputs.build-dir }}" -type f | wc -l)
        echo "📊 Files to deploy: $FILE_COUNT"
        echo "file-count=$FILE_COUNT" >> $GITHUB_OUTPUT
        
        # Calculate size
        SIZE=$(du -sh "${{ inputs.build-dir }}" | cut -f1)
        SIZE_MB=$(du -sm "${{ inputs.build-dir }}" | cut -f1)
        echo "💾 Total size: $SIZE"
        echo "size-mb=$SIZE_MB" >> $GITHUB_OUTPUT
        
        # Add CNAME file if specified. It still lands in the release tarball,
        # but the Pages deploy below (configure-pages -> upload-pages-artifact
        # -> deploy-pages) never reads it: with a GitHub Actions Pages source
        # the custom domain lives only in the repository's Pages settings.
        if [ -n "$CNAME" ]; then
          echo "$CNAME" > "${{ inputs.build-dir }}/CNAME"
          echo "🌐 Added CNAME: $CNAME"
          echo "::warning::cname has no effect on the GitHub Pages deployment: a GitHub Actions Pages deploy ignores CNAME files. Set the custom domain in Settings -> Pages -> Custom domain (the CNAME file is still written into build-dir)."
        fi
        
        echo "✅ Preparation complete"

    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ${{ inputs.build-dir }}

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5

    - name: Create release assets
      id: create-assets
      if: inputs.create-release-assets == 'true'
      shell: bash
      env:
        RELEASE_TOKEN: ${{ inputs.github-token }}
      run: |
        # Guard: release assets need a tag trigger and a token. Skip cleanly
        # off-tag; fail fast on a missing token (clear misconfiguration) so the
        # upload step does not error mid-flight.
        if [ "$GITHUB_REF_TYPE" != "tag" ]; then
          echo "::warning::create-release-assets is enabled but this run was not triggered by a tag (GITHUB_REF_TYPE='$GITHUB_REF_TYPE'); skipping release assets."
          echo "assets-created=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        if [ -z "$RELEASE_TOKEN" ]; then
          echo "::error::create-release-assets is enabled but 'github-token' is empty. Pass a token via the github-token input (e.g. secrets.GITHUB_TOKEN)."
          exit 1
        fi

        # Determine asset name
        ASSET_NAME="${{ inputs.asset-name }}"
        if [ -z "$ASSET_NAME" ]; then
          # Default to repo name
          ASSET_NAME="${GITHUB_REPOSITORY#*/}-html"
        fi
        
        TAG_NAME="${GITHUB_REF_NAME}"
        ARCHIVE_NAME="${ASSET_NAME}-${TAG_NAME}.tar.gz"
        
        echo "📦 Creating release assets..."
        echo "   Archive: $ARCHIVE_NAME"
        
        # Write assets to a temp dir OUTSIDE build-dir so the growing tarball
        # can't recurse into itself when build-dir is the cwd or a parent.
        ARCHIVE_PATH="${RUNNER_TEMP}/${ARCHIVE_NAME}"
        CHECKSUM_PATH="${RUNNER_TEMP}/${ASSET_NAME}-checksum.txt"
        MANIFEST_PATH="${RUNNER_TEMP}/${ASSET_NAME}-manifest.json"

        # Create tarball
        tar -czf "$ARCHIVE_PATH" -C "${{ inputs.build-dir }}" .

        # Create checksum (reference just the archive filename, not the path)
        ( cd "${RUNNER_TEMP}" && sha256sum "$ARCHIVE_NAME" > "$CHECKSUM_PATH" )

        # Create manifest
        cat > "$MANIFEST_PATH" << EOF
        {
          "name": "$ASSET_NAME",
          "tag": "$TAG_NAME",
          "commit": "$GITHUB_SHA",
          "timestamp": "$(date -Iseconds)",
          "size_mb": ${{ steps.prepare.outputs.size-mb }},
          "file_count": ${{ steps.prepare.outputs.file-count }},
          "repository": "$GITHUB_REPOSITORY"
        }
        EOF
        
        echo "assets-created=true" >> $GITHUB_OUTPUT
        echo "archive-name=$ARCHIVE_PATH" >> $GITHUB_OUTPUT
        echo "checksum-name=$CHECKSUM_PATH" >> $GITHUB_OUTPUT
        echo "manifest-name=$MANIFEST_PATH" >> $GITHUB_OUTPUT
        echo "✅ Release assets created"

    - name: Upload release assets
      id: upload-release
      if: inputs.create-release-assets == 'true' && steps.create-assets.outputs.assets-created == 'true'
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          ${{ steps.create-assets.outputs.archive-name }}
          ${{ steps.create-assets.outputs.checksum-name }}
          ${{ steps.create-assets.outputs.manifest-name }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Display Deployment Info
      shell: bash
      env:
        CNAME: ${{ inputs.cname }}
      run: |
        echo "::group::Deployment Summary"
        echo "✅ Deployment successful!"
        echo "📍 Page URL: ${{ steps.deployment.outputs.page_url }}"
        if [ -n "$CNAME" ]; then
          echo "🌐 CNAME file: $CNAME (the custom domain itself is set in Settings -> Pages)"
        fi
        if [ "${{ steps.create-assets.outputs.assets-created }}" == "true" ]; then
          echo "📦 Release assets uploaded to: https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
        fi
        echo "::endgroup::"

branding:
  icon: 'globe'
  color: 'blue'
