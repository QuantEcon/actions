name: 'Preview Netlify'
description: >-
  Deploys a pull request's built site to Netlify as a preview, at a URL that stays the same for
  every push, and comments on the pull request with it and with links to the lectures it changes.
author: 'QuantEcon'

# Each description below is copied verbatim into the user manual
# (docs/user/actions/preview-netlify.md) by scripts/generate-docs.py, so it is
# written for a reader.
inputs:
  netlify-auth-token:
    description: >-
      A Netlify personal access token, from a repository secret such as
      `secrets.NETLIFY_AUTH_TOKEN`. It reaches `netlify-cli` through the environment, never on its
      command line. Required for a deploy: a run that would deploy without it fails before
      anything is installed. Leave it out with `placeholder: 'true'`.
    required: false
  netlify-site-id:
    description: >-
      The ID of the Netlify site to deploy to, from a repository secret such as
      `secrets.NETLIFY_SITE_ID`. Required for a deploy, as `netlify-auth-token` is. Leave it out
      with `placeholder: 'true'`.
    required: false
  build-dir:
    description: >-
      The directory that holds the built site, such as `_build/html`, which `build-lectures` gives
      in its `build-path` output. Required for a deploy, as `netlify-auth-token` is.
    required: false
  lectures-dir:
    description: >-
      The directory of lecture `.md` files that change detection looks in, as a path from the
      repository root such as `lectures`, with no `./` or trailing slash: each lecture the pull
      request added or modified gets a link in the comment, and is listed in `changed-files`. Empty
      turns change detection off, and the comment gives only the preview URL.
    required: false
    default: 'lectures'
  dispatch-alias:
    description: >-
      Deploys on `workflow_dispatch` and `schedule` events too, to this alias, such as
      `dispatch-canary`, at `https://<alias>--<site>.netlify.app`. It must start with `dispatch-`,
      which keeps it clear of every pull request's `pr-<number>`, and be lowercase letters and
      digits in words joined by single dashes, at most 28 characters in all. Any other value fails
      the job, on every event. Such a run has no comment and no changed lectures, and a pull
      request ignores the input. Empty, the default, deploys on `pull_request` only.
    required: false
    default: ''
  placeholder:
    description: >-
      `'true'` posts the pull request's preview comment at once, before there is a build to
      deploy, and deploys nothing. The comment has the preview's URL and links to the lectures the
      pull request changes, all built from its number and `netlify-site-name`, and says that they
      show the last deployed push until this one's deploy finishes; the deploy's comment then
      replaces it. It needs no checkout and no secret, so it runs in a job of its own, with no
      `needs:`. It posts only where a deploy would run, so not for a pull request from a fork or
      by Dependabot, nor on any other event. Any value but `'true'` or `'false'` fails the job.
    required: false
    default: 'false'
  netlify-site-name:
    description: >-
      The Netlify site's name, as in `<name>.netlify.app`, from which `placeholder: 'true'` builds
      the preview URL, `https://pr-<number>--<name>.netlify.app`. Required with `placeholder:
      'true'`, where it must be lowercase letters, digits and dashes, or the job fails; not used
      otherwise.
    required: false
    default: ''

outputs:
  deployed:
    description: >-
      `'true'` when this run deployed a preview, so that `deploy-url` is set, and `'false'` when it
      did not: then a notice or a warning in the log says why, or `placeholder` is `'true'`. A
      scheduled or dispatched check should assert `deployed == 'true'`, or it passes without
      testing the deploy.
    value: ${{ steps.deploy.outputs.deploy-url != '' && 'true' || 'false' }}
  deploy-url:
    description: >-
      The preview's URL, `https://pr-<number>--<site>.netlify.app`, the same for every push to the
      pull request, or `https://<dispatch-alias>--<site>.netlify.app` on a `workflow_dispatch` or
      `schedule` run. Empty when nothing was deployed.
    value: ${{ steps.deploy.outputs.deploy-url }}
  changed-files:
    description: >-
      The lecture files under `lectures-dir` that the pull request added or modified, one path per
      line, compared from the commit where it branched off. When a shallow checkout's history does
      not reach that commit within 1,024 commits, the comparison starts from the base branch's tip
      instead, with a warning, so a lecture changed only on the base branch is listed too. When git
      fails, the action warns and lists none.
      Empty when there are none, with `lectures-dir: ''`, on an event other than
      `pull_request`, for a pull request from a fork or by Dependabot, and with `placeholder:
      'true'`.
    value: ${{ steps.detect-changes.outputs.changed-files }}

runs:
  using: "composite"
  steps:
    # One decision for the whole run (#227): every step below follows
    # `deploy`. The event allow-list, the Dependabot and fork checks and the
    # dispatch-alias rules are in the script, shared with preview-cloudflare.
    - name: Decide whether to deploy
      id: decide
      shell: bash
      env:
        PROVIDER: Netlify
        EVENT_NAME: ${{ github.event_name }}
        ACTOR: ${{ github.actor }}
        REPOSITORY: ${{ github.repository }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DISPATCH_ALIAS: ${{ inputs.dispatch-alias }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/preview-decide.sh"

    # The inputs each mode needs, checked before anything is installed. The
    # placeholder's on every event, as dispatch-alias is, so a typo shows on
    # the next pull request. A deploy's only when one will run: a fork's pull
    # request, which is skipped, gets no secrets. The secrets themselves never
    # reach this step, only whether they are set.
    - name: Check the inputs
      id: check-inputs
      shell: bash
      env:
        PLACEHOLDER: ${{ inputs.placeholder }}
        DEPLOY: ${{ steps.decide.outputs.deploy }}
        SITE_NAME: ${{ inputs.netlify-site-name }}
        HAVE_TOKEN: ${{ inputs.netlify-auth-token != '' }}
        HAVE_SITE_ID: ${{ inputs.netlify-site-id != '' }}
        HAVE_BUILD_DIR: ${{ inputs.build-dir != '' }}
        BUILD_DIR: ${{ inputs.build-dir }}
        LECTURES_DIR: ${{ inputs.lectures-dir }}
      run: |
        # shellcheck source=scripts/workflow-command.sh
        . "$GITHUB_ACTION_PATH/../scripts/workflow-command.sh"
        # Each of these is one value, and a line break in one would end the
        # line that prints it, and could start a workflow command (#267).
        single_line "build-dir=$BUILD_DIR" "lectures-dir=$LECTURES_DIR" || exit 1
        case "$PLACEHOLDER" in
          true|false) ;;
          *) echo "::error::placeholder is [$(esc "$PLACEHOLDER")], not 'true' or 'false'"; exit 1 ;;
        esac
        if [ "$PLACEHOLDER" = true ]; then
          # A Netlify site name is one DNS label.
          if ! [[ $SITE_NAME =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "::error::placeholder: 'true' needs netlify-site-name, the site's name as in <name>.netlify.app, in lowercase letters, digits and dashes; it is [$(esc "$SITE_NAME")]"
            exit 1
          fi
          for given in "netlify-auth-token=$HAVE_TOKEN" "netlify-site-id=$HAVE_SITE_ID"; do
            [ "${given#*=}" != true ] \
              || echo "::warning::${given%%=*} is not used with placeholder: 'true'. Leave it out, so that the placeholder's job holds no deploy secret."
          done
        elif [ "$DEPLOY" = true ]; then
          missing=()
          [ "$HAVE_TOKEN" = true ] || missing+=(netlify-auth-token)
          [ "$HAVE_SITE_ID" = true ] || missing+=(netlify-site-id)
          [ "$HAVE_BUILD_DIR" = true ] || missing+=(build-dir)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::A deploy needs netlify-auth-token, netlify-site-id and build-dir, and this run has no ${missing[*]}. A secret that the repository does not have is empty."
            exit 1
          fi
        fi

    - name: Detect Changed Lecture Files
      id: detect-changes
      if: steps.decide.outputs.deploy == 'true' && inputs.placeholder != 'true' && inputs.lectures-dir != '' && github.event_name == 'pull_request'
      shell: bash
      env:
        LECTURES_DIR: ${{ inputs.lectures-dir }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/../scripts/detect-changed-lectures.sh"

    - name: Install Netlify CLI
      id: install-cli
      # Exactly the deploy's condition, so the CLI is installed only for a
      # deploy that will run (#193). The placeholder deploys nothing.
      if: steps.decide.outputs.deploy == 'true' && inputs.placeholder != 'true'
      shell: bash
      run: |
        # Exactly the version in package.json / package-lock.json beside this
        # file, not `netlify-cli@latest` (#105): this CLI is handed the deploy
        # token, so it is pinned like every third-party Action in this repo,
        # and Dependabot's npm entry keeps the pin current.
        #
        # Installed into a fresh directory under RUNNER_TEMP rather than
        # $GITHUB_ACTION_PATH, which in a container job is the _actions directory
        # mounted from the host. RUNNER_TEMP is cleared between jobs, so nothing
        # accumulates on a persistent self-hosted runner, as it would in /tmp.
        # Install scripts stay on, as they were for the global install.
        D="$(mktemp -d "${RUNNER_TEMP:-/tmp}/preview-netlify.XXXXXX")"
        cp "$GITHUB_ACTION_PATH/package.json" "$GITHUB_ACTION_PATH/package-lock.json" "$D/"
        npm ci --prefix "$D" --no-audit --no-fund \
          || { echo "::error::npm ci of the pinned netlify-cli failed — see the npm output above (it needs registry.npmjs.org)"; exit 1; }

        NETLIFY="$D/node_modules/.bin/netlify"
        "$NETLIFY" --version \
          || { echo "::error::netlify-cli installed but does not run — see the output above"; exit 1; }
        echo "bin=$NETLIFY" >> "$GITHUB_OUTPUT"

        # The old `npm install -g` left netlify on PATH for later steps in the
        # caller's job; keep that, but expose only the CLI's own executables,
        # not every dependency bin in node_modules/.bin (esbuild, tsc, semver,
        # ...), which would shadow the caller's tools. The deploy step below
        # uses the absolute path.
        mkdir "$D/bin"
        for b in netlify ntl; do
          if [ -e "$D/node_modules/.bin/$b" ]; then ln -s "$D/node_modules/.bin/$b" "$D/bin/$b"; fi
        done
        echo "$D/bin" >> "$GITHUB_PATH"

    - name: Deploy to Netlify
      id: deploy
      if: steps.decide.outputs.deploy == 'true' && inputs.placeholder != 'true'
      shell: bash
      env:
        # netlify-cli reads both natively: the token as the fallback for
        # --auth, the site as the default for `deploy --site`. So the token is
        # no longer on the command line, where the old `--auth=` flag put it,
        # nor interpolated into the step script the runner writes to disk.
        NETLIFY_AUTH_TOKEN: ${{ inputs.netlify-auth-token }}
        NETLIFY_SITE_ID: ${{ inputs.netlify-site-id }}
        # Read from env rather than interpolated into the script body, matching
        # preview-cloudflare and the comment step below.
        ALIAS: ${{ steps.decide.outputs.alias }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REF_NAME: ${{ github.ref_name }}
        # The pull request's head, or on a dispatched or scheduled run the
        # commit it ran on.
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BUILD_DIR: ${{ inputs.build-dir }}
        NETLIFY: ${{ steps.install-cli.outputs.bin }}
      run: |
        SHORT_SHA="${COMMIT_SHA:0:7}"
        if [ "$EVENT_NAME" = "pull_request" ]; then
          WHAT="PR #${PR_NUMBER}"
        else
          WHAT="${EVENT_NAME} on ${REF_NAME}"
        fi

        echo "🔍 Deploying preview for ${WHAT} to ${ALIAS}..."

        # Only stdout goes to the file, because that is where --json writes
        # its result. stderr stays on the log: it carries netlify's readable
        # errors, and on a successful deploy it can carry npm or Node notices
        # that would corrupt the JSON if merged in.
        #
        # `set +e` because the step runs under `bash -eo pipefail`: a failing
        # netlify would otherwise abort the step before EXIT= could read
        # PIPESTATUS, and the output dump used to sit after that point (#105).
        JSON="$(mktemp)"
        echo "::group::Deployment Output"
        set +e
        # --no-build: the site is prebuilt. Without it, netlify-cli 27 runs any
        # configured build command first, in a process that inherits the token.
        "$NETLIFY" deploy \
          --no-build \
          --dir="${BUILD_DIR}" \
          --alias="${ALIAS}" \
          --message="${WHAT} (${SHORT_SHA})" \
          --json | tee "$JSON"
        EXIT=${PIPESTATUS[0]}
        set -e
        # --json output has no trailing newline, and a workflow command is only
        # read at the start of a line, so end the line or ::endgroup:: is text.
        [ -z "$(tail -c 1 "$JSON")" ] || echo
        echo "::endgroup::"

        if [ "$EXIT" -ne 0 ]; then
          echo "❌ Error: Netlify deployment failed"
          echo "::error::netlify deploy failed (exit $EXIT) — see the Deployment Output group above"
          exit "$EXIT"
        fi

        # Extract URL from JSON output (use Python instead of jq for container compatibility).
        # `|| true`: under `set -e` a parse failure used to abort the step here,
        # so the guard below never saw the non-JSON output it was written for.
        DEPLOY_URL="$(python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('deploy_url') or d.get('url',''))" < "$JSON" 2>/dev/null || true)"

        # Validate deployment URL
        if [ -z "$DEPLOY_URL" ]; then
          echo "❌ Error: Failed to extract deployment URL from Netlify response"
          echo "Raw output was:"
          cat "$JSON"
          [ -z "$(tail -c 1 "$JSON")" ] || echo
          echo "::error::no deploy URL in netlify's --json output — see the raw output above"
          exit 1
        fi

        echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

        echo "✅ Deployment successful!"
        echo "📍 URL: $DEPLOY_URL"
        # No pull request means no comment, so put the URL on the run's
        # summary page instead.
        [ "$EVENT_NAME" = "pull_request" ] || echo "::notice::Netlify preview deployed to $DEPLOY_URL"

    # The comment is built and posted by a script shared with
    # preview-cloudflare (#153). Its path is resolved here, from
    # $GITHUB_ACTION_PATH, as the steps above find theirs: in a container job,
    # `github.action_path` gives the runner's path, which the container does
    # not have. The two steps run after a deploy, and for the placeholder,
    # whose pending comment the deploy's comment later replaces.
    - name: Find the comment script
      id: comment-script
      if: steps.decide.outputs.deploy == 'true' && github.event_name == 'pull_request' && (inputs.placeholder == 'true' || steps.deploy.outputs.deploy-url != '')
      shell: bash
      run: |
        SCRIPT="$GITHUB_ACTION_PATH/../scripts/preview-comment.cjs"
        [ -f "$SCRIPT" ] || { echo "::error::the comment script is missing from the action: $SCRIPT"; exit 1; }
        echo "path=$SCRIPT" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      id: comment
      if: steps.decide.outputs.deploy == 'true' && github.event_name == 'pull_request' && (inputs.placeholder == 'true' || steps.deploy.outputs.deploy-url != '')
      uses: actions/github-script@v9
      env:
        PREVIEW_COMMENT_SCRIPT: ${{ steps.comment-script.outputs.path }}
        # Picks the comment's heading and hidden marker in the script.
        PROVIDER: netlify
        PREVIEW_STATE: ${{ inputs.placeholder == 'true' && 'pending' || 'ready' }}
        DEPLOY_URL: ${{ steps.deploy.outputs.deploy-url }}
        # The placeholder builds the URL from these, having no deploy to ask.
        PREVIEW_ALIAS: ${{ steps.decide.outputs.alias }}
        PREVIEW_SITE: ${{ inputs.netlify-site-name }}
        CHANGED_FILES: ${{ steps.detect-changes.outputs.changed-files }}
        LECTURES_DIR: ${{ inputs.lectures-dir }}
        STRIP_LECTURES_DIR: ${{ steps.detect-changes.outputs.strip-lectures-dir }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
      with:
        github-token: ${{ github.token }}
        # Untrusted PR data (file paths, deploy URL) is read from env by the
        # script, never interpolated into this body (avoids script injection).
        script: |
          await require(process.env.PREVIEW_COMMENT_SCRIPT).run({ github, context, core });

branding:
  icon: 'upload-cloud'
  color: 'blue'
