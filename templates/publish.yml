# Publish Workflow (GitHub Pages)
#
# Builds the lecture site and deploys it to GitHub Pages when changes are
# pushed to main, in two jobs:
#   build   restores the execution cache, so only changed notebooks are
#           re-executed, builds the site, and uploads it as the run's
#           github-pages artifact.
#   deploy  deploys that artifact to GitHub Pages.
#
# Why two jobs: building the lectures runs code the repository does not fully
# control (notebook cells, packages installed at build time, network
# fetches), and code that runs earlier in a job can affect the steps after
# it. So the Pages permissions are only in the deploy job, which runs no
# notebook or repository code, and the build job has only read access.
# Release assets need contents: write, so they get a third job of their own,
# at the end of this file.
#
# Copy to your repository as .github/workflows/publish.yml
#
# Prerequisites:
#   1. cache.yml workflow running (provides the caches)
#   2. GitHub Pages enabled: Settings → Pages → Source → "GitHub Actions"
#   3. (Optional) Custom domain configured in Settings → Pages → Custom domain.
#      That setting is the only one that applies: this deploy ignores a CNAME
#      file, so publish-gh-pages' `cname` input has no effect.
#
# Action versions: @v0 = latest 0.x release (floating); pin @v0.x.y for reproducibility. Latest at:
#   https://github.com/quantecon/actions/releases

name: Publish

on:
  push:
    branches:
      - main

  workflow_dispatch:
    # Manual trigger for re-deployment without code changes

# Only one publish at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ─── Build ───────────────────────────────────────────────────────
  # Builds the site and uploads it for the deploy job. It holds only read
  # access, because it runs the notebooks.
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/quantecon/quantecon:latest
      # ─── Standard Runner Alternative ───────────────────────────────
      # Remove the 'container' block and uncomment the
      # setup-environment 'with' block below.
      # ───────────────────────────────────────────────────────────────

    permissions:
      contents: read
      packages: read            # Required for container image pull

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: each page's "Last changed" date and changelog come
          # from git log. A shallow clone dates every page to the checkout commit.
          fetch-depth: 0
          # The build runs notebook code, and git log needs only the history
          # fetched here, so leave no token in git's config for it.
          persist-credentials: false

      # ─── Environment Setup ───────────────────────────────────────
      - name: Setup environment
        uses: quantecon/actions/setup-environment@v0
        # with:
        #   environment-update: 'environment.yml'   # Delta packages for container
        #   install-latex: 'true'                    # Required for pdflatex builds
        #   latex-requirements-file: 'latex-requirements.txt'
        #
        # ─── Standard Runner (non-container) ──────────────────────
        # with:
        #   environment: 'environment.yml'
        #   python-version: '3.13'
        #   install-latex: 'true'

      # ─── Cache Restore ───────────────────────────────────────────
      # Only _build/.jupyter_cache, not the whole _build, so nothing
      # deleted from the source since the cache build, such as a removed
      # lecture's notebook or PDF, is published again. Its key hashes
      # the environment, so a publish never restores outputs that
      # other packages made.
      - name: Restore execution cache
        uses: quantecon/actions/restore-jupyter-cache@v0
        with:
          cache-type: 'execution'      # _build/.jupyter_cache only

      # ─── Build ───────────────────────────────────────────────────
      # Build HTML (and optionally other formats). The cache gives
      # Jupyter Book pre-executed notebooks, so only changed lectures
      # are re-executed.

      # Optional: Build notebooks for download links
      # - name: Build notebooks
      #   uses: quantecon/actions/build-lectures@v0
      #   with:
      #     builder: 'jupyter'
      #     source-dir: 'lectures'

      # Optional: Build PDF for download link
      # - name: Build PDF
      #   uses: quantecon/actions/build-lectures@v0
      #   with:
      #     builder: 'pdflatex'
      #     source-dir: 'lectures'

      - name: Build HTML
        uses: quantecon/actions/build-lectures@v0
        with:
          builder: 'html'
          source-dir: 'lectures'
          extra-args: '-W --keep-going'
          # nitpick: 'false'                # Without -n, Sphinx's nitpicky mode
          upload-failure-reports: 'true'
          # html-copy-pdf: 'true'           # Enable if pdflatex build runs above
          # html-copy-notebooks: 'true'     # Enable if jupyter build runs above

      # ─── Hand-off to release-assets (optional) ───────────────────
      # Uncomment with the release-assets job at the end of this file. It
      # comes before the Pages upload, which writes any `cname` into the
      # site, so the release job measures the site as the build left it.
      # include-hidden-files: upload-artifact skips files whose names start
      # with a dot unless told otherwise, and the archive holds every file.
      # - name: Upload the site for release assets
      #   if: github.ref_type == 'tag'
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: html
      #     path: _build/html
      #     include-hidden-files: true
      #     if-no-files-found: error
      #     retention-days: 1

      # ─── Upload ──────────────────────────────────────────────────
      - name: Upload the site for GitHub Pages
        uses: quantecon/actions/publish-gh-pages@v0
        with:
          mode: 'upload'            # The deploy job below deploys it
          build-dir: '_build/html'
          # Custom domain: set it in Settings → Pages (see Prerequisites).
          # The `cname` input just writes a CNAME file, which this deploy ignores.

  # ─── Deploy ──────────────────────────────────────────────────────
  # Deploys the build job's github-pages artifact to GitHub Pages. It is the
  # only job that holds the Pages permissions, so it runs nothing but the
  # deploy: no checkout, no container. It needs no GPU, so it stays on
  # ubuntu-latest wherever the build job runs. It is skipped when the build
  # job fails.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write              # Required for GitHub Pages deployment
      id-token: write           # Required for GitHub Pages OIDC

    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page-url }}

    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: quantecon/actions/publish-gh-pages@v0
        with:
          mode: 'deploy'

  # ─── Release Assets (optional) ───────────────────────────────────
  # Attaches the site to the tag's GitHub release, as an archive, its
  # checksum and a manifest, once the deploy has succeeded. It is a job of
  # its own because the release upload needs contents: write, which neither
  # job above should hold. As shipped, this file makes none; it needs four
  # changes first:
  #   1. A tag trigger. Add, e.g., `tags: ['publish*']` under `on.push`.
  #   2. The tag pattern (e.g. `publish*`) allowed under Settings →
  #      Environments → github-pages → Deployment branches and tags.
  #      By default only the default branch may deploy there, so environment
  #      protection rejects the deploy job on a tag run.
  #   3. The build job's "Upload the site for release assets" step,
  #      uncommented.
  #   4. This job, uncommented. A site that passes `cname` to the upload
  #      passes it here too, so that the archive holds the CNAME file.
  #
  # release-assets:
  #   needs: [build, deploy]
  #   if: github.ref_type == 'tag'
  #   runs-on: ubuntu-latest
  #
  #   permissions:
  #     contents: write         # Required for the release upload
  #
  #   steps:
  #     - name: Download the site
  #       uses: actions/download-artifact@v8
  #       with:
  #         name: html
  #         path: _build/html
  #
  #     - name: Attach the site to the release
  #       uses: quantecon/actions/publish-gh-pages@v0
  #       with:
  #         mode: 'release'
  #         build-dir: '_build/html'
  #         asset-name: 'lecture-python-html'
  #         github-token: ${{ secrets.GITHUB_TOKEN }}
