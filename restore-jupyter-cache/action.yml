name: 'Restore Jupyter Cache'
description: >-
  Restores the cache that `build-jupyter-cache` saved, so a pull request or publish build re-executes
  only the notebooks that changed. It only restores by default, and can also save a cache for the
  later runs of the same pull request.
author: 'QuantEcon'

# Each description below is copied verbatim into the user manual
# (docs/user/actions/restore-jupyter-cache.md) by scripts/generate-docs.py, so
# it is written for a reader.
inputs:
  cache-type:
    description: >-
      What to restore. `build`, the default, restores the whole `_build` directory the last cache
      build saved: its HTML, PDF and notebooks, and the execution cache in `_build/.jupyter_cache`.
      `execution` restores only `_build/.jupyter_cache`, which holds each notebook's executed
      outputs.
    required: false
    default: 'build'
  path:
    description: >-
      The build directory to restore into. The path is part of what identifies a cache, so only
      `_build`, the default, finds the caches that `build-jupyter-cache` saves; any other path
      finds only what this action saved with `save-cache` and the same `path`. With
      `cache-type: execution` the cache goes into `<path>/.jupyter_cache`.
    required: false
    default: '_build'
  source-dir:
    description: >-
      With `cache-type: execution`: the book's directory. The key hashes every `.md` file under
      it, as `build-jupyter-cache` does with its own `source-dir`. Ignored for the build cache.
    required: false
    default: 'lectures'
  environment:
    description: >-
      With `cache-type: build`: the Conda environment file whose hash is part of the key. Give the
      same file that `build-jupyter-cache` was given, or no cache matches. Ignored for the
      execution cache.
    required: false
    default: 'environment.yml'
  environment-update:
    description: >-
      With `cache-type: build`: the container delta file whose hash is part of the key. Give the
      same file that `build-jupyter-cache` was given; with another, only the fallback matches,
      restoring the newest cache built from the same `environment`. Ignored for the execution
      cache.
    required: false
    default: ''
  key:
    description: >-
      A key to restore in place of the generated ones. It is matched as a prefix, so the newest
      cache whose key starts with it is restored, and with `save-cache: 'true'` the cache is saved
      under exactly this key. Empty, the default, uses the generated keys.
    required: false
    default: ''
  fail-on-miss:
    description: >-
      `'true'` fails the job when nothing is restored. `'false'`, the default, carries on without a
      cache, and the build starts from scratch.
    required: false
    default: 'false'
  save-cache:
    description: >-
      `'true'` also saves the directory at the end of the job, if the job succeeds, under a key
      that ends in the run id. GitHub scopes a cache to the branch or pull request that saved it,
      so only later runs of the same pull request restore it. `'false'`, the default, only
      restores.
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: >-
      `'true'` when a cache was restored, whether its key matched exactly or only as a prefix;
      `'false'` when nothing was restored. Always set. Unlike the `actions/cache` output of the
      same name, it counts a prefix match, which is how the generated keys always match.
    value: ${{ steps.restore.outputs.cache-matched-key != '' }}
  cache-key:
    description: >-
      The key of the cache that was restored: a saved key such as `build-<hash>-<hash>-<run id>`,
      not the prefix that found it. Empty when nothing was restored.
    value: ${{ steps.restore.outputs.cache-matched-key }}

runs:
  using: "composite"
  steps:
    - name: Determine cache key and restore-keys
      id: cache-key
      shell: bash
      run: |
        if [ -n "${{ inputs.key }}" ]; then
          # Custom key provided
          echo "key=${{ inputs.key }}" >> $GITHUB_OUTPUT
          echo "restore-keys=${{ inputs.key }}" >> $GITHUB_OUTPUT
          echo "Using custom cache key: ${{ inputs.key }}"
        elif [ "${{ inputs.cache-type }}" = "execution" ]; then
          # Execution cache: jupyter-cache-{content-hash}-{run-id}
          if [ "${{ inputs.save-cache }}" = "true" ]; then
            KEY="jupyter-cache-${{ hashFiles(format('{0}/**/*.md', inputs.source-dir)) }}-${{ github.run_id }}"
          else
            # Read-only restore: use the content prefix as the key. Saved keys
            # carry a -{run_id} suffix, so this never exact-matches and the
            # restore falls through to restore-keys prefix matching — same
            # result, but the "Requested Key" report is honest.
            KEY="jupyter-cache-${{ hashFiles(format('{0}/**/*.md', inputs.source-dir)) }}-"
          fi
          echo "key=$KEY" >> $GITHUB_OUTPUT
          echo "restore-keys<<EOF" >> $GITHUB_OUTPUT
          echo "jupyter-cache-${{ hashFiles(format('{0}/**/*.md', inputs.source-dir)) }}-" >> $GITHUB_OUTPUT
          echo "jupyter-cache-" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Using execution cache with prefix match"
        else
          # Build cache: build-{env-hash}-{update-hash}-{run-id}
          ENV_HASH="${{ hashFiles(inputs.environment) }}"
          UPDATE_HASH="${{ hashFiles(inputs.environment-update) }}"
          if [ "${{ inputs.save-cache }}" = "true" ]; then
            KEY="build-${ENV_HASH}-${UPDATE_HASH}-${{ github.run_id }}"
          else
            # Read-only restore: use the content prefix as the key (see note above).
            KEY="build-${ENV_HASH}-${UPDATE_HASH}-"
          fi
          echo "key=$KEY" >> $GITHUB_OUTPUT
          # Both fallbacks stay inside the same environment. A bare `build-`
          # prefix used to sit at the end of this list, which made the build
          # cache impossible to miss: changing environment.yml would silently
          # restore a _build produced by the old environment instead of missing
          # and rebuilding, contradicting what the status report below tells the
          # user ("normal ... after environment.yml changes"). Unlike
          # .jupyter_cache, which is content-addressed per notebook and so
          # revalidates itself, _build carries no record of what produced it.
          echo "restore-keys<<EOF" >> $GITHUB_OUTPUT
          echo "build-${ENV_HASH}-${UPDATE_HASH}-" >> $GITHUB_OUTPUT
          echo "build-${ENV_HASH}-" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Using build cache with prefix match"
        fi

    - name: Determine cache path
      id: cache-path
      shell: bash
      run: |
        if [ "${{ inputs.cache-type }}" = "execution" ]; then
          echo "path=${{ inputs.path }}/.jupyter_cache" >> $GITHUB_OUTPUT
        else
          echo "path=${{ inputs.path }}" >> $GITHUB_OUTPUT
        fi

    # The restore always runs through actions/cache/restore, in both modes,
    # because it is the only variant that reports `cache-matched-key` — the
    # top-level actions/cache declares `cache-hit` alone, and `cache-hit` is an
    # exact-match signal that a -{run_id} primary key can never satisfy. Every
    # output and guard below reads this one step.
    - name: Restore cache
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.cache-path.outputs.path }}
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.restore-keys }}

    # Registers the job-end save. actions/cache saves from a `post:` hook, which
    # is the only way a composite action can defer work to the end of the job:
    # actions/cache/save@v6 would run here instead, capturing _build before the
    # build has written anything to it. `lookup-only` stops this step from
    # re-downloading what the step above already restored, while still recording
    # the state the post hook needs. That hook skips saving only when the primary
    # key matched exactly, which the -{run_id} suffix rules out — so the save
    # happens on both a prefix hit and a total miss, as intended.
    - name: Register job-end cache save
      if: inputs.save-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache-path.outputs.path }}
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: ${{ steps.cache-key.outputs.restore-keys }}
        lookup-only: true

    - name: Cache status report
      shell: bash
      run: |
        echo ""
        echo "╔════════════════════════════════════════════════════════════════╗"
        echo "║                    BUILD CACHE STATUS                          ║"
        echo "╚════════════════════════════════════════════════════════════════╝"
        echo ""
        echo "  Cache Type:     ${{ inputs.cache-type }}"
        echo "  Requested Key:  ${{ steps.cache-key.outputs.key }}"
        echo "  Cache Hit:      ${{ steps.restore.outputs.cache-hit || 'false' }} (exact key match)"
        echo "  Matched Key:    ${{ steps.restore.outputs.cache-matched-key || 'none' }}"
        echo "  Save Cache:     ${{ inputs.save-cache }}"
        echo ""

        CACHE_PATH="${{ steps.cache-path.outputs.path }}"
        MATCHED_KEY="${{ steps.restore.outputs.cache-matched-key }}"
        
        # Check if cache was restored (via exact match OR prefix match)
        # With prefix matching, cache-hit is false but cache-matched-key is set
        if [ -n "$MATCHED_KEY" ]; then
          echo "════════════════════════════════════════════════════════════════════"
          echo "  ✅ Cache restored successfully"
          echo "════════════════════════════════════════════════════════════════════"
          echo ""
          
          if [ -d "$CACHE_PATH" ]; then
            echo "::group::Cache Contents"
            echo "Path: $CACHE_PATH"
            echo ""
            
            # Size information
            TOTAL_SIZE=$(du -sh "$CACHE_PATH" 2>/dev/null | cut -f1 || echo "unknown")
            echo "Total Size: $TOTAL_SIZE"
            echo ""
            
            # File count
            FILE_COUNT=$(find "$CACHE_PATH" -type f 2>/dev/null | wc -l | tr -d ' ')
            DIR_COUNT=$(find "$CACHE_PATH" -type d 2>/dev/null | wc -l | tr -d ' ')
            echo "Files: $FILE_COUNT"
            echo "Directories: $DIR_COUNT"
            echo ""
            
            # Directory breakdown
            echo "── Directory Sizes ──"
            du -sh "$CACHE_PATH"/* 2>/dev/null | head -10 || echo "  (empty or inaccessible)"
            echo ""
            
            # For execution cache, show notebook cache info
            if [ "${{ inputs.cache-type }}" = "execution" ]; then
              echo "── Jupyter Cache Info ──"
              if [ -f "$CACHE_PATH/global.db" ]; then
                DB_SIZE=$(du -sh "$CACHE_PATH/global.db" 2>/dev/null | cut -f1)
                echo "Cache database: $DB_SIZE"
              fi
              NB_CACHE_COUNT=$(find "$CACHE_PATH" -name "*.ipynb" 2>/dev/null | wc -l | tr -d ' ')
              echo "Cached notebooks: $NB_CACHE_COUNT"
            fi
            
            # For build cache, show _build structure
            if [ "${{ inputs.cache-type }}" = "build" ]; then
              echo "── Build Directories ──"
              for dir in html latex jupyter; do
                if [ -d "$CACHE_PATH/$dir" ]; then
                  SIZE=$(du -sh "$CACHE_PATH/$dir" 2>/dev/null | cut -f1)
                  COUNT=$(find "$CACHE_PATH/$dir" -type f 2>/dev/null | wc -l | tr -d ' ')
                  echo "  $dir/: $SIZE ($COUNT files)"
                fi
              done
              if [ -d "$CACHE_PATH/.jupyter_cache" ]; then
                SIZE=$(du -sh "$CACHE_PATH/.jupyter_cache" 2>/dev/null | cut -f1)
                echo "  .jupyter_cache/: $SIZE"
              fi
            fi
            
            echo "::endgroup::"
          else
            echo "::warning::Cache path does not exist after restore: $CACHE_PATH"
          fi
        else
          echo "════════════════════════════════════════════════════════════════════"
          echo "  ⚠️  No cache found"
          echo "════════════════════════════════════════════════════════════════════"
          echo ""
          echo "  This is normal for:"
          echo "    - First build on a new branch"
          echo "    - After environment.yml changes (build cache)"
          echo "    - After lecture content changes (execution cache)"
          echo ""
          echo "  The build will proceed without cached state."
          echo ""
        fi

    - name: Fail on cache miss
      if: inputs.fail-on-miss == 'true' && steps.restore.outputs.cache-matched-key == ''
      shell: bash
      run: |
        echo "::error::Cache miss with fail-on-miss enabled"
        echo "Expected cache key: ${{ steps.cache-key.outputs.key }}"
        echo ""
        echo "Ensure the cache generation workflow has run on main branch."
        exit 1

branding:
  icon: 'download-cloud'
  color: 'blue'
